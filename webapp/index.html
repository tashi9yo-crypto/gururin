<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연화생전 — 설산을 넘는 스승</title>
<meta name="description" content="구루 린뽀체의 전기를 바탕으로 한 장편 소설 『연화생전』을 책처럼 넘겨 읽는 웹 리더">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e2d4; --desk-2:#ddd3c0;
  --paper:#fbf7ef; --paper-edge:#efe6d6;
  --ink:#2b2420; --ink-soft:#5f544b; --ink-faint:#958877;
  --accent:#a2412b; --accent-soft:#c9876f; --gold:#a57d2c;
  --rule:#d9ccb6; --shadow:rgba(60,40,20,.18);
  --ui:#fffdf8; --ui-ink:#2b2420; --ui-line:#e3d8c5; --ui-hover:#f3ebdd;
  --sel:rgba(162,65,43,.18);
  --font-body:"Noto Serif KR","Gowun Batang","Nanum Myeongjo",serif;
  --font-ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs:18px; --lh:1.9;
}
:root[data-theme="sepia"]{
  --desk:#cdbb9a; --desk-2:#bfa984;
  --paper:#f3e6cb; --paper-edge:#e5d3ad;
  --ink:#3a2c1c; --ink-soft:#66503a; --ink-faint:#9a8160;
  --accent:#9b3b22; --accent-soft:#c07a55; --gold:#8e6a1f;
  --rule:#d2bd93; --shadow:rgba(70,45,10,.25);
  --ui:#f8eedb; --ui-ink:#3a2c1c; --ui-line:#dcc8a1; --ui-hover:#efe0c2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="sepia"]){
    --desk:#121110; --desk-2:#0b0a09;
    --paper:#1d1b19; --paper-edge:#161412;
    --ink:#e7dfd2; --ink-soft:#b9ad9c; --ink-faint:#857a6c;
    --accent:#e08a6d; --accent-soft:#b56a52; --gold:#d6b46a;
    --rule:#3a342e; --shadow:rgba(0,0,0,.5);
    --ui:#1f1d1a; --ui-ink:#e7dfd2; --ui-line:#34302b; --ui-hover:#2a2723;
    --sel:rgba(224,138,109,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{color-scheme:dark;
  --desk:#121110; --desk-2:#0b0a09;
  --paper:#1d1b19; --paper-edge:#161412;
  --ink:#e7dfd2; --ink-soft:#b9ad9c; --ink-faint:#857a6c;
  --accent:#e08a6d; --accent-soft:#b56a52; --gold:#d6b46a;
  --rule:#3a342e; --shadow:rgba(0,0,0,.5);
  --ui:#1f1d1a; --ui-ink:#e7dfd2; --ui-line:#34302b; --ui-hover:#2a2723;
  --sel:rgba(224,138,109,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--desk) 0%,var(--desk-2) 100%) fixed;
  background-color:var(--desk);
  color:var(--ink);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:var(--sel)}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── 표지 ───────── */
#cover{background:radial-gradient(120% 90% at 50% 0%,var(--desk) 0%,var(--desk-2) 100%);position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:30;overflow:auto}
#cover[hidden]{display:none}
.cover-book{
  position:relative;width:min(440px,100%);aspect-ratio:3/4.3;max-height:calc(100vh - 48px);
  background:linear-gradient(135deg,#7a2617 0%,#5b1a0f 55%,#40120a 100%);
  color:#f4e6c8;border-radius:6px 14px 14px 6px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55),inset 10px 0 18px -8px rgba(0,0,0,.55),inset -1px 0 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 28px;
}
.cover-book::before{content:"";position:absolute;inset:14px 14px 14px 22px;border:1px solid rgba(214,180,106,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover-book::after{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25)}
.cover-lotus{width:min(150px,38%);height:auto;margin-bottom:18px;color:#d6b46a}
.cover-title{font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(40px,11vw,58px);letter-spacing:.12em;margin:0;line-height:1.1}
.cover-hanja{font-family:"Noto Serif KR",serif;font-size:15px;letter-spacing:.6em;opacity:.75;margin:10px 0 0 .6em}
.cover-sub{font-family:"Noto Serif KR",serif;font-size:17px;margin:22px 0 0;letter-spacing:.08em;color:#e9cf98}
.cover-blurb{font-family:"Gowun Batang",serif;font-size:14.5px;line-height:1.8;max-width:30ch;margin:22px auto 0;opacity:.85}
.cover-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.btn{border:1px solid currentColor;background:transparent;border-radius:999px;padding:10px 20px;cursor:pointer;font-size:14px;letter-spacing:.02em;transition:background .2s,color .2s}
.cover-actions .btn{color:#f4e6c8;border-color:rgba(244,230,200,.6)}
.cover-actions .btn.primary{background:#d6b46a;color:#40120a;border-color:#d6b46a;font-weight:700}
.cover-actions .btn:hover{background:rgba(244,230,200,.12)}
.cover-actions .btn.primary:hover{background:#e6c77f}
.cover-foot{position:absolute;bottom:22px;left:0;right:0;font-size:11.5px;opacity:.6;letter-spacing:.15em}

/* ───────── 상단·하단 막대 ───────── */
.bar{position:fixed;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-left));transition:opacity .3s,transform .3s}
.topbar{top:0}
.botbar{bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom));flex-direction:column;align-items:stretch;gap:6px}
body.on-cover .bar{display:none}
body.scroll-mode .flow p{text-align:left}
body.ui-hidden .topbar{opacity:0;transform:translateY(-100%);pointer-events:none}
body.ui-hidden .botbar .controls{opacity:0;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);flex:none}
.icon-btn:hover{background:var(--ui-hover);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.running{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.running b{color:var(--ink);font-weight:500}
.progress{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 2px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-faint);transition:opacity .3s}
.controls .nav{display:flex;gap:4px}
.controls .pageno{font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* ───────── 책 ───────── */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:60px 16px 64px}
.book{position:relative;background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--paper-edge),0 2px 0 var(--paper-edge),0 3px 0 var(--paper-edge),0 24px 50px -18px var(--shadow),0 8px 18px -10px var(--shadow)}
.book.spread::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:56px;transform:translateX(-50%);background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) 40%,rgba(0,0,0,.13) 50%,rgba(0,0,0,.06) 60%,transparent 100%);pointer-events:none;z-index:2}
.book.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule);opacity:.7;z-index:2}
.viewport{position:relative;overflow:hidden}
.flow{
  height:100%;column-fill:auto;
  font-family:var(--font-body);font-size:var(--fs);line-height:var(--lh);color:var(--ink);
  word-break:normal;line-break:strict;overflow-wrap:break-word;hyphens:manual;
  transition:transform .55s cubic-bezier(.22,.7,.2,1);will-change:transform;
}
.flow.no-anim{transition:none}
.flow p{margin:0 0 .15em;text-indent:1em;text-align:justify}
.flow p + p{margin-top:0}
.flow h3,.flow h4{font-family:var(--font-body);break-after:avoid;margin:1.2em 0 .5em;line-height:1.5}
.flow h3{font-size:1.12em}
.flow h4{font-size:1em;color:var(--ink-soft)}
.flow strong{font-weight:700;color:var(--ink)}
.flow em{font-style:normal;color:var(--ink-soft);letter-spacing:.01em}
.flow ul{margin:.4em 0 .8em;padding-left:1.2em}
.flow li{margin:.2em 0}
.ornament{text-align:center;color:var(--gold);margin:1.1em 0;font-size:.95em;letter-spacing:1em;text-indent:1em;break-after:avoid}
.verse{margin:1em 0 1.1em;padding:.2em 0 .2em 1.1em;border-left:2px solid var(--accent-soft);font-family:"Gowun Batang",var(--font-body)}
.verse p{text-indent:0;margin:0 0 .7em;text-align:left;break-inside:avoid;color:var(--ink)}
.verse p:last-child{margin-bottom:0}
.table-wrap{margin:.8em 0 1em;font-family:var(--font-ui);font-size:.74em;line-height:1.55}
.table-wrap table{width:100%;border-collapse:collapse}
.table-wrap th,.table-wrap td{border-bottom:1px solid var(--rule);padding:.45em .4em;vertical-align:top;text-align:left}
.table-wrap th{color:var(--ink-soft);font-weight:700;border-bottom:1.5px solid var(--ink-faint)}
.table-wrap tr{break-inside:avoid}

/* 부 표제 쪽 */
.part-page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;break-after:column}
.part-page .lbl{font-family:var(--font-ui);font-size:.7em;letter-spacing:.5em;color:var(--accent);text-indent:.5em}
.part-page .ttl{font-size:1.9em;font-weight:700;margin:.5em 0 0;letter-spacing:.08em;line-height:1.35}
.part-page .rule{width:56px;height:1px;background:var(--gold);margin:1.3em auto 0}
/* 장 표제 */
.ch-head{text-align:center;margin:2.2em 0 2.2em;break-inside:avoid}
.ch-head .lbl{font-family:var(--font-ui);font-size:.68em;letter-spacing:.42em;color:var(--accent);text-indent:.42em}
.ch-head .ttl{word-break:keep-all;font-size:1.45em;font-weight:700;margin:.55em 0 0;line-height:1.45;letter-spacing:.02em}
.ch-head .epi{text-align:center;text-indent:0;word-break:keep-all;font-family:"Gowun Batang",var(--font-body);font-size:.86em;color:var(--ink-soft);margin:1.4em auto 0;max-width:24em;line-height:1.75}
.ch-head .epi::before,.ch-head .epi::after{content:"";display:block;width:28px;height:1px;background:var(--gold);margin:.9em auto}
.ch-end{text-align:center;margin:2.4em 0 1em;break-inside:avoid;font-family:var(--font-ui)}
.ch-end .fin{color:var(--ink-faint);font-size:.75em;letter-spacing:.4em;text-indent:.4em}
.ch-end .next{margin-top:1.4em;display:inline-flex;flex-direction:column;align-items:center;gap:.25em;border:1px solid var(--rule);border-radius:12px;padding:.8em 1.4em;background:transparent;cursor:pointer;color:var(--ink);font-size:.82em;transition:border-color .2s,background .2s}
.ch-end .next:hover{border-color:var(--accent);background:var(--ui-hover)}
.ch-end .next small{color:var(--ink-faint);font-size:.82em;letter-spacing:.15em}

/* 쪽 번호 */
.folio{position:absolute;bottom:14px;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;z-index:3}
.folio.l{left:0}.folio.r{right:0}

/* 넘기기 영역 */
.tap{position:absolute;top:0;bottom:0;width:28%;z-index:4;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap.prev{left:0;cursor:w-resize}.tap.next{right:0;cursor:e-resize}
.tap.mid{left:28%;right:28%;width:auto;cursor:default}

/* 두루마리(스크롤) 보기 */
body.scroll-mode{overflow:auto}
body.scroll-mode #stage{position:static;display:block;padding:72px 16px 96px}
body.scroll-mode .book{max-width:720px;margin:0 auto;padding:40px clamp(20px,6vw,64px)!important;width:auto!important;height:auto!important}
body.scroll-mode .book::before,body.scroll-mode .book::after{display:none}
body.scroll-mode .viewport{overflow:visible;width:auto!important;height:auto!important}
body.scroll-mode .flow{columns:auto!important;height:auto;transform:none!important}
body.scroll-mode .part-page{height:auto;padding:3em 0 2em}
body.scroll-mode .folio,body.scroll-mode .tap{display:none}

/* ───────── 서랍(목차)·설정 ───────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);background:var(--ui);color:var(--ui-ink);z-index:21;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:12px 0 40px -20px rgba(0,0,0,.4)}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 20px;border-bottom:1px solid var(--ui-line)}
.drawer header h2{flex:1;margin:0;font-family:"Noto Serif KR",serif;font-size:19px;letter-spacing:.06em}
.tabs{display:flex;gap:4px;padding:10px 16px 0}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--ui-hover);color:var(--ui-ink);font-weight:700}
.toc{flex:1;overflow:auto;padding:8px 8px 24px}
.toc .part{font-family:var(--font-ui);font-size:11.5px;letter-spacing:.2em;color:var(--accent);padding:16px 12px 6px;text-transform:none}
.toc .part span{color:var(--ink-faint);letter-spacing:.05em;margin-left:6px}
.toc a{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ui-ink);text-decoration:none;font-size:14.5px;line-height:1.45}
.toc a:hover{background:var(--ui-hover)}
.toc a.cur{background:var(--ui-hover);box-shadow:inset 3px 0 0 var(--accent)}
.toc a .n{flex:none;width:3.6em;color:var(--ink-faint);font-size:12px;font-variant-numeric:tabular-nums}
.toc a .t{flex:1}
.toc a .dot{flex:none;width:7px;height:7px;border-radius:50%;background:transparent;border:1px solid var(--ink-faint);align-self:center}
.toc a.read .dot{background:var(--gold);border-color:var(--gold)}
.marks{flex:1;overflow:auto;padding:12px 16px 24px}
.marks .empty{color:var(--ink-faint);font-size:13.5px;line-height:1.8;padding:12px 4px}
.mark{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;cursor:pointer}
.mark:hover{background:var(--ui-hover)}
.mark .t{flex:1;font-size:14px;line-height:1.45}
.mark .t small{display:block;color:var(--ink-faint);font-size:12px}
.mark button{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;width:30px;height:30px;border-radius:8px}
.mark button:hover{background:var(--ui);color:var(--accent)}
.drawer .foot{padding:12px 16px;border-top:1px solid var(--ui-line);display:flex;gap:8px}
.drawer .foot .btn{flex:1;color:var(--ink-soft);border-color:var(--ui-line);font-size:13px;padding:9px 12px}

.panel{position:fixed;top:58px;right:max(12px,env(safe-area-inset-right));width:min(320px,calc(100vw - 24px));background:var(--ui);color:var(--ui-ink);border:1px solid var(--ui-line);border-radius:14px;z-index:22;padding:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s}
.panel.show{opacity:1;transform:none;pointer-events:auto}
.panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.15em;color:var(--ink-faint);font-weight:500}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row label{width:4.8em;font-size:13px;color:var(--ink-soft);flex:none}
.seg{display:flex;flex:1;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;cursor:pointer;font-size:13px;color:var(--ink-soft)}
.seg button + button{border-left:1px solid var(--ui-line)}
.seg button[aria-pressed="true"]{background:var(--ui-hover);color:var(--ui-ink);font-weight:700}
.swatch{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.15)}
input[type=range]{flex:1;accent-color:var(--accent)}
.val{width:3em;text-align:right;font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:520px){
  #stage{padding:54px 16px 60px}
  .running{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.flow{transition:none}}
</style>
</head>
<body>

<section id="cover" aria-label="표지">
  <div class="cover-book">
    <svg class="cover-lotus" viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
      <path d="M60 70 C52 52 52 30 60 10 C68 30 68 52 60 70Z"/>
      <path d="M60 70 C46 60 36 44 34 24 C48 32 57 48 60 70Z"/>
      <path d="M60 70 C74 60 84 44 86 24 C72 32 63 48 60 70Z"/>
      <path d="M60 70 C40 68 22 56 12 40 C30 40 48 52 60 70Z"/>
      <path d="M60 70 C80 68 98 56 108 40 C90 40 72 52 60 70Z"/>
      <path d="M22 72 Q60 80 98 72" />
      <circle cx="60" cy="4" r="1.6" fill="currentColor" stroke="none"/>
    </svg>
    <h1 class="cover-title" id="coverTitle">연화생전</h1>
    <div class="cover-hanja" id="coverHanja">蓮花生傳</div>
    <p class="cover-sub" id="coverSub">설산을 넘는 스승</p>
    <p class="cover-blurb" id="coverBlurb"></p>
    <div class="cover-actions">
      <button class="btn primary" id="btnResume" hidden>이어 읽기</button>
      <button class="btn" id="btnStart">처음부터 읽기</button>
      <button class="btn" id="btnCoverToc">목차</button>
    </div>
    <div class="cover-foot">구루 린뽀체 전기 각색 소설</div>
  </div>
</section>

<header class="bar topbar" role="toolbar" aria-label="읽기 도구">
  <button class="icon-btn" id="btnToc" aria-label="목차 열기" title="목차 (T)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <button class="icon-btn" id="btnHome" aria-label="표지로" title="표지">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
  </button>
  <div class="running" id="running" aria-live="polite"></div>
  <button class="icon-btn" id="btnMark" aria-label="책갈피" aria-pressed="false" title="책갈피 (B)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 3h10v18l-5-4-5 4z"/></svg>
  </button>
  <button class="icon-btn" id="btnSettings" aria-label="보기 설정" aria-expanded="false" title="보기 설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19 9 5h1l5 14M6 14h7"/><path d="M15 19l3-8h.6l3 8M16 16.6h4.6"/></svg>
  </button>
</header>

<main id="stage">
  <div class="book" id="book">
    <div class="viewport" id="viewport">
      <article class="flow" id="flow"></article>
    </div>
    <span class="folio l" id="folioL"></span>
    <span class="folio r" id="folioR"></span>

<script>
const BOOK = {"title": "연화생전", "hanja": "蓮花生傳", "subtitle": "설산을 넘는 스승", "blurb": "낮에 쌓은 절이 밤마다 무너지는 눈의 나라. 왕의 부름을 받은 한 수행자가 히말라야를 넘는다. 그는 귀신을 죽이지 않는다. 맹세하게 만든다.", "chapters": [{"id": "c00", "label": "서장", "title": "낮에 쌓고 밤에 무너지는 절", "epigraph": "왕은 우주를 본떠 절을 짓고자 하나, 밤마다 우주가 허물어지네.", "part": {"label": "제1부", "title": "연꽃에서 태어난 자"}, "html": "<p>눈의 나라 티벳, 왕이 스물한 살 되던 호랑이해였다.<\/p>\n<p>티쏭 데짼은 흰 비단옷을 입고 황금 괭이를 들었다. 얄룽 창뽀 강 북쪽 닥마르 벌판, 그가 평생의 서원으로 절을 세우기로 한 자리였다. 신하들과 백성들이 빙 둘러섰다. 인도에서 모셔 온 노스승, 사람들이 그냥 '보디사뜨와(보살)'라고 부르던 샨따락시따가 그 곁에서 터를 축복하는 경을 읽었다.<\/p>\n<p>왕이 첫 괭이질을 했다.<\/p>\n<p>한 자쯤 파 내려가자 흙 속에서 하얀 것이 쏟아져 나왔다. 쌀이었다. 흰 쌀이 한 짐이나 솟더니, 그 뒤로 설탕 맛이 나는 달콤한 것들이 줄줄이 따라 나왔다.<\/p>\n<p>\"흙에서 밥이 나옵니다!\"<\/p>\n<p>구경꾼들이 와 하고 소리를 질렀다. 노스승은 쌀 한 줌을 왕의 입에 넣어 주고, 한 줌은 왕의 머리에 발라 주었다.<\/p>\n<p>\"좋은 징조입니다. 대왕의 뜻이 이루어지고 이 땅에 법이 퍼질 것입니다.\"<\/p>\n<p>왕은 입안의 쌀을 오래 씹었다. 달았다. 그날 밤 왕은 열세 살에 아버지를 여읜 뒤 처음으로 아무 걱정 없이 잤다.<\/p>\n<p>이튿날 아침, 왕의 시종이 맨발로 뛰어 들어왔다.<\/p>\n<p>\"폐하, 담이… 담이 없어졌습니다.\"<\/p>\n<p>어제 석공들이 허리춤 높이까지 쌓아 둔 돌담이 한 장도 남김없이 무너져 있었다. 돌들은 깨지지도 않고 가지런히, 원래 있던 산비탈 쪽으로 되돌아가 쌓여 있었다. 누가 일부러 정리해 둔 것처럼.<\/p>\n<p>석공들은 다시 쌓았다. 그날 밤 또 무너졌다. 그다음 날도, 그다음 날도.<\/p>\n<p>낮에 쌓은 만큼 밤에 무너졌다. 아니, 조금 더 무너졌다. 나흘째 아침에는 첫날 판 괭이 자국까지 메워져 있었다.<\/p>\n<p>그것만이 아니었다. 붉은 언덕 마르뽀리의 궁전 지붕에 벼락이 꽂혔다. 팡탕의 별궁이 물에 떠내려갔다. 보리밭에 우박이 쏟아지고, 골짜기마다 사람과 가축이 병으로 쓰러졌다. 궁정의 대신들이 수군거렸다.<\/p>\n<p>\"인도에서 온 저 중 때문이야. 낯선 신을 들여오니 이 땅의 신들이 노하신 게지.\"<\/p>\n<p>왕은 노스승을 찾아갔다.<\/p>\n<p>\"스승이시여, 붓다의 법이 진실이라면, 어찌 이 땅의 신과 귀신들이 이토록 날뜁니까.\"<\/p>\n<p>샨따락시따는 한참 동안 대답하지 않았다. 그는 날란다에서 가장 이름 높은 학자였고, 평생 논쟁에서 져 본 적이 없었다. 그런 사람이 이렇게 말했다.<\/p>\n<p>\"대왕이시여, 저는 원인과 조건의 법이라면 하나도 빠짐없이 압니다. 보리심도 닦을 만큼 닦았습니다. 저는 자비로 길들이는 사람입니다. 그런데…\"<\/p>\n<p>\"그런데?\"<\/p>\n<p>\"티벳의 신과 귀신들이 길들여질지 아닐지는, <strong>솔직히 모르겠습니다.<\/strong>\"<\/p>\n<p>왕은 입을 벌렸다. 세상에서 가장 많이 아는 사람이 모르겠다고 말하는 것을 처음 들었다.<\/p>\n<p>노스승이 덧붙였다.<\/p>\n<p>\"모르는 것을 모른다고 하는 것도 법입니다. 그리고 한 가지 방도가 있습니다. 네팔 땅 양레쇠의 바위굴에 우겐 왕의 아들로 태어난 화신 한 분이 계십니다. 사람들은 그를 빠드마 중내, '연꽃에서 태어난 이'라 부릅니다. 힘이 크고 솜씨가 사나워, 저 같은 사람이 말로 못 하는 일을 하실 분입니다.\"<\/p>\n<p>\"그가 오면 귀신들을 죽일 수 있습니까.\"<\/p>\n<p>노스승이 처음으로 웃었다.<\/p>\n<p>\"죽이지 않을 것입니다, 대왕이시여. 그것이 그분의 무서운 점이지요. 그분은 귀신을 죽이지 않고 <strong>맹세하게<\/strong> 만듭니다.\"<\/p>\n<p>그날부터 사흘 밤, 왕은 같은 꿈을 꾸었다. 인도와 네팔의 경계, 바위굴 하나, 그 안에 앉은 누군가가 왕을 향해 손짓하는 꿈이었다. 사흘째 아침 왕은 신하들을 모았다.<\/p>\n<p>\"양레쇠로 갈 사람이 필요하다.\"<\/p>\n<p>대전이 조용해졌다. 다들 바닥만 내려다보았다. 설산을 넘어 네팔까지, 그것도 귀신들이 길길이 날뛰는 이 판에. 누군가 헛기침을 했고, 누군가는 갑자기 허리가 아프다고 했다.<\/p>\n<p>결국 왕이 손가락으로 찍었다.<\/p>\n<p>\"바 쌜낭. 그대는 인도 말을 하니 가라. 낙남 도제 뒤좀. 그대는 칼을 잘 쓰니 가라. 쎙고 랄룽, 그대도 가라. 하인 둘을 딸려 주마.\"<\/p>\n<p>다섯 사람에게 금가루 한 되씩이 주어졌다. 바 쌜낭은 받자마자 장부에 적었다. <em>금가루 다섯 되. 왕께 받음. 영수증 필요.<\/em><\/p>\n<p>그들이 새벽에 남쪽으로 말을 몰 때, 닥마르 벌판에서는 석공들이 또 담을 쌓고 있었다. 오늘 밤에 무너질 담을.<\/p>\n<p>그런데 이야기는, 그보다 훨씬 오래 전의 한 바다에서 시작해야 한다.<\/p>", "chars": 1989}, {"id": "c01", "label": "제1장", "title": "거지들의 항의와 여의주", "epigraph": "창고를 다 비운 왕은 바다로 가고, 바다 한가운데 여덟 살 아이가 앉아 있네.", "part": null, "html": "<p>인도의 서북쪽, 다끼니들의 땅이라 불리던 우겐(우디야나)에 인드라부띠라는 왕이 있었다.<\/p>\n<p>왕에게는 왕비가 백여덟이었고 대신은 셀 수도 없었다. 없는 것은 딱 하나, 아들이었다.<\/p>\n<p>왕은 해마다 정월 보름이면 창고를 열었다. 삼보께 공양을 올리고, 『법의 구름』이라는 경전을 한 번 강설하게 하고, 그다음에는 굶주린 사람이 오는 대로 다 나누어 주었다. 이것을 여러 해 되풀이하자 어느 해 창고지기가 울상을 지었다.<\/p>\n<p>\"폐하, 창고가 비었습니다. 쥐도 이사를 갔습니다.\"<\/p>\n<p>왕은 그해 보시를 거를 수밖에 없었다. 그러자 궁문 앞에 거지들이 몰려와 항의했다.<\/p>\n<p>\"폐하! 올해 저희한테 안 주시면, 작년에 다른 사람한테 주신 것도 다 헛것이 됩니다!\"<\/p>\n<p>대신들은 어처구니가 없어 웃었다. 그런데 왕은 웃지 않았다.<\/p>\n<p>\"저 말이 맞다. 베풂은 한 번 하고 끝내는 장사가 아니다. 시작했으면 끝까지 가야 한다.\"<\/p>\n<p>\"하지만 폐하, 줄 것이 없습니다.\"<\/p>\n<p>\"바다 건너 섬에, 용왕의 딸이 손에 쥐고 있다는 보배가 있다고 한다. 원하는 것이 다 솟아나고 다함이 없다는 여의주다. 법으로 보시하는 사람이 가면 얻을 수 있다지.\"<\/p>\n<p>\"설마 폐하께서 직접…\"<\/p>\n<p>\"내가 간다.\"<\/p>\n<p>대신들이 엎드려 말렸다. 왕은 듣지 않았다. 바깥 바다를 여러 번 다녀온 늙은 선장을 찾아내, 배의 네 귀퉁이에 큰 비단 깃발을 달았다. 순풍이 불면 깃발을 펼쳐 나아가고, 역풍이 불면 '자석의 심장'이라는 큰 돌 네 개를 야크 꼬리털 밧줄에 매달아 물에 넣고 버텼다.<\/p>\n<p>배는 은의 산을 지나고, 푸른 유리의 산을 지나, 마침내 누런 산 앞에 닿았다. 해변의 모래가 전부 금이었다. 신하 하나가 모래를 한 움큼 쥐고 덜덜 떨었다.<\/p>\n<p>늙은 선장이 왕에게 일렀다.<\/p>\n<p>\"성문 앞에 돌기둥이 하나 있습니다. 문을 두드리면 하늘 여인 여덟이 보배를 들고 나올 겁니다. <strong>절대 말을 걸지 마십시오.<\/strong> 한 번 더 두드리면 푸른 소녀 하나가 오색으로 빛나는 구슬을 들고 나옵니다. 그것을 받으면 놓치지 않게 옷자락에 얼른 싸십시오.\"<\/p>\n<p>\"여덟 여인에게 말을 걸면 어찌 되는가?\"<\/p>\n<p>\"지난번에 말을 건 선원은 아직 거기서 이야기하고 있습니다. 칠 년째입니다.\"<\/p>\n<p>왕은 선장이 시킨 대로 했다. 여덟 여인이 생글거리며 나왔을 때 입을 꾹 다물었고, 두 번째로 문을 두드려 용왕의 딸에게서 여의주를 받자 옷자락에 둘둘 말아 쌌다.<\/p>\n<p>돌아오는 길에 선장이 선원들에게 금모래를 나누어 주며 말했다.<\/p>\n<p>\"필요한 만큼만 가져가게. 많이 실으면 배가 가라앉아. 족함을 아는 게 뱃사람이 사는 법이야.\"<\/p>\n<p>선원 하나가 몰래 금모래를 주머니에 더 쑤셔 넣다가 들켜 얼굴이 빨개졌다. 왕은 그 말을 오래 곱씹었다. <em>족함을 알라.<\/em> 바다에서 얻은 가장 비싼 보배는 어쩌면 그 말이었다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>배가 우겐 쪽으로 키를 돌렸을 때였다. 망망한 바다 한가운데 작은 섬이 있었고, 그 섬에 수레바퀴만 한 연꽃이 피어 있었다. 오색 무지개가 그 위에 걸려 있었다.<\/p>\n<p>연꽃 위에 아이가 하나 앉아 있었다.<\/p>\n<p>여덟 살쯤 되어 보였다. 이슬 맺힌 살결이 붉은빛 도는 흰색이었고, 한 손에는 금강저를, 한 손에는 요령을 들고 있었다. 아이는 낯선 배를 보고도 놀라지 않았다. 오히려 배가 늦게 왔다는 듯한 얼굴이었다.<\/p>\n<p>왕이 물었다.<\/p>\n<p>\"얘야, 네 아버지는 누구고 어머니는 누구냐? 집안은 무엇이고, 나라는 어디 두었으며, 무엇을 먹고 살고, 여기서 무엇을 하느냐?\"<\/p>\n<p>아이가 하나씩 대답했다.<\/p>\n<p>\"제 아버지는 '스스로 깨어 있는 앎'입니다. 어머니는 '모든 것을 품는 텅 빈 바탕'입니다. 집안은 그 둘이 둘이 아님을 아는 것이고, 나라는 태어남이 없는 법계에 두었습니다.\"<\/p>\n<p>\"그럼 무얼 먹느냐?\"<\/p>\n<p>\"둘로 갈라 보는 생각을 먹습니다. 나와 남, 좋고 싫음, 그런 것들이요.\"<\/p>\n<p>\"…배가 부르냐?\"<\/p>\n<p>\"세상에 그런 생각이 워낙 많아서, 굶을 일은 없습니다.\"<\/p>\n<p>신하들이 킥킥 웃었다. 아이도 웃었다.<\/p>\n<p>\"그래서 여기서 무엇을 하느냐?\"<\/p>\n<p>\"번뇌를 길들이려고 왔습니다.\"<\/p>\n<p>왕은 한동안 말을 잃었다가 무릎을 꿇었다.<\/p>\n<p>\"이분은 화신이시다. 제 아들이 되어 주시고, 또 제가 공양을 올릴 스승이 되어 주십시오.\"<\/p>\n<p>왕은 손수 연꽃 줄기를 잘라 아이를 비단에 싸서 배에 태웠다.<\/p>\n<p>궁에 돌아와 왕은 여의주를 처음 시험했다.<\/p>\n<p>\"이 보배가 진짜 여의주라면, 이 아이가 앉은 자리가 칠보 보좌가 되고 칠보 일산이 생겨나라.\"<\/p>\n<p>말이 끝나자마자 보좌와 일산이 나타났다. 아이는 거기 앉아 다리를 달랑거렸다. 왕은 아이에게 이름을 지어 주었다. 쪼께 도르제, '호수에서 난 금강'.<\/p>\n<p>두 번째 소원은 텅 빈 창고를 채우는 것이었다. 창고가 가득 찼다. 쥐들이 돌아왔다.<\/p>\n<p>세 번째로 왕은 보배를 향수로 씻어 깃대 꼭대기에 걸고 빌었다.<\/p>\n<p>\"모든 사람에게 바라는 것을 비처럼 내려 주소서.\"<\/p>\n<p>바람이 일어 더러운 것을 쓸어 갔다. 가랑비가 내려 먼지를 재웠다. 그다음에는 정말로 비가 내렸다. 처음에는 백 가지 맛의 음식 비가, 다음에는 옷 비가, 그다음에는 재물 비가 내렸다. 궁문 앞에서 항의하던 거지들이 머리 위로 떨어지는 떡을 받아먹으며 만세를 불렀다.<\/p>\n<p>왕이 말했다.<\/p>\n<p>\"이제 배부르고 따뜻해졌으니, 너희는 모두 큰 수레의 법을 행하라.\"<\/p>\n<p>그것이 이 이야기에서 첫 번째 법문이었다. 배가 고픈 사람에게는 법보다 밥이 먼저다. 그러나 밥으로 끝나면, 내년 정월에 또 줄을 서야 한다.<\/p>\n<p>어린 쪼께 도르제는 보좌 위에서 그 광경을 내려다보았다. 그는 사람들이 떡을 받으며 웃는 얼굴과, 떡을 더 받으려고 서로 밀치는 손을 동시에 보고 있었다.<\/p>\n<p>\"아버지.\" 아이가 물었다. \"저 보배는 모든 소원을 들어준다지요.\"<\/p>\n<p>\"그렇단다.\"<\/p>\n<p>\"그러면 저 사람들이 다시는 늙지도, 병들지도, 죽지도 않게 해 달라고 빌어 보셨습니까?\"<\/p>\n<p>왕은 대답하지 못했다. 여의주가 줄 수 있는 것은 떡과 옷과 금이었다. 얻으면 다시 잃을까 두려워지는 것들뿐이었다.<\/p>", "chars": 2823}, {"id": "c02", "label": "제2장", "title": "왕궁 지붕의 춤", "epigraph": "춤추던 손에서 카땀가가 떨어지니, 묵은 빚이 오늘 갚아지네.", "part": null, "html": "<p>왕자는 자라서 다끼니의 혈통이라는 바사다라 공주와 혼인했고, 늙은 왕을 대신해 나라를 다스렸다. 사람들은 그를 '터번 쓴 임금'이라 불렀다. 그가 다스리는 동안 우겐에는 도둑이 없었다.<\/p>\n<p>그러나 왕자는 알고 있었다. 왕의 자리에 앉아서는 중생을 크게 이롭게 할 수 없다는 것을. 그는 늙은 아버지에게 왕위를 내려놓게 해 달라고 청했다. 아버지는 들어주지 않았다. 성문마다 병사가 섰다.<\/p>\n<p>왕자는 다투지 않았다. 대신 이상한 짓을 하기 시작했다.<\/p>\n<p>어느 날 아침, 궁전 지붕 위에 왕자가 서 있었다. 알몸이었다. 걸친 것은 뼈로 깎은 장신구뿐이었다. 손에는 탐욕과 성냄과 어리석음, 세 독을 뿌리째 끊는다는 삼지창 지팡이 카땀가를 들고 있었다. 그리고 춤을 추기 시작했다.<\/p>\n<p>광장에 사람들이 몰려들었다.<\/p>\n<p>\"왕자님이 미치셨다!\"<\/p>\n<p>\"아니야, 저건 무슨 춤이야. 발이 박자를 타잖아.\"<\/p>\n<p>\"옷은? 옷은 어디 가셨대?\"<\/p>\n<p>다음 날도, 그다음 날도 왕자는 지붕에서 춤을 추었다. 광장은 장터보다 붐볐다. 엿장수가 자리를 깔았다. 대신들은 얼굴을 감싸 쥐었다.<\/p>\n<p>그러던 어느 날, 춤추던 왕자의 손에서 카땀가가 미끄러졌다. 정말로 미끄러진 것처럼 보였다. 창은 구경하던 사람들 가운데로 떨어져, 대신 까마다의 어린 아들 머리에 꽂혔다. 아이는 그 자리에서 숨졌다.<\/p>\n<p>광장이 얼어붙었다.<\/p>\n<p>경전은 이 일을 이렇게 전한다. 그 아이는 전생에 지은 무거운 업 때문에 곧 나쁜 세상에 떨어질 처지였고, 왕자가 그 인연을 끊어 더 나은 생으로 보냈다고. 그러나 그날 광장에서 그 말을 믿은 사람은 아무도 없었다. 아이 어머니의 울음 앞에서, 왕자 자신도 변명하지 않았다.<\/p>\n<p>대신들이 모였다.<\/p>\n<p>\"왕자로 모셨다 하나 도리에 어긋난 짓으로 대신의 아들을 죽였습니다. 나라의 법대로 말뚝에 올려 벌하소서.\"<\/p>\n<p>늙은 왕이 오래 침묵한 끝에 말했다.<\/p>\n<p>\"저 아이가 사람이 아닌 것의 자식인지, 화신인지 나는 모른다. 모르는 채로 죽이는 것은 좋지 않다. 내가 추방하겠다.\"<\/p>\n<p>그날 밤 왕은 아들을 불렀다. 그리고 시를 지어 읊었다. 우겐의 왕들은 할 말이 너무 무거울 때 시로 했다.<\/p>\n<blockquote class=\"verse\"><p>보배 호수의 섬, 연꽃 줄기에서<br>아비도 어미도 없이 화신의 아이가 났다.<br>아들 없던 내가 너를 왕좌에 앉혔으나<br>네 손에 대신의 아이가 죽었다.<br>대신들이 나라의 법을 드니<br>이제 너는 가고 싶은 데로 가거라.<\/p><\/blockquote>\n<p>왕자가 답했다.<\/p>\n<blockquote class=\"verse\"><p>아버지 어머니로 모시고 왕좌에 올랐으나<br>업의 빚을 갚느라 대신의 아들이 죽었습니다.<br>아버지의 이름을 지키려 저는 떠납니다.<br>마음에는 나고 죽음이 없으니 죽인들 붙들 것이 없고,<br>몸에 집착이 없으니 쫓겨난들 서운할 것이 없습니다.<br>두 분은 오래오래 평안하십시오.<br>업의 인연이니, 훗날 다시 뵈러 오겠습니다.<\/p><\/blockquote>\n<p>왕자는 두 사람에게 절했다. 그리고 저녁상에 오른 음식의 첫술을 떠서 아버지 앞에 놓았다. 늙은 왕은 그 숟가락을 보며 울었다.<\/p>\n<p>\"네가 일부러 그런 것이냐. 떠나기 위해서.\"<\/p>\n<p>\"아버지.\" 왕자가 말했다. \"업은 누가 일부러 짓는 것도, 누가 대신 지워 주는 것도 아닙니다. 씨앗을 심으면 싹이 틉니다. 저는 오늘 제가 심은 것도 지고 갑니다. 다만 약속드립니다. 이 발걸음이 닿는 모든 곳에서, 괴로움의 뿌리를 캐겠습니다.\"<\/p>\n<p>이튿날 대신들은 왕자를 데리고 성 남쪽으로 갔다. 산 사람이 가지 않는 곳, 시체를 버리는 숲으로.<\/p>\n<p>성문이 닫히자 사람들은 습관처럼 궁전 지붕을 올려다보았다. 춤추던 자리는 비어 있었다. 엿장수가 자리를 걷으며 중얼거렸다.<\/p>\n<p>\"이제 장사는 다 했네.\"<\/p>\n<p>그제야 사람들은 알았다. 몇 해 동안 우겐에 도둑이 없었던 것이 누구 덕분이었는지를.<\/p>", "chars": 1733}, {"id": "c03", "label": "제3장", "title": "시체숲의 부자", "epigraph": "송장을 방석 삼고 수의를 옷 삼으니, 무서운 것이 스승이 되네.", "part": null, "html": "<p>우겐 남쪽의 '서늘한 숲', 시따와나는 이름만 고왔다.<\/p>\n<p>그곳은 사람이 죽으면 내다 버리는 숲이었다. 독수리와 자칼이 낮의 주인이었고, 밤의 주인은 따로 있었다. 살을 먹는 귀신, 피를 마시는 나찰, 그리고 해골 잔을 든 다끼니들.<\/p>\n<p>그런데 이 숲에는 묘한 풍속이 하나 있었다. 우겐 사람들은 시신을 버릴 때 천 한 필로 곱게 싸고, 저승길 양식이라며 머리맡에 쌀 한 짐씩을 놓아두었다.<\/p>\n<p>\"그러니까.\" 쫓겨난 왕자는 첫날 숲을 한 바퀴 돌고 나서 중얼거렸다. \"옷감 한 필, 쌀 한 짐. 날마다 새로 들어오고.\"<\/p>\n<p>그는 시신의 수의로 옷을 지어 입고 저승길 쌀로 밥을 지었다. 숲에서 가장 잘 먹고 가장 잘 입는 존재가 되었다. 귀신들이 수군거렸다.<\/p>\n<p>\"쟤는 뭔데 여기서 살이 오르냐?\"<\/p>\n<p>첫날 밤, 썩어 가는 송장 위에 가부좌를 튼 그에게 귀신들이 몰려왔다. 머리가 아홉 달린 것이 그의 코앞에 얼굴을 들이밀었다. 그는 눈을 뜨고 그것을 똑바로 바라보았다. 그리고 물었다.<\/p>\n<p>\"너는 배가 고프냐?\"<\/p>\n<p>귀신이 멈칫했다. 수백 년 동안 사람들은 그를 보고 비명을 지르거나 기절했다. 배가 고프냐고 물은 사람은 처음이었다.<\/p>\n<p>\"…고프다. 늘 고프다. 먹어도 먹어도 고프다.\"<\/p>\n<p>\"그렇구나. 쌀이 좀 남았는데 먹겠느냐?\"<\/p>\n<p>\"…쌀은 안 먹는다.\"<\/p>\n<p>\"그럼 다음에 이야기하자. 나는 내일도 여기 있다.\"<\/p>\n<p>그는 정말로 다음 날도, 그다음 날도 거기 있었다. 그리고 귀신들에게 법을 설했다. 어려운 말은 하지 않았다. <em>너희가 무서운 모습을 한 것은 너희가 무섭기 때문이다. 너희가 끝없이 배고픈 것은 움켜쥐기 때문이다. 움켜쥔 손을 펴면 손바닥에 무엇이든 담긴다.<\/em><\/p>\n<p>몇 해 뒤 우겐에 큰 흉년이 들었다. 사람들이 줄줄이 죽어 숲으로 실려 왔다. 시신은 여전히 천에 싸여 왔지만, 머리맡의 쌀은 없었다. 산 사람이 먹을 쌀도 없었으니까.<\/p>\n<p>숲의 부자는 하루아침에 가난해졌다. 그는 이제 사람 가죽을 옷으로 두르고, 시신 그 자체를 양식으로 삼았다. 그러면서도 흔들림 없는 삼매에 머물렀다. 보는 이에게는 끔찍한 광경이었지만, 그에게 그것은 마지막 남은 분별을 태우는 일이었다. 깨끗한 것과 더러운 것, 먹을 것과 먹지 못할 것. 그 둘로 가르는 생각이 사라지자, 그 자리에 두려움도 함께 사라졌다.<\/p>\n<p>숲의 다끼니들이 하나둘 그의 앞에 무릎을 꿇었다. 우겐 사람들은 그를 '나찰 샨따'라 부르며 숲 근처에도 가지 않았다.<\/p>\n<p>그는 여덟 곳의 큰 시체숲을 차례로 돌았다. 자호르의 '기쁨의 동산'에서는 다끼니 '마라를 이긴 이'가 그에게 관정을 주었다. 우겐 남쪽 섬들에서는 다끼니 '고요한 바다'가 가피를 내렸다. 마지막으로 그는 자신이 태어난 호숫가로 돌아갔다. 거기서 다끼니들의 비밀한 말로 수행하자 바다 섬의 다끼니 넷이 엎드렸고, 금강해모의 얼굴이 허공에 나타났다. 바다의 용들과 하늘의 별 신들이 종이 되겠다고 약속했다.<\/p>\n<p>다끼니들이 그에게 비밀한 이름을 지어 주었다. 도르제 닥뽀 쩰, '사나운 힘의 금강'.<\/p>\n<p>\"마음에 듭니까?\" 다끼니 하나가 물었다.<\/p>\n<p>\"좀 길군.\" 그가 말했다. \"다음 이름은 짧게 지어 주시오.\"<\/p>\n<p>다끼니들이 웃었다. 그들은 몰랐다. 이 사람이 평생 받게 될 이름이 앞으로 스무 개는 넘으리라는 것을.<\/p>", "chars": 1559}, {"id": "c04", "label": "제4장", "title": "물동이가 들리지 않는 하녀", "epigraph": "재주를 겨루러 간 문 앞에서, 하녀의 가슴에 신들이 앉아 있었네.", "part": null, "html": "<p>시체숲에서 나온 그에게 사람들이 물었다.<\/p>\n<p>\"당신의 스승은 누구요?\"<\/p>\n<p>\"나는 아버지도 어머니도 스승도 집안도 이름도 없다. 스스로 생겨난 부처다.\"<\/p>\n<p>사람들은 뒷걸음질 쳤다.<\/p>\n<p>\"스승도 없이 신통을 부린다니, 저건 마라(魔)가 틀림없어.\"<\/p>\n<p>그는 머리를 긁었다. 틀린 말을 한 것은 아니었다. 그런데 맞는 말이 언제나 통하는 말은 아니었다.<\/p>\n<p>\"좋다. 그럼 스승을 모셔 보자.\"<\/p>\n<p>그는 자호르로 가는 길에서 비구 둘을 만났다. 큰스승 쁘라바하스띠께 법을 들으러 간다고 했다. \"그럼 나도 가겠다.\" 그는 그 길로 쁘라바하스띠에게 머리를 깎고 계를 받았다. 받은 이름은 샤꺄 쎙게, '석가족의 사자'였다.<\/p>\n<p>스승은 그에게 요가 탄뜨라 세 편을 가르쳤다. 그는 한 번 듣고 다 알았다. 그런데도 열여덟 번을 다시 들었다.<\/p>\n<p>\"이미 아는 것을 왜 또 듣느냐?\" 쁘라바하스띠가 물었다.<\/p>\n<p>\"아는 것과 몸에 붙는 것은 다릅니다. 열여덟 번쯤 들어야 장애가 씻깁니다.\"<\/p>\n<p>\"열일곱 번째쯤에는 지겹지 않더냐?\"<\/p>\n<p>\"지겨운 그 마음도 씻어야 할 장애였습니다.\"<\/p>\n<p>열여덟 번째 강의가 끝났을 때, 그는 따로 수행하지도 않았는데 요가의 신 서른두 분의 얼굴을 보았다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>다음으로 그는 히말라야에 사는 스승 잠뺄 쉐녠을 찾아가 더 깊은 법을 청했다. 스승이 말했다.<\/p>\n<p>\"그대가 갈 곳은 따로 있다. 꾼가모라는 우바이가 있으니, 안과 밖과 비밀의 관정에 그보다 밝은 이가 없다.\"<\/p>\n<p>꾼가모의 집 앞에 이르자, 마침 하녀 하나가 물동이를 이고 나오고 있었다. 이름은 꾸꾸마였다.<\/p>\n<p>\"스승께 법을 청하러 왔으니 전갈을 넣어 주시오.\"<\/p>\n<p>하녀는 들은 척도 하지 않고 지나갔다. 물을 길어 돌아오는 길에도 마찬가지였다. 샤꺄 쎙게는 잠깐 생각하더니, 눈을 반쯤 감고 삼매에 들었다.<\/p>\n<p>하녀가 우물가에서 물동이를 들어 올리려 했다. 물동이가 들리지 않았다. 두 손으로 잡아당겼다. 꿈쩍도 하지 않았다. 발로 버티고 끙끙거렸다. 물동이는 땅에 뿌리라도 내린 듯했다.<\/p>\n<p>하녀가 천천히 고개를 돌려 그를 보았다.<\/p>\n<p>\"…당신이 그랬군요.\"<\/p>\n<p>\"전갈을 넣어 주시면 풀어 드리겠소.\"<\/p>\n<p>하녀는 물동이를 놓고 허리를 폈다. 그리고 말했다.<\/p>\n<p>\"그쪽만 재주가 있는 줄 아시나 보네.\"<\/p>\n<p>그녀는 허리춤에서 맑은 수정 칼을 꺼내더니 제 가슴을 위아래로 쭉 갈랐다. 샤꺄 쎙게가 숨을 들이켰다. 피는 한 방울도 나지 않았다. 갈라진 가슴 안에 고요한 신들 마흔두 분이 채색한 그림처럼 또렷이 앉아 있었다. 아랫배 쪽에는 사나운 신들 쉰여덟 분이 불꽃 속에 서 있었다.<\/p>\n<p>그는 그 자리에서 무릎을 꿇었다.<\/p>\n<p>\"이분이 바로 그 우바이로군요.\"<\/p>\n<p>\"저는 하녀예요.\" 꾸꾸마가 가슴을 여미며 말했다. \"들어가세요. 그리고 물동이 좀 풀어 주시고요.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>안에 들어가 보니 꾼가모는 전단 숲 속 시신 자리에 앉아, 다끼니 서른둘과 함께 잔치를 벌이고 있었다. 샤꺄 쎙게는 세 번 돌고 절한 뒤 안과 밖과 비밀의 관정을 청했다.<\/p>\n<p>꾼가모는 아무 말 없이 그를 '훔' 글자 하나로 바꾸어 꿀꺽 삼켰다.<\/p>\n<p>그는 그녀의 몸 안을 한 바퀴 돌았다. 몸과 말과 마음에 낀 때가 씻겨 나갔다. 바깥으로는 무량광불의 관정과 수명의 지명을, 안으로는 관세음의 관정과 대수인의 지명을, 비밀로는 마두명왕의 관정으로 모든 교만한 것을 다스리는 힘을 받았다. 그리고 다시 세상으로 나왔다.<\/p>\n<p>\"어떠냐?\" 꾼가모가 물었다.<\/p>\n<p>\"…안이 생각보다 넓었습니다.\"<\/p>\n<p>\"다들 그렇게 말하지.\"<\/p>\n<p>그 뒤로 그는 스승들을 차례로 찾아다녔다. 훔까라에게 양닥 헤루까의 법을, 나가르주나에게 연꽃 말씀의 법을, 붓다구햐에게 고요한 신과 사나운 신의 환술 그물을 배웠다. 진언의 수호신을 다루는 사나운 주문도, 어머니 신들의 법도 배웠다. 법을 하나 배울 때마다 그 법의 신의 얼굴을 보았다. 한 번 들으면 잊지 않았으므로, 사람들은 그를 로댄 촉쎄, '지혜를 탐하는 이'라 불렀다.<\/p>\n<p>마지막으로 찾아간 스승은 쉬리 씽하였다. 노스승은 아무것도 가르치지 않고 그를 석 달 동안 물만 긷게 했다. 물동이는 잘 들렸다.<\/p>\n<p>어느 날 그가 물었다.<\/p>\n<p>\"스승이시여, 저는 삼장을 외웠고 여러 탄뜨라의 신들을 보았습니다. 그런데 아직 무엇이 남았습니까.\"<\/p>\n<p>쉬리 씽하가 하늘을 가리켰다.<\/p>\n<p>\"저 하늘에 구름이 지나간다. 하늘이 구름을 붙잡더냐? 구름이 지나갔다고 하늘에 자국이 남더냐?\"<\/p>\n<p>\"아닙니다.\"<\/p>\n<p>\"네 마음이 그 하늘이다. 생각은 구름이다. 너는 여태 구름을 닦으려 했다. 하늘은 닦을 것이 없다. <strong>그저 알아차려라.<\/strong>\"<\/p>\n<p>그 한마디에, 그가 쌓아 올린 배움이 무너지고 동시에 완성되었다. 훗날 티벳에서 족첸, '큰 완성'이라 불리게 될 가르침이었다.<\/p>\n<p>그는 스승의 집을 나서며 문득 꾸꾸마의 물동이를 떠올렸다. 그도 그 물동이와 같았다. 스스로 무거운 줄 알았는데, 붙든 것을 놓으니 그냥 들렸다.<\/p>", "chars": 2308}, {"id": "c05", "label": "제5장", "title": "두 번 타지 않는 사람", "epigraph": "참기름 한 되씩 들고 온 사람들아, 불은 탈 것이 있어야 타는 법.", "part": null, "html": "<p>자호르 왕의 딸 만다라와는 열여섯 살이었다.<\/p>\n<p>주변 나라의 왕들이 줄줄이 청혼을 보냈으나 공주는 다 물리쳤다. 어릴 적 장터에서 죽은 이의 살을 파는 것을 본 뒤로, 공주는 이 몸이 무엇인지를 물었고, 그 물음의 답은 혼인에 있지 않았다.<\/p>\n<p>로댄 촉쎄가 자호르에 왔을 때, 공주는 그의 발아래 엎드려 법을 청했다. 그리고 그를 따라 궁을 나섰다.<\/p>\n<p>두 사람은 딸라 산의 남쪽 기슭, 마라띠까라는 바위굴로 갔다. 입구가 남쪽을 향하고, 사철 꽃비가 내리고, 둘레가 전단 숲인 곳이었다. 그들은 거기서 무량수불의 만다라를 열고 석 달을 닦았다. 석 달째 되던 날 무량광불이 허공에 나타나, 죽지 않는 감로가 든 병을 두 사람의 정수리에 얹고 입에도 부어 주었다.<\/p>\n<p>동굴을 나서며 만다라와가 물었다.<\/p>\n<p>\"스승이시여, 이제 죽지 않는 몸을 얻으셨으니 무엇을 하시렵니까.\"<\/p>\n<p>\"죽는 이들에게 가야지. 죽지 않는 법은, 죽음을 두려워하는 이들을 위해 있는 것이니까.\"<\/p>\n<p>\"그럼 어디부터 가십니까?\"<\/p>\n<p>\"공주의 아버지 나라부터.\"<\/p>\n<p>만다라와의 얼굴이 하얘졌다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그것은 좋은 생각이 아니었다.<\/p>\n<p>두 사람이 자호르 성안에 탁발하러 들어가자, 사람들이 알아보았다. 소문은 이미 부풀 대로 부풀어 있었다.<\/p>\n<p>\"저놈이다! 변방에서 온 떠돌이 비구 놈이 사람들을 죽이고, 여자들을 홀리고, 공주님까지 꾀어 달아났다!\"<\/p>\n<p>\"사람을 죽였다는 건 누가 봤대?\"<\/p>\n<p>\"몰라, 아무튼 그렇대!\"<\/p>\n<p>왕은 노했다. 백성들도 노했다. 그들은 이상한 방식으로 의견을 모았다.<\/p>\n<p>\"한 사람이 태우면 그 사람 죄가 된다. 다 같이 태우면 죄를 나누어 지는 거다. 집집마다 전단 장작 한 짐, 참기름 한 되씩!\"<\/p>\n<p>그렇게 하여 온 나라 사람이 장작 한 짐과 참기름 한 되씩을 들고 왔다. 장작더미는 궁전만큼 높아졌다. 두 사람을 그 위에 묶고 불을 질렀다.<\/p>\n<p>보통 이런 불은 이레면 연기가 그쳤다. 아흐레가 지나도 연기가 그치지 않았다. 그뿐 아니라 불길이 거꾸로 번져 왕궁 처마에 옮겨붙었다. 왕은 자기 지붕의 불을 끄느라 정신이 없었다.<\/p>\n<p>열흘째 사람들이 조심조심 가 보았다.<\/p>\n<p>장작이 있던 자리에 호수가 있었다. 참기름이 바다처럼 일렁이고, 그 한가운데 연꽃 줄기 하나가 솟아 있었다. 꽃 위에 두 사람이 서늘한 얼굴로 앉아 있었다.<\/p>\n<p>왕과 백성들이 그 자리에 엎드렸다.<\/p>\n<p>\"몸은 변치 않는 금강 같은 몸, 말씀은 막힘없는 범천 같은 말씀이시니, 호수에서 나신 금강께 절합니다. 저희가 어리석었으니 용서하소서.\"<\/p>\n<p>그들이 엎드려 빌자 왕궁의 불이 꺼졌다. 자호르 사람들은 그때 그에게 이름을 붙였다. 빠드마 중내, '연꽃에서 생겨난 이'. 그리고 빠드마 삼바와, '연꽃에서 태어난 이'. 이름이 둘인 까닭은 그날 사람이 너무 많아서 누가 먼저 불렀는지 아무도 기억하지 못하기 때문이라고 한다.<\/p>\n<p>지금도 인도 북쪽 산중에는 그 호수가 남아 있고, 순례자들은 그곳을 초 빼마, 연꽃 호수라 부른다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>\"이제 어디로 가십니까?\" 만다라와가 물었다.<\/p>\n<p>\"내 아버지 나라.\"<\/p>\n<p>\"…또요?\"<\/p>\n<p>그것도 좋은 생각이 아니었다.<\/p>\n<p>우겐 땅에서 두 사람이 탁발하러 나서자, 사람들이 알아보았다. 맨 앞에 선 사람은 오래전 아들을 잃은 대신 까마다였다.<\/p>\n<p>\"저놈이다! 내 아들을 죽이고 나라 법을 어긴 놈이 돌아왔다!\"<\/p>\n<p>우겐 사람들도 같은 방식으로 의견을 모았다. 전단 장작 한 짐, 참기름 한 되씩. 같은 방식은 같은 결과를 낳는다는 것을 그들은 몰랐다.<\/p>\n<p>이번에는 스무하루가 지나도 연기가 그치지 않았다. 아무도 무서워서 가 보지 못했다. 그런데 늙은 인드라부띠 왕이 일어섰다.<\/p>\n<p>\"내가 가 보겠다. 혹시 그 아이가 화신이라면, 불에 타지 않았을지도 모른다.\"<\/p>\n<p>늙은 왕은 지팡이를 짚고 연기 속으로 걸어 들어갔다. 참기름 늪 한가운데, 숯더미 위에 연꽃 한 줄기가 서 있었고, 그 위에 두 사람이 앉아 있었다. 그의 아들은 해골 염주를 목에 걸고 있었다. 지금까지 자비로 해탈시킨 중생의 숫자만큼 구슬이 꿰어져 있었다.<\/p>\n<p>늙은 왕은 세 번 돌고 아들의 발을 정수리에 받들었다.<\/p>\n<p>\"제 스승이 되어 주십시오.\"<\/p>\n<p>아들이 아버지에게 말했다.<\/p>\n<p>\"아버지, 삼계에 태어나는 것은 괴로움의 감옥입니다. 법을 지키는 왕으로 나도 괴로움과 산란의 자리일 뿐입니다. 자기 마음이 나고 죽음이 없는 법신임을 모르면, 아무리 높은 자리에 앉아도 감옥입니다. 아버지, 마음 그 자체를 보십시오. <strong>텅 비었는데 환합니다.<\/strong>\"<\/p>\n<p>늙은 왕은 그 자리에서 눈을 감았다. 그리고 보았다. 깨달음과 해탈이 한꺼번에 일어났다.<\/p>\n<p>왕은 아들에게 해골 염주를 손수 다시 걸어 주며 '빠드마 퇴텡'이라 불렀다. '연꽃 해골 염주'. 그리고 아들로 다시 삼으며 '빠드마 갤뽀', 연꽃 왕이라 불렀다.<\/p>\n<p>그는 그 뒤 열세 해를 우겐에 머물며 나라 전체를 법으로 이끌었다. 대신 까마다도 그 가운데 있었다. 그는 몇 해 동안 스승을 피해 다니다가, 어느 날 스승 앞에 와서 오래 울었다. 무슨 이야기가 오갔는지는 아무도 모른다. 다만 그날 이후 까마다는 아들의 무덤에 꽃을 놓을 때 미워하는 마음 없이 놓을 수 있었다고 한다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>얼마 뒤 인도 금강좌 근처에서, 외도의 스승 오백 명이 불법을 꺾겠다며 논쟁을 걸어왔다. 빠드마 중내는 논쟁에서 그들을 모두 이겼다. 그러자 진 쪽이 숲에 모여 그에게 저주를 걸었다.<\/p>\n<p>다끼니 '마라를 이긴 이'가 그에게 상자 하나를 건넸다. 안에는 사나운 주문이 들어 있었다. 그가 이레 동안 그것을 닦자, 외도들이 저주를 걸던 숲에 벼락이 떨어졌다. 살아남은 이들은 불법으로 들어왔다.<\/p>\n<p>사람들은 그를 쎙게 다독, '사자의 포효'라 불렀다.<\/p>\n<p>\"이름이 또 늘었군요.\" 만다라와가 말했다.<\/p>\n<p>\"그러게. 이제 외우기도 힘들어.\"<\/p>\n<p>\"그럼 뭐라고 불러 드릴까요?\"<\/p>\n<p>그는 잠시 생각했다.<\/p>\n<p>\"그냥 '스승'이라고 해. 그게 제일 짧아.\"<\/p>", "chars": 2792}, {"id": "c06", "label": "제6장", "title": "양레쇠의 가뭄", "epigraph": "가장 높은 깨달음의 문 앞에, 가장 사나운 훼방이 기다리네.", "part": null, "html": "<p>카트만두 골짜기 남쪽 끝, 양레쇠의 바위굴은 겨울에도 꽃이 시들지 않는 곳이었다.<\/p>\n<p>스승은 이곳에서 마지막 수행에 들었다. 수명은 이미 마라띠까에서 얻었다. 그러나 수명만 길고 깨달음이 완성되지 않으면, 긴 수명은 긴 숙제일 뿐이었다. 네팔 여인 샤꺄데비가 수행의 벗이 되었다. 닦는 법은 양닥 헤루까, 마음의 본성을 곧바로 꿰뚫는 가르침이었다.<\/p>\n<p>수행이 깊어질수록 세상이 이상해졌다.<\/p>\n<p>비가 오지 않았다. 한 해, 두 해, 세 해. 강바닥이 갈라지고 초목이 말라 죽었다. 인도와 네팔과 티벳에 걸쳐 흉년이 들고 사람과 가축이 병으로 쓰러졌다. 깨달음에 가까이 간 수행자 한 사람이 이 땅의 사나운 것들에게는 그만큼 무서웠던 것이다.<\/p>\n<p>스승은 선정 속에서 범인을 보았다. 셋이었다. 물속의 용 깅뽀, 땅의 야차, 그리고 허공을 떠도는 나찰.<\/p>\n<p>샤꺄데비가 말했다. \"스승이시여, 사람들이 죽어 갑니다. 수행을 멈추어야 하지 않겠습니까.\"<\/p>\n<p>스승은 고개를 저었다.<\/p>\n<p>\"멈추면 그들이 이긴다. 그리고 그들이 이기면, 다음에는 더 많은 사람이 죽는다. 그러나 그대 말이 옳다. 이것은 내 힘만으로는 안 된다.\"<\/p>\n<p>\"스승께서도 안 되는 일이 있습니까?\"<\/p>\n<p>\"양닥의 수행은 큰 장사와 같다.\" 스승이 말했다. \"물건이 귀할수록 남는 것도 크지만, 도적도 많이 꾄다. 그런데 나는 장사꾼이지 호위 무사가 아니다. 호위가 필요하다.\"<\/p>\n<p>그는 네팔 사람 둘에게 금가루를 한 되씩 들려 인도로 보냈다. 옛 스승 쁘라바하스띠께 장애를 다스리는 법을 청하는 편지와 함께.<\/p>\n<p>쁘라바하스띠는 편지를 읽고 껄껄 웃었다고 한다.<\/p>\n<p>\"그 녀석이 드디어 도와 달라고 하는군.\"<\/p>\n<p>그는 금강궐(바즈라낄라야)의 경전 『비됫따마』 가운데 장애를 다스리는 부분을 골라 내주었다. 두 사람이 지고 가야 할 만큼 묵직한 짐이었다.<\/p>\n<p>두 짐꾼은 땀을 뻘뻘 흘리며 히말라야 기슭을 올랐다. 짐이 네팔 땅에 들어서고, 양레쇠의 바위굴 앞에 닿는 순간 —<\/p>\n<p>바다에서 김이 피어올랐다. 땅에서 온기가 일어났다. 허공에 구름이 모여들었다. 그리고 하늘이 열렸다.<\/p>\n<p>삼 년 만의 비였다. 말라 죽은 줄 알았던 초목에서 싹이 텄고, 곡식이 한꺼번에 익었다. 사람들이 그 열매를 먹자 사람의 병도 가축의 병도 그쳤다. 짐꾼 둘은 빗속에 짐을 내려놓고 털썩 주저앉았다.<\/p>\n<p>\"…이거 내려놓기만 했는데요?\"<\/p>\n<p>\"그게 호위가 하는 일이다.\" 스승이 말했다. \"싸우기도 전에 도적이 달아나게 하는 것.\"<\/p>\n<p>그는 빗소리를 들으며 깨달았다. 지혜만으로는 모자란다. 지혜는 칼집 속의 칼과 같다. 그것을 뽑아 드는 힘, 장애를 장애인 채로 길로 삼는 방편이 함께 있어야 한다. 그날부터 그는 양닥과 금강궐을 하나로 묶어 닦았고, 마침내 그 동굴에서 대수인의 지명, 더 닦을 것이 없는 자리에 이르렀다.<\/p>\n<p>그날 저녁 무렵, 굴 밖에 네 형제가 와서 무릎을 꿇었다. 한밤중에는 또 다른 네 형제가 왔다. 새벽에는 네 자매가 왔다. 삼 년 가뭄을 일으켰던 무리였다.<\/p>\n<p>\"우리를 죽이시겠습니까.\"<\/p>\n<p>\"아니.\" 스승이 금강궐을 무릎에 내려놓았다. \"너희에게 일을 주겠다. 이 가르침을 닦는 이들을 지켜라. 맹세하겠느냐.\"<\/p>\n<p>그들은 자기들의 목숨과도 같은 심장의 정수를 그에게 바쳤다. 금강궐 법의 열여섯 수호신은 그렇게 생겨났다.<\/p>\n<p>이것이 그의 방식이 되었다. <strong>적을 없애는 가장 완전한 길은, 적을 수호자로 만드는 것이다.<\/strong><\/p>\n<p>며칠 뒤 호법신들이 스승을 찾아와 재촉했다.<\/p>\n<p>\"티벳 땅에서 절 하나를 지으려는데 귀신들이 밤마다 허문다고 합니다. 왕이 보낸 사신들이 지금 이리로 오고 있습니다. 그런데 그 사람들, 번뇌에 지쳐 다 쓰러지게 생겼습니다. 망율의 궁탕으로 마중 나가 주십시오.\"<\/p>\n<p>\"언제 도착하느냐?\"<\/p>\n<p>\"석 달쯤 뒤입니다.\"<\/p>\n<p>스승은 일어나 먼지를 털었다.<\/p>\n<p>\"그럼 지금 가서 기다리자. 남을 기다리는 것도 수행이다.\"<\/p>", "chars": 1843}, {"id": "c07", "label": "제7장", "title": "옷까지 벗어 바친 사신들", "epigraph": "왕의 황금은 흙먼지가 되고, 길가의 흙은 황금이 되네.", "part": {"label": "제2부", "title": "설산을 넘는 길"}, "html": "<p>망율의 궁탕, 네팔과 티벳의 경계에 걸린 고개 아래였다.<\/p>\n<p>다섯 사신은 거의 기어서 도착했다. 설산을 넘는 동안 말 두 필을 잃었고, 하인 하나는 눈병이 나서 한쪽 눈을 감고 걸었다. 바 쌜낭은 장부를 품에 안고 있었다. 그 장부에는 지금까지 잃어버린 물건이 빼곡했다.<\/p>\n<p>고갯마루 바위에 한 사내가 걸터앉아 볶은 보릿가루를 먹고 있었다. 나이를 알 수 없었다. 스물로도 보였고 여든으로도 보였다. 연꽃 모양 모자를 비스듬히 썼고, 어깨에는 삼지창 지팡이를 기대 놓았다.<\/p>\n<p>사내가 먼저 말을 걸었다.<\/p>\n<p>\"너희는 누구며 어디로 가느냐?\"<\/p>\n<p>바 쌜낭이 허리를 폈다.<\/p>\n<p>\"티벳의 신의 아들, 티쏭 데짼 왕께서 스승 빠드마 중내를 모셔 오라고 저희를 보내셨습니다. 혹시 양레쇠로 가는 길을 아십니까?\"<\/p>\n<p>\"안다. 그런데 갈 필요 없다.\"<\/p>\n<p>\"예?\"<\/p>\n<p>\"내가 빠드마 중내다. 너희를 석 달째 기다리고 있었다.\"<\/p>\n<p>다섯 사람은 그 자리에서 멍해졌다. 낙남 도제 뒤좀이 속삭였다.<\/p>\n<p>\"…저분이 그분이라고? 불에도 안 탄다는? 보릿가루 먹고 계신데?\"<\/p>\n<p>\"쉿.\" 쌜낭이 옆구리를 찔렀다.<\/p>\n<p>스승은 보릿가루를 털고 일어났다.<\/p>\n<p>\"그래, 나한테 바칠 것은 가져왔느냐? 있으면 내놓아라.\"<\/p>\n<p>다섯 사람은 허둥지둥 금가루 주머니를 하나씩 꺼내 바쳤다. 스승은 그것을 받아 들고 고개를 갸웃했다.<\/p>\n<p>\"더 없느냐?\"<\/p>\n<p>\"예?\"<\/p>\n<p>\"가진 게 더 있으면 다 바쳐라.\"<\/p>\n<p>다섯 사람은 서로를 쳐다보았다. 쎙고 랄룽이 우물쭈물 말했다.<\/p>\n<p>\"왕께서 그 이상은 안 주셨습니다. 저희한테도… 정말로 더는 없습니다.\"<\/p>\n<p>스승은 아무 말 없이 그들을 보았다. 바람만 불었다. 그 침묵을 견디지 못한 도제 뒤좀이 갑자기 웃옷을 벗기 시작했다.<\/p>\n<p>\"뭐 하는 거요!\" 쌜낭이 소리쳤다.<\/p>\n<p>\"더 바치라시잖소! 금은 없으니 옷이라도!\"<\/p>\n<p>그러자 다른 넷도 엉겁결에 옷을 벗었다. 네팔 국경의 칼바람 속에, 티벳의 사신 다섯이 속옷 바람으로 서서 덜덜 떨며 말했다.<\/p>\n<p>\"저희 다섯은 몸과 말과 마음을 스승의 종으로 바치겠습니다!\"<\/p>\n<p>그리고 스승의 발에 이마를 대고 돌았다. 이가 딱딱 부딪혔다.<\/p>\n<p>스승이 마침내 웃음을 터뜨렸다.<\/p>\n<p>\"옷은 도로 입어라. 얼어 죽으면 종으로 못 쓴다. 나는 티벳 사람들의 믿음에 바닥이 있는지 없는지 시험해 본 것이다.\"<\/p>\n<p>그는 금가루를 한 줌 쥐더니, 북쪽 하늘을 향해 휙 뿌려 버렸다. 금가루가 바람에 반짝이며 흩어졌다.<\/p>\n<p>\"아니, 그걸—!\" 도제 뒤좀이 바지를 반쯤 걸친 채 소리쳤다. \"그게 말 몇 필 값인 줄 아십니까!\"<\/p>\n<p>\"아깝나?\"<\/p>\n<p>\"아깝지요!\"<\/p>\n<p>스승은 오른손으로 평원을 한 번 쓸었다. 그러자 오른쪽에 있던 산들이 통째로 왼쪽으로 자리를 옮겼다. 다섯 사람이 고개를 왼쪽 오른쪽으로 번갈아 돌렸다. 이번에는 왼손으로 서쪽을 쓸었다. 발아래 대지가 온통 황금과 터키석과 산호로 바뀌었다.<\/p>\n<p>\"나에게는 <strong>보이는 모든 것이 황금이다.<\/strong>\" 스승이 말했다. \"황금은 내게 아무 짓도 못 한다. 다만 너희 왕의 뜻을 이루고 복을 짓게 하려고 잠시 받은 것이다.\"<\/p>\n<p>그는 보배로 변한 흙을 한 줌씩 다섯 사람에게 나누어 주었다. 그리고 나머지를 망율과 네팔 쪽으로 흩어 보내며 말했다.<\/p>\n<p>\"훗날 티벳의 황금은 모두 망율과 네팔로 흘러가게 될 것이다.\"<\/p>\n<p>쌜낭이 떨리는 손으로 받아 적었다. <em>예언: 티벳의 금은 네팔로 간다.<\/em> 그리고 그 아래에 작게 덧붙였다. <em>무역 적자?<\/em><\/p>\n<p>사신들은 손에 쥔 황금이 환영이 아닌가 싶어 저마다 살펴보았다. 도제 뒤좀은 깨물어 보았다. 이가 아팠다. 진짜였다.<\/p>\n<p>그는 손바닥의 금을 한참 보다가, 슬그머니 발치의 흙을 한 줌 더 집어 보았다. 그냥 흙이었다.<\/p>\n<p>\"욕심으로 쥐면 흙이지.\" 스승이 돌아보지도 않고 말했다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>쎙고 랄룽과 하인 둘은 이 소식을 먼저 왕에게 전하러 말을 돌렸다. 남은 사람은 쌜낭과 도제 뒤좀, 그리고 스승이었다. 짐을 질 사람이 필요했다.<\/p>\n<p>고개 아래 마을에서 길잡이로 나선 것은 열세 살 난 야크 목동이었다. 이름은 노르부. 작년 역병에 부모를 잃고 혼자 살았다. 아이는 품삯을 먼저 물었고, 그다음에 이렇게 물었다.<\/p>\n<p>\"귀신 나오는 길로 갑니까?\"<\/p>\n<p>\"나온다.\" 스승이 대답했다.<\/p>\n<p>\"그럼 품삯을 두 배로 주십시오.\"<\/p>\n<p>\"왜 두 배냐.\"<\/p>\n<p>\"무서우니까요. 무서운 값입니다.\"<\/p>\n<p>스승은 아이를 가만히 보았다. \"좋다. 대신 조건이 있다. 무서울 때마다 내게 말해라. 숨기지 말고.\"<\/p>\n<p>\"그게 무슨 조건입니까?\"<\/p>\n<p>\"가장 어려운 조건이다. 저 무사 양반은 평생 못 지킬걸.\"<\/p>\n<p>도제 뒤좀이 헛기침을 했다. 아직 웃옷 단추를 잘못 끼운 채였다.<\/p>\n<p>이렇게 해서 일행은 넷이 되었다. 스승과, 학자와, 무사와, 아이. 그리고 짐을 실은 노새 한 마리. 이 노새는 한번 서면 누가 밀어도 움직이지 않아서 이름이 '뚝심'이었다.<\/p>\n<p>고개 위에 서자 눈 덮인 고원이 끝도 없이 펼쳐졌다. 스승은 지팡이를 짚고 그 땅을 오래 바라보았다.<\/p>\n<p>\"쌜낭. 그대의 왕은 내가 귀신들과 싸워 주기를 바라는가.\"<\/p>\n<p>\"그렇습니다.\"<\/p>\n<p>\"잘 적어 두어라. 나는 싸우러 가는 것이 아니다. 저 땅의 신과 귀신들은 티벳 사람들보다 먼저 저기 살았다. 눈사태도, 우박도, 역병도 그들의 말이다. 아무도 들어 주지 않으니 소리를 지르는 것이지. 나는 <strong>들으러<\/strong> 간다. 그리고 그들에게 물을 것이다. 언제까지 그렇게 괴로워할 셈이냐고.\"<\/p>", "chars": 2538}, {"id": "c08", "label": "제8장", "title": "두 산이 갈라놓은 길", "epigraph": "교만의 산은 높을수록 좁아지니, 낮추는 이는 그 위로 올라서네.", "part": null, "html": "<p>망율 퇴카르. 길이 좁은 협곡으로 들어섰다. 양쪽으로 검은 절벽이 하늘을 가렸다.<\/p>\n<p>뚝심이가 멈춰 섰다. 도제 뒤좀이 고삐를 당기고, 엉덩이를 밀고, 욕을 했지만 노새는 네 발을 땅에 박고 귀만 뒤로 젖혔다.<\/p>\n<p>\"짐승이 안 가는 데는 이유가 있습니다요.\" 노르부가 말했다. 그리고 덧붙였다. \"스승님, 저 무섭습니다.\"<\/p>\n<p>\"잘 말했다. 어디가 무서우냐.\"<\/p>\n<p>\"산이… 산이 저를 보고 있는 것 같습니다.\"<\/p>\n<p>산이 정말로 보고 있었다.<\/p>\n<p>절벽 꼭대기에서 웃음소리가 굴러 내려왔다. 돌 구르는 소리 같은 웃음이었다.<\/p>\n<p>\"남쪽에서 온 거지야. <strong>내 이름을 아느냐.<\/strong> 나는 장중의 전쟁 여신 무짜메다. 이 산맥이 솟기 전부터 여기 있었다. 왕들도 내 고개를 지날 때는 말에서 내려 머리를 조아렸다. 너는 어째서 고개도 숙이지 않느냐.\"<\/p>\n<p>\"무짜메로군.\" 스승이 고개를 들었다. \"그대 이름은 안다. 그런데 그대는 그대가 누구인지 아는가?\"<\/p>\n<p>\"건방진—!\"<\/p>\n<p>땅이 울었다. 협곡 양쪽의 바위가 부풀어 오르더니, 길 한가운데서 산 두 개가 솟아올랐다. 하나는 스승 앞에, 하나는 일행 앞에. 순식간에 스승과 나머지 셋 사이에 거대한 산이 끼어들었다. 서로의 얼굴이 보이지 않았다.<\/p>\n<p>\"스승님!\" 노르부의 목소리가 산 너머에서 가늘게 들렸다.<\/p>\n<p>\"여기 있다.\" 스승의 목소리는 태평했다.<\/p>\n<p>\"어떻게 합니까!\"<\/p>\n<p>\"기다려라.\"<\/p>\n<p>산 이쪽에 갇힌 셋은 허둥거렸다. 쌜낭은 경전 보따리를 끌어안았다. 도제 뒤좀은 칼을 뽑았다가, 벨 것이 산이라는 것을 깨닫고 도로 집어넣었다. 그리고 한마디 했다.<\/p>\n<p>\"이 산을 기어오르면 되지 않소!\"<\/p>\n<p>그는 바위를 붙잡고 오르기 시작했다. 세 걸음쯤 오르자 산이 그만큼 더 높아졌다. 다섯 걸음 오르자 다섯 걸음만큼 더 높아졌다. 그가 땀을 뻘뻘 흘리며 내려왔을 때, 산은 처음보다 갑절은 높아져 있었다.<\/p>\n<p>\"…이 산, 내가 올라갈수록 커지는데?\"<\/p>\n<p>\"원래 그런 산입니다.\" 노르부가 말했다. \"제가 보기엔 그렇습니다.\"<\/p>\n<p>산 저편. 스승은 지팡이를 들어, 제 앞을 가로막은 바위를 향해 가볍게 던졌다. 지팡이가 바위에 꽂혔다. 스승은 지팡이를 디딤돌 삼아 한 발, 다시 한 발 바위 위로 올라섰다. 서두르지도 않았다. 마치 마을 어귀의 돌계단을 오르는 것처럼.<\/p>\n<p>그리고 바위 꼭대기에 서서 산을 칭찬하기 시작했다.<\/p>\n<p>\"좋은 바위다. 단단하고 늠름하구나. 이렇게 큰 바위는 처음 본다. 수천 년을 버텼겠지. 장하다.\"<\/p>\n<p>산이 움찔했다. 무짜메가 예상한 것은 저주나 진언이나 금강저였다. 칭찬은 아니었다.<\/p>\n<p>\"…무슨 짓이냐.\"<\/p>\n<p>\"그대가 듣고 싶은 말을 해 주는 것이다. 그대는 수천 년 동안 이 말을 듣고 싶어서 산을 쌓았다. 높아지면 누가 우러러봐 줄까 싶어서.\"<\/p>\n<p>스승은 바위 꼭대기에 앉아 다리를 꼬았다.<\/p>\n<p>\"그런데 무짜메여, 그대가 방금 무엇을 했는가. 지나가는 나그네 넷과 노새 한 마리가 절을 하지 않았다고 <strong>그대의 길을 막았다.<\/strong> 그대가 지키는 고개를 그대가 막았다. 이제 아무도 이 고개를 못 넘는다. 아무도 못 넘으면, 아무도 그대에게 절하지 않는다.\"<\/p>\n<p>긴 침묵이 흘렀다.<\/p>\n<p>\"높은 것은 스스로 높다고 말하지 않는다.\" 스승이 말을 이었다. \"저 하늘을 보아라. 그대의 산보다 높지만 아무에게도 절을 받으려 하지 않는다. 그래서 무너질 것도 없다. 그대가 절을 받아야 하는 것은, 받지 않으면 사라질까 두렵기 때문이다. 수천 년을 그렇게 떨며 살았구나.\"<\/p>\n<p>산이 천천히 내려앉았다. 일행 쪽을 막고 있던 산도 내려앉았다. 다시 마주 보게 된 셋은 서로 얼굴을 확인하고 한숨을 쉬었다. 도제 뒤좀은 아직도 바위 부스러기를 털고 있었다.<\/p>\n<p>무짜메는 터키석 장식을 한 거대한 여인의 모습으로 길가에 서 있었다. 그 얼굴에 처음으로 당혹이 스쳤다.<\/p>\n<p>\"…사람들이 나를 잊고 있다.\" 여신의 목소리가 작아졌다. \"옛날에는 고개마다 돌무더기를 쌓고 내 이름을 불렀다. 이제는 그냥 지나간다.\"<\/p>\n<p>\"그렇다면 잊히지 않을 일을 하나 주겠다.\"<\/p>\n<p>스승이 손을 내밀었다. 여신은 오래 망설이다가, 자신의 목숨과 같은 심장의 정수를 그 손에 올려놓았다.<\/p>\n<p>\"이제부터 이 고개를 넘는 수행자와 순례자를 지켜라. 사람들은 고갯마루에 돌을 쌓고 깃발을 걸며 그대를 부를 것이다. 두려워서가 아니라 고마워서.\"<\/p>\n<p>여신은 그날 새 이름을 받았다. 도제 유덴마, '터키석을 두른 금강녀'.<\/p>\n<p>노르부는 한참 뒤에야 입을 열었다.<\/p>\n<p>\"스승님. 도제 뒤좀 어른은 올라갈수록 산이 커졌는데, 스승님은 그냥 올라가셨잖아요. 뭐가 다릅니까?\"<\/p>\n<p>\"도제 뒤좀은 산을 <strong>이기려고<\/strong> 올라갔다. 이기려고 하면 산도 이기려고 한다. 나는 산을 <strong>칭찬하면서<\/strong> 올라갔다. 칭찬받는 산은 사람을 밀어내지 않는다.\"<\/p>\n<p>\"그럼 교만한 사람한테도 칭찬을 해 주면 됩니까?\"<\/p>\n<p>\"칭찬도 해 주고, 그 사람이 막고 있는 길도 보여 줘야지. 칭찬만 하면 아첨이고, 길만 보여 주면 잔소리다.\"<\/p>\n<p>도제 뒤좀이 툴툴거렸다. \"나는 잔소리만 듣는 것 같소.\"<\/p>\n<p>\"그대는 칭찬을 들으면 산처럼 커지잖나.\"<\/p>\n<p>노르부가 깔깔 웃었다. 뚝심이는 그제야 발을 떼었다.<\/p>\n<p>\"'내가 대단하다'는 생각은 지킬 것이 많아서 늘 불안하지.\" 스승이 걸으며 말했다. \"그것을 <strong>교만<\/strong>이라 한다. 다섯 가지 독 가운데 첫째다.\"<\/p>\n<p>\"다섯 개나 있습니까?\"<\/p>\n<p>\"가다 보면 다 만난다. 밖에서 한 번, 안에서 한 번씩.\"<\/p>", "chars": 2551}, {"id": "c09", "label": "제9장", "title": "벼락이 콩이 되던 날", "epigraph": "성난 불은 호수를 끓이고, 고요한 손바닥은 벼락을 콩알로 만드네.", "part": null, "html": "<p>북쪽 남탕 평원은 풀 한 포기 없이 넓었다. 하늘이 너무 가까워서 손을 뻗으면 닿을 것 같았다.<\/p>\n<p>\"여기는 숨을 데가 없군요.\" 쌜낭이 불안하게 말했다.<\/p>\n<p>\"숨을 필요가 있나?\" 도제 뒤좀이 코웃음을 쳤다. 그 순간 하늘이 갈라졌다.<\/p>\n<p>벼락이었다. 궁전 지붕도 쪼갠다는 고원의 벼락이 일행의 머리 위로 곧장 떨어졌다. 노르부는 눈을 감았다. 눈꺼풀 안쪽까지 하얘졌다.<\/p>\n<p>아무 일도 일어나지 않았다.<\/p>\n<p>눈을 떠 보니, 스승이 왼손바닥을 하늘로 펼치고 서 있었다. 손바닥 위에 작은 호수 하나가 거울처럼 고여 있었다. 벼락은 그 거울 같은 물에 떨어졌다. 그리고 —<\/p>\n<p>똑.<\/p>\n<p>스승의 손바닥 위에 마른 콩알 하나가 굴러다녔다.<\/p>\n<p>\"…콩?\" 도제 뒤좀이 말했다.<\/p>\n<p>\"콩이네.\" 쌜낭이 말했다.<\/p>\n<p>\"볶은 콩도 아니고 마른 콩이네요.\" 노르부가 말했다.<\/p>\n<p>북쪽 하늘에서 비명 같은 바람 소리가 났다. 하늘의 약녀(藥女) 남맨 카르모, 살이 없이 얼음으로만 된 몸에 흰 머리칼을 풀어 헤친 여신이었다. 그녀가 두 번째 벼락을 던졌다. 똑. 콩이 하나 더 굴렀다. 세 번째를 던졌다. 똑. 스승의 손바닥에 콩이 세 알이 되었다.<\/p>\n<p>\"벼락이 어째서 콩이 되는 겁니까!\" 노르부가 소리쳤다.<\/p>\n<p>\"벼락은 원래 크지 않다. 두려워하는 마음이 그것을 크게 보는 것이다. 겁을 빼고 보면 이 정도다.\"<\/p>\n<p>스승은 콩 세 알을 노르부의 손에 쥐여 주었다.<\/p>\n<p>\"간직해라. 다음에 무서운 일이 생기면 꺼내 보아라.\"<\/p>\n<p>노르부는 콩을 주머니에 넣었다. 그는 이 콩을 평생 버리지 않았다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>\"그대는 어째서 지나는 이마다 벼락을 던지는가.\" 스승이 하늘을 향해 물었다.<\/p>\n<p>\"던질 만하니 던진다!\" 여신이 소리쳤다. \"사람들이 내 산에서 돌을 캐 갔다. 내 호수에 죽은 짐승을 던졌다. 내 땅에 허락도 없이 길을 냈다. 칠 것이다. 다 칠 것이다!\"<\/p>\n<p>\"그대의 분노에는 까닭이 있구나.\"<\/p>\n<p>\"있다!\"<\/p>\n<p>\"그래서 벼락을 맞은 것은 누구였는가. 돌을 캔 석공인가? 지난여름 이 평원에서 쓰러진 것은 야크를 몰던 계집아이였다. 열두 살이었다.\"<\/p>\n<p>여신의 손이 허공에서 멈췄다.<\/p>\n<p>\"분노는 눈이 없다. 화살은 겨누고 쏘지만 벼락은 그냥 떨어진다. 그대는 원수를 친 것이 아니라 그저 <strong>쳤을<\/strong> 뿐이다.\"<\/p>\n<p>\"닥쳐라!\"<\/p>\n<p>여신은 듣지 않으려고 몸을 돌려 달아났다. 평원 끝의 뺄모 뺄초 호수로 뛰어들어 깊이깊이 숨었다. 얼음 같은 물이 그녀를 덮었다.<\/p>\n<p>스승은 호숫가에 앉았다. 그리고 가만히 눈을 감았다. 그의 마음속에서 호수 전체가 불더미로 바뀌었다.<\/p>\n<p>물이 데워지기 시작했다.<\/p>\n<p>\"스승님이 끓이시는 겁니까?\" 노르부가 물었다.<\/p>\n<p>\"내가 불을 지핀 것이 아니다. 저 안에서 끓는 것이다. 화가 난 채로 숨으면 숨은 자리가 솥이 된다. 너도 해 본 적 있지 않으냐. 화가 나서 이불을 뒤집어쓰고 누우면, 이불 속이 더 뜨겁다.\"<\/p>\n<p>노르부는 생각해 보았다. 맞는 말이었다. 엄마한테 혼나고 이불 속에 숨으면 늘 땀이 났다.<\/p>\n<p>호수가 부글부글 끓었다. 마침내 여신이 견디지 못하고 솟구쳐 나왔다. 얼음의 몸이 녹아내려 살이 떨어지고 뼈만 남아 있었다. 그녀는 비틀거리며 달아나려 했다.<\/p>\n<p>스승이 금강저를 던졌다. 금강저는 여신의 오른쪽 눈을 정확히 맞혔다. 여신은 모래톱에 쓰러졌다. 도제 뒤좀이 숨을 삼켰다. 끝내는 줄 알았던 것이다.<\/p>\n<p>스승은 걸어가서 금강저를 주워 들었다.<\/p>\n<p>\"그 눈은 감아 두어라. 분노가 일어날 때마다 그 눈이 그대에게 일러 줄 것이다. *지금 나는 반만 보고 있다*고.\"<\/p>\n<p>여신은 흐느꼈다. 화가 식은 자리에 남은 것은 지쳤다는 느낌뿐이었다.<\/p>\n<p>\"화가 난 채로는 반밖에 못 본다. 그것을 <strong>분노<\/strong>라 한다. 다섯 독 가운데 둘째다. 그러나 분노를 버리라는 것이 아니다.\" 스승이 말을 이었다. \"그 힘은 좋은 것이다. 방향을 주어라. 벼락은 지붕을 부수지만 같은 불이 등잔에 담기면 밤길을 밝힌다. 그대의 불로 어두운 것을 비추어라.\"<\/p>\n<p>여신은 목숨의 정수를 바치며 맹세했다. 장애를 짓지 않겠다고, 뜻을 어기지 않겠다고. 그녀가 받은 이름은 강까르 샤메, 도르제 쩬찍마. '흰 설산의 살 없는 여인, 외눈의 금강녀'.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그날 저녁 일행은 모닥불 앞에 둘러앉았다. 도제 뒤좀이 노르부에게 손을 내밀었다.<\/p>\n<p>\"그 벼락 콩, 하나만 줘 봐라.\"<\/p>\n<p>\"왜요?\"<\/p>\n<p>\"맛 좀 보게. 벼락으로 만든 콩이면 좀… 짜릿하지 않겠냐.\"<\/p>\n<p>\"스승님이 간직하라고 하셨어요.\"<\/p>\n<p>\"한 알만.\"<\/p>\n<p>노르부는 콩 세 알을 주머니 깊숙이 넣고 단추를 채웠다. 도제 뒤좀은 혀를 찼다. 스승은 버터차를 마시며 웃었다.<\/p>\n<p>그날 밤 노르부는 잠들기 전에 주머니를 만져 보았다. 콩 세 알이 그대로 있었다. 그는 부모가 죽은 뒤 처음으로, 무언가를 잃어버릴까 봐서가 아니라 그냥 좋아서 무언가를 만지작거렸다.<\/p>", "chars": 2276}, {"id": "c10", "label": "제10장", "title": "열두 자매의 마을", "epigraph": "원하는 것을 다 주는 집에서는, 떠나고 싶은 마음만은 주지 않네.", "part": null, "html": "<p>카라 고개로 오르는 길이었다. 오육 골짜기가 저 아래 보였다.<\/p>\n<p>갑자기 앞이 막혔다. 산이었다. 아니, 산들이었다. 고개 앞에 산이 하나 솟고, 그 뒤에 또 하나, 그 뒤에 또 하나. 겹겹이 솟은 산들이 하늘 끝, 수미산 기슭까지 이어져 있었다.<\/p>\n<p>\"또 산입니까?\" 노르부가 말했다. \"이번엔 몇 개예요?\"<\/p>\n<p>\"세지 마라. 세면 늘어난다.\" 스승이 말했다.<\/p>\n<p>열두 땐마 자매의 짓이었다. 그들은 티벳의 열두 설산과 호수에 사는 여신들로, 고개란 고개는 다 저희 것이라 여겼다.<\/p>\n<p>스승은 소매를 걷어붙였다. 그리고 첫 번째 산을 주먹으로 툭 쳤다. 산이 공깃돌처럼 날아가 저 멀리 떨어졌다. 두 번째 산도 툭. 세 번째도 툭. 스승은 산을 주먹으로 하나씩 던져 치우며 걸어갔다. 노르부와 쌜낭과 도제 뒤좀은 입을 벌린 채 그 뒤를 따랐다. 뚝심이만 아무렇지 않게 풀을 뜯으며 따라왔다.<\/p>\n<p>\"…저게 되는 거였소?\" 도제 뒤좀이 쌜낭에게 물었다.<\/p>\n<p>\"안 되는 거였지요. 방금 전까지는.\" 쌜낭은 받아 적을 생각도 못 했다.<\/p>\n<p>산이 다 치워지자 자매들이 머물던 봉우리들의 처소도 함께 허물어져 있었다. 길이 훤했다.<\/p>\n<p>그런데 날이 저물었다. 그리고 지도에 없는 마을이 하나 나타났다.<\/p>\n<p>집이 꼭 열두 채였다. 굴뚝마다 연기가 올랐고, 문마다 고운 옷을 입은 여인이 한 사람씩 서서 손짓했다.<\/p>\n<p>\"먼 길 오셨습니다. 묵어 가세요.\"<\/p>\n<p>스승은 마을 어귀 바위에 앉았다. \"나는 여기 있겠다. 그대들은 가고 싶으면 가라.\"<\/p>\n<p>\"같이 안 가십니까?\"<\/p>\n<p>\"가 보아야 아는 것도 있지.\"<\/p>\n<p>셋은 각자 다른 집으로 이끌려 들어갔다.<\/p>\n<p>도제 뒤좀이 들어간 집은 장군의 막사였다. 벽에는 하늘의 쇠로 벼린 칼이 걸려 있었고, 밖에서는 십만 군사가 그의 이름을 연호했다. 여인이 갑옷을 입혀 주며 속삭였다. <em>당신은 왕 밑에 있을 분이 아니지요.<\/em><\/p>\n<p>쌜낭이 들어간 집은 서고였다. 천장까지 닿는 시렁에 경전이 가득했다. 날란다에도 없는 것, 붓다께서 설하셨으나 세상에 전해지지 않은 것까지. 여인이 등잔을 밝혀 주며 속삭였다. <em>이것만 다 읽으면 깨달으실 겁니다. 천천히, 여기서, 평생.<\/em><\/p>\n<p>노르부가 들어간 집은 그냥 집이었다. 낮은 천장, 그을린 화덕. 화덕 앞에 어머니가 등을 돌리고 앉아 수제비를 뜨고 있었다.<\/p>\n<p>\"노르부 왔니. 손 씻고 앉아라.\"<\/p>\n<p>아이는 문턱에서 굳었다.<\/p>\n<p>한편 마을 어귀. 스승 앞에는 열두 여인 가운데 맏이가 와서 앉았다.<\/p>\n<p>\"당신에게는 무엇을 보여 드릴까요. 당신이 원하는 것이 보이지 않아요.\"<\/p>\n<p>\"그래서 답답한가?\"<\/p>\n<p>\"…조금.\"<\/p>\n<p>\"그대들이 누군지 안다. 이 땅을 지키는 열두 땐마 자매. 그대들은 사람을 해치지 않는다. 그저 원하는 것을 준다. 그러면 사람들이 스스로 떠나지 않지. 뼈가 될 때까지.\"<\/p>\n<p>\"원하는 것을 얻었는데 그게 나쁜가요? 저들은 지금 행복해요.\"<\/p>\n<p>\"가서 보자.\"<\/p>\n<p>막사 안에서 도제 뒤좀은 칼을 휘두르고 있었다. 군사들이 환호했다. 그런데 그는 땀에 젖어 있었고 눈이 퀭했다. 환호가 한 번 멎을 때마다 불안해져서 다시 칼을 휘둘렀다.<\/p>\n<p>서고에서 쌜낭은 경전을 읽고 있었다. 한 권을 덮으면 두 권이 늘어났다. 그는 한 줄도 마음에 담지 못한 채 책장만 넘기고 있었다. <em>아직 멀었다, 아직 모자라다<\/em> 중얼거리면서.<\/p>\n<p>\"저것이 행복인가.\" 스승이 물었다. \"목마른 이가 소금물을 마시는 것과 같다. 마실수록 탄다. 이것이 <strong>탐욕<\/strong>이다. 셋째 독이지.\"<\/p>\n<p>\"둘째는요?\"<\/p>\n<p>\"어제 만났다. 호수를 끓이던 이.\"<\/p>\n<p>스승은 마지막 집 앞에 섰다. 문은 열려 있었다. 노르부가 문턱에 그대로 서 있었다. 안에서 어머니가 수제비 그릇을 내밀고 있었다. 아이의 뺨에 눈물이 줄줄 흘렀다.<\/p>\n<p>\"왜 들어가지 않았느냐.\" 스승이 물었다.<\/p>\n<p>\"…엄마는 죽었습니다.\" 아이의 목소리가 떨렸다. \"제가 묻었습니다. 제 손으로 돌을 쌓았어요. 그러니까 저건 엄마가 아닙니다. 그런데… 그런데 한 그릇만 먹고 가면 안 됩니까? 가짜인 줄 아는데요. 한 그릇만.\"<\/p>\n<p>스승은 아이 옆에 쪼그려 앉았다.<\/p>\n<p>\"노르부. 저것이 가짜인 줄 아는 사람은 이 마을에서 너 하나다. 장군도 학자도 몰랐다. 너는 어떻게 알았느냐.\"<\/p>\n<p>\"묻었으니까요.\"<\/p>\n<p>\"그렇다. 너는 떠나보낸 것이 떠났다는 것을 안다. 그것을 <strong>무상(無常)<\/strong>을 안다고 한다. 세상에서 가장 쓴 약이고 가장 센 약이다. 저 그릇을 받으면 너는 그 약을 토하게 된다.\"<\/p>\n<p>아이는 오래 울었다. 그러고는 화덕 앞의 여인에게 꾸벅 절을 했다.<\/p>\n<p>\"고맙습니다. 그런데 저는 갈 데가 있습니다.\"<\/p>\n<p>여인의 모습이 흐려졌다. 집이, 화덕이, 마을이 안개처럼 걷혔다. 풀밭 위에 도제 뒤좀은 나뭇가지를 쥐고, 쌜낭은 납작한 돌을 들여다보며 앉아 있었다. 둘은 서로를 보고 얼굴이 벌게졌다.<\/p>\n<p>열두 자매는 본모습으로 서 있었다. 맏이가 물었다.<\/p>\n<p>\"우리는 벌을 받습니까.\"<\/p>\n<p>\"그대들의 재주는 사람들이 무엇을 가장 원하는지 아는 것이다. 그것을 반대로 써라. 수행자가 욕심에 걸려 길을 잃으려 할 때, 그가 <strong>정말로<\/strong> 필요한 것을 보여 주어라. 저 아이가 그대들의 첫 번째 스승이다.\"<\/p>\n<p>열두 땐마는 맹세했다. 스승은 자매 하나하나에게 비밀한 이름을 지어 주고 법의 수호자로 관정했다. 그들은 지금도 티벳의 열두 설산과 호수에 머물며 법을 지킨다고 한다.<\/p>\n<p>\"산을 던졌을 때 항복할 것이지 왜 마을까지 만들었소?\" 도제 뒤좀이 맏이에게 물었다.<\/p>\n<p>\"산은 힘이고, 마을은 재주예요.\" 맏이가 말했다. \"힘으로 진 건 진 게 아니죠. 재주로 져야 진 거죠.\"<\/p>\n<p>\"…그건 좀 알 것 같소.\" 도제 뒤좀은 처음으로 여신과 말이 통했다.<\/p>\n<p>그날 밤 야영지에서 쌜낭은 오랫동안 아무것도 적지 않았다. 그러다 한 줄을 썼다. <em>법에 대한 욕심도 욕심이다.<\/em><\/p>", "chars": 2730}, {"id": "c11", "label": "제11장", "title": "염소를 탄 대장장이", "epigraph": "남의 등불을 시샘하여 끄려 하나, 불은 나누어도 줄지 않네.", "part": null, "html": "<p>오육 골짜기에서는 쇠 두드리는 소리가 났다. 땅, 땅, 땅. 골짜기 전체가 모루였다.<\/p>\n<p>길 한복판에 사내 하나가 버티고 있었다. 숯처럼 검은 얼굴, 챙 넓은 모자, 한 손에는 쇠망치, 한 손에는 풀무. 타고 있는 것은 뿔이 꼬인 갈색 숫염소였다. 뒤로는 똑같이 생긴 형제가 삼백예순 명, 산비탈을 메우고 있었다.<\/p>\n<p>\"나는 도제 렉빠다.\" 사내가 말했다. \"티벳의 쇠는 다 내 것이다. 칼도, 솥도, 말편자도. 사람들은 쇠를 벼릴 때마다 내게 첫 불씨를 바쳤다.\"<\/p>\n<p>\"그런데?\"<\/p>\n<p>\"그런데 왕이 절을 짓겠단다. 사람들이 금을 녹여 불상을 만들겠단다. 내게 올 버터와 보리가 너희 부처에게 간단 말이다. 나보다 늦게 온 것이, 나보다 많이 받는다.\"<\/p>\n<p>\"그래서 화가 났는가.\"<\/p>\n<p>\"화가 난 게 아니다.\" 대장장이는 이를 갈았다. \"<strong>배가 아프다.<\/strong>\"<\/p>\n<p>노르부가 풉 하고 웃다가 얼른 입을 막았다. 스승은 진지했다.<\/p>\n<p>\"정직해서 좋군. 어떻게 하면 풀리겠나.\"<\/p>\n<p>\"내기를 하자. 내 망치로 너를 세 번 친다. 네가 버티면 길을 내주마. 못 버티면 너는 온 길로 돌아가고, 왕은 절을 못 짓는다.\"<\/p>\n<p>\"좋다.\"<\/p>\n<p>\"스승님!\" 쌜낭이 소매를 잡았다. 도제 뒤좀은 망치를 보고 침을 삼켰다. 별똥별의 쇠로 만든 것이었다.<\/p>\n<p>첫 번째 망치가 떨어졌다. 산이 울렸다. 망치는 스승의 몸을 <strong>지나갔다.<\/strong> 무지개에 돌을 던진 것 같았다. 스승은 그 자리에 그대로 앉아 있었다.<\/p>\n<p>두 번째. 뒤에 있던 바위가 가루가 되었다. 스승의 옷자락도 흔들리지 않았다.<\/p>\n<p>\"어떻게—\"<\/p>\n<p>\"그대는 평생 단단한 것만 쳤다. 단단한 것은 부서지지. 그러나 '나'라고 움켜쥘 것이 없는 이는 칠 데가 없다. 세 번째도 쳐 보겠나?\"<\/p>\n<p>대장장이는 망치를 내렸다. 어깨가 처졌다.<\/p>\n<p>\"졌다. 가라.\"<\/p>\n<p>\"아직 내 차례가 남았다.\" 스승이 말했다. \"그대는 세상의 모든 쇠를 벼린다 했지. 하나 묻겠다. 그대가 만든 칼 가운데 녹슬지 않은 것이 있는가? 부러지지 않은 것이 있는가?\"<\/p>\n<p>\"…없다. 쇠는 언젠가 다 삭는다.\"<\/p>\n<p>\"그래서 그대는 늘 불안한 것이다. 그대가 받는 대접이 그대가 만든 것에 달려 있는데, 만든 것은 다 삭으니까. 남이 조금만 더 받으면 내 몫이 사라질 것 같지. 이것이 <strong>질투<\/strong>다. 넷째 독이다.\"<\/p>\n<p>스승은 길가의 마른 풀에 부싯돌로 불을 붙였다. 그 불을 다른 풀에 옮겨 붙였다. 또 옮겨 붙였다.<\/p>\n<p>\"첫 불이 줄었는가?\"<\/p>\n<p>\"…아니.\"<\/p>\n<p>\"남이 공양받는 것을 보고 '잘되었다' 하고 기뻐하면, 그 기쁨만큼 그대도 받은 것이다. 이것을 <strong>수희(隨喜)<\/strong>라 한다. 밑천이 안 드는 장사지. 대장장이라면 셈은 밝을 텐데.\"<\/p>\n<p>도제 렉빠는 한참 생각했다. 삼백예순 형제도 웅성거렸다.<\/p>\n<p>\"그럼 나는 뭘 하나. 절이 서면 대장장이는 쓸모가 없지 않나.\"<\/p>\n<p>\"절에 종은 누가 만들고, 등잔은 누가 만들고, 문고리는 누가 만드나. 그리고 그대에게는 벼릴 것이 하나 더 있다. 쇠보다 단단하고, 녹슬지 않는 것.\"<\/p>\n<p>\"그런 게 어디 있어.\"<\/p>\n<p>\"<strong>맹세.<\/strong> 수행자가 스승 앞에서 한 약속. 그것을 지키는 이를 돕고, 깨는 이를 깨우쳐라. 그대는 오늘부터 맹세의 대장장이다.\"<\/p>\n<p>검은 얼굴에 천천히 웃음이 번졌다. 그가 받은 이름은 담짼 — '맹세에 묶인 이' 도제 렉빠. 오늘날에도 티벳의 대장장이들은 풀무질을 시작하기 전에 그의 이름을 부른다.<\/p>\n<p>그는 망치를 어깨에 메고 일행의 맨 뒤에 붙었다.<\/p>\n<p>\"왜 따라오나?\" 도제 뒤좀이 물었다.<\/p>\n<p>\"절 짓는 데 가는 거 아니냐. 못은 누가 박을 건데.\"<\/p>\n<p>염소가 뚝심이를 보고 매애 울었다. 뚝심이는 못 들은 척했다.<\/p>", "chars": 1708}, {"id": "c12", "label": "제12장", "title": "배고픈 귀신들의 골짜기", "epigraph": "한 줌 보릿가루 연기에, 천 년 주린 배가 차네.", "part": null, "html": "<p>노르부가 그 골짜기를 알아본 것은 냄새 때문이었다. 타다 만 향나무, 버려진 집에서 나는 곰팡이.<\/p>\n<p>\"여기… 저희 외가 마을입니다.\"<\/p>\n<p>마을은 비어 있었다. 작년 역병이 지나간 자리였다. 문짝이 바람에 덜컹거렸고, 엎어진 물통에 서리가 앉아 있었다.<\/p>\n<p>해가 지자 그것들이 나왔다.<\/p>\n<p>도제 뒤좀은 칼을 뽑지도 못했다. 싸울 상대가 아니었다. 배는 산만 한데 목은 바늘구멍 같은 것들이, 수십, 수백, 빈집마다 기어 나와 일행의 모닥불 주위로 모여들었다. 덤비지도 않았다. 그저 둘러앉아 솥을 바라보았다. 입을 벌리면 불꽃이 새어 나왔다.<\/p>\n<p>\"아귀(餓鬼)다.\" 쌜낭이 속삭였다. \"경전에서만 봤는데.\"<\/p>\n<p>노르부는 스승의 옷자락을 쥐었다. \"스승님, 무섭습니다. 이번에는 정말로요.\"<\/p>\n<p>\"무엇이 무서우냐.\"<\/p>\n<p>\"저 가운데… 아는 얼굴이 있을까 봐요.\"<\/p>\n<p>스승은 대답 대신 아이의 머리에 손을 얹었다. 그리고 아귀들에게 물었다.<\/p>\n<p>\"어째서 여기를 떠나지 못하는가.\"<\/p>\n<p>가장 앞에 있던 것이 쉰 목소리로 말했다. \"곡식을 숨겼다. 역병이 돌 때 이웃이 문을 두드렸는데 열어 주지 않았다. 내 것이 줄까 봐. 그러다 나도 죽었다. 곳간에 보리가 가득한데, 이 목으로는 한 알도 넘어가지 않는다.\"<\/p>\n<p>\"저 솥의 국을 주면 먹겠는가.\"<\/p>\n<p>\"입에 닿으면 불이 된다. 수백 번 해 보았다.\"<\/p>\n<p>도제 뒤좀이 낮게 말했다. \"스승님, 이것들은 맹세를 시켜도 소용없겠습니다. 힘도 없고…\"<\/p>\n<p>\"그렇다. 이들은 길들일 것이 아니라 <strong>먹여야<\/strong> 한다.\" 스승이 노르부를 보았다. \"네 자루에 보릿가루가 얼마나 남았느냐.\"<\/p>\n<p>\"…품삯으로 받은 것 한 자루요.\"<\/p>\n<p>\"그것을 불에 태워라.\"<\/p>\n<p>아이의 눈이 커졌다. 그것은 한 달 치 양식이었다. 무서운 값으로 받은.<\/p>\n<p>\"싫으면 안 해도 된다.\"<\/p>\n<p>노르부는 아귀들을 보았다. 그 큰 배, 그 가는 목. 문득 생각했다. <em>엄마도 아빠도, 죽기 전 며칠은 아무것도 넘기지 못했다.<\/em><\/p>\n<p>아이는 자루를 풀었다. 스승이 버터 한 덩이를 얹어 주었다.<\/p>\n<p>\"태우면서 이렇게 생각해라. <em>이 연기가 닿는 모든 이의 배가 부르기를. 목이 열리기를. 내가 아는 이든 모르는 이든.<\/em> 그리고 마지막에 이렇게 말해라. <em>이 공덕을 돌려 드립니다.<\/em> 누구에게 돌릴지는 네가 정해라.\"<\/p>\n<p>보릿가루가 숯불 위에서 구수한 연기를 올렸다. 스승이 낮게 진언을 외웠다. 옴 아 훔.<\/p>\n<p>아귀들이 고개를 들었다. 연기가 그들의 입으로, 코로 스며들었다. 불이 되지 않았다. 바늘 같던 목이 꿀꺽, 움직였다.<\/p>\n<p>누군가 울기 시작했다. 수백 년 만에 처음으로 무언가를 삼킨 것이었다.<\/p>\n<p>\"어째서 이것은 넘어가는가.\" 맨 앞의 아귀가 물었다.<\/p>\n<p>\"움켜쥔 것은 목에 걸리고, 내어 준 것은 넘어간다.\" 스승이 말했다. \"저 아이는 자기 먹을 것을 태웠다. 그 마음이 연기에 실렸으니 그대들이 받은 것은 보리가 아니라 <strong>베푸는 마음<\/strong>이다. 그것을 맛보았으니 이제 그대들도 할 수 있다. 다음 생에는 문을 열어 주어라.\"<\/p>\n<p>하나씩, 하나씩, 아귀들의 모습이 옅어졌다. 새벽이 올 때쯤 골짜기에는 서리와 재만 남았다.<\/p>\n<p>노르부는 빈 자루를 접었다.<\/p>\n<p>\"스승님. 공덕은 엄마 아빠한테 돌렸습니다. 되는 겁니까?\"<\/p>\n<p>\"된다.\"<\/p>\n<p>\"그런데요…\" 아이가 머뭇거렸다. \"엄마 아빠가 저기 있었습니까? 저 귀신들 속에요.\"<\/p>\n<p>스승은 한참 말이 없었다.<\/p>\n<p>\"모른다고 하면 실망하겠느냐.\"<\/p>\n<p>\"…아니요. 스승님도 모르는 게 있으니까 좀 낫습니다.\"<\/p>\n<p>\"있었든 없었든, 오늘 밤 네가 먹인 이들은 모두 누군가의 어머니이고 아버지였다. 끝없는 생을 돌았으니 한 번쯤은 네 어머니이기도 했을 것이다. 모든 중생을 어머니 보듯 하는 마음. 그것을 <strong>보리심<\/strong>이라 한다. 내가 귀신을 죽이지 않는 이유가 그것이다.\"<\/p>\n<p>도제 뒤좀은 그날 아침, 자기 보릿가루 자루를 말없이 노르부의 짐에 넣어 두었다.<\/p>\n<p><em>(티벳 사람들이 지금도 보릿가루와 버터를 태워 올리는 '쑤르' 공양은 이렇게 전해졌다고 한다.)<\/em><\/p>", "chars": 1875}, {"id": "c13", "label": "제13장", "title": "흰 야크의 눈보라", "epigraph": "눈이 멀어 제자리를 돌 때에는, 걸음을 멈추는 것이 길이네.", "part": null, "html": "<p>얄룽 골짜기로 넘어가는 샴뽀 설산, 샹부룽 골짜기. 고갯길 중턱에서 날씨가 뒤집혔다.<\/p>\n<p>눈보라가 아니었다. 그냥 <strong>흰색<\/strong>이었다. 하늘도 땅도, 앞도 뒤도, 제 손끝도 보이지 않았다.<\/p>\n<p>\"줄을 잡아라! 흩어지면 죽는다!\" 도제 뒤좀이 소리쳤다.<\/p>\n<p>일행은 허리에 줄을 묶고 걸었다. 한 시간, 두 시간. 앞장선 도제 뒤좀이 뭔가를 밟고 멈췄다. 눈 위에 발자국이 있었다. 사람 다섯, 노새 하나, 염소 하나.<\/p>\n<p>\"…우리 겁니다.\" 쌜낭의 목소리가 갈라졌다. \"우리가 돌고 있습니다.\"<\/p>\n<p>\"그럴 리 없소! 나는 똑바로 걸었소!\"<\/p>\n<p>\"똑바로 걷는다고 <strong>믿은<\/strong> 게지.\" 대장장이가 툴툴거렸다.<\/p>\n<p>무사는 화가 나서 더 빨리 걸었다. 다시 한 시간 뒤, 발자국은 두 겹이 되어 있었다.<\/p>\n<p>노르부가 주저앉았다. \"스승님, 무섭습니다. 그런데 뭐가 무서운지도 모르겠습니다. 아무것도 안 보이니까요.\"<\/p>\n<p>\"그것이 다섯째 독이다. <strong>어리석음.<\/strong> 다른 독들의 어머니지. 모르는데 모르는 줄도 모르고, 그래서 아는 척 열심히 걷는다. 걸을수록 같은 자리다. 윤회(輪廻)라는 말이 그 뜻이다. 바퀴처럼 돈다.\"<\/p>\n<p>\"그럼 어떻게 합니까.\"<\/p>\n<p>\"멈춘다.\"<\/p>\n<p>\"얼어 죽습니다!\" 도제 뒤좀이 외쳤다.<\/p>\n<p>\"돌다가 죽는 것보다는 늦게 죽는다. 다들 앉아라. 눈을 감아라. 어차피 보이지 않으니 아깝지 않을 것이다.\"<\/p>\n<p>일행은 눈 속에 둥글게 앉았다.<\/p>\n<p>\"숨이 들어온다. 그것을 알아라. 숨이 나간다. 그것을 알아라. 그것만 해라.\"<\/p>\n<p>처음에는 추위와 공포뿐이었다. 그러다 노르부는 이상한 것을 알아차렸다. 눈을 감으니 오히려 들렸다. 바람이 한쪽에서만 불고 있었다. 그리고 그 바람에는 <strong>박자<\/strong>가 있었다. 후우 — 후우 — 무언가 거대한 것이 숨 쉬는 박자였다.<\/p>\n<p>\"스승님. 이 눈보라… 누가 숨 쉬는 겁니다.\"<\/p>\n<p>\"이제 보이느냐.\"<\/p>\n<p>스승이 일어섰다. 그는 바람이 불어오는 쪽을 향해 오른손을 들어, 갈고리 모양의 손짓을 지었다.<\/p>\n<p>흰색이 찢어졌다.<\/p>\n<p>산이 있었다. 아니, 산을 거꾸로 세워 놓은 것만 한 야크가 있었다. 눈처럼 흰 털, 구름을 찌르는 뿔. 콧구멍에서 안개와 구름과 눈과 우박이 차례로 뿜어져 나오고 있었다. 설산의 신 얄하 샴뽀. 스승의 손짓이 보이지 않는 갈고리가 되어 그 코에 걸려 있었다.<\/p>\n<p>야크가 울부짖으며 머리를 흔들었다. 산비탈에서 눈사태가 쏟아졌다. 스승은 왼손으로 올가미의 손짓을 지어 그 목을 묶고, 사슬의 손짓으로 네 발을 묶고, 마지막으로 요령을 흔들었다. 맑은 소리가 설산을 채웠다.<\/p>\n<p>야크가 무릎을 꿇었다. 눈이 그치고 파란 하늘이 드러났다. 흰 야크의 모습은 사라지고, 흰 머리를 땋아 내린 소년이 눈밭에 엎드려 있었다.<\/p>\n<p>\"나는 아무도 해치려던 것이 아닙니다.\" 소년이 말했다. \"그저 숨을 쉬었을 뿐입니다.\"<\/p>\n<p>\"안다. 그대는 악하지 않다. 그저 <strong>몰랐을<\/strong> 뿐이다. 자기 숨결에 사람이 길을 잃는다는 것을. 세상의 괴로움 대부분은 악해서가 아니라 몰라서 생긴다.\"<\/p>\n<p>\"그럼 저는 숨을 참아야 합니까.\"<\/p>\n<p>\"아니다. 알고 쉬어라. 알고 쉬는 숨은 눈을 내리게 하고 강을 채운다.\"<\/p>\n<p>얄하 샴뽀는 목숨의 정수를 바쳤다. 흰 머리채를 흔들며 그가 물었다. \"저, 혹시 야크 모습이 더 멋있었습니까, 지금이 더 멋있습니까?\"<\/p>\n<p>\"야크 쪽이 덩치는 좋았지.\" 스승이 말했다. \"그런데 지금은 코에 갈고리가 없잖나.\"<\/p>\n<p>소년은 코를 문지르며 웃었다. 고개를 내려오며 노르부가 물었다.<\/p>\n<p>\"스승님, 다섯 개를 다 만났습니다. 교만, 분노, 탐욕, 질투, 어리석음. 이제 끝입니까?\"<\/p>\n<p>\"다섯 독에는 뿌리가 하나 있다.\"<\/p>\n<p>\"그건 뭡니까.\"<\/p>\n<p>\"곧 만난다. 아주 배가 고픈 놈이다.\"<\/p>", "chars": 1738}, {"id": "c14", "label": "제14장", "title": "맛없는 잔치", "epigraph": "모든 것을 삼키려던 입이, 맛없는 빵을 들고 오네.", "part": null, "html": "<p>북쪽 탕라 산맥의 기슭. 일행 앞에 그늘이 졌다.<\/p>\n<p>구름인 줄 알았다. 고개를 드니 얼굴이었다. 산만 한 야차가 산맥 위로 상반신을 내밀고, 일행을 내려다보며 입맛을 다시고 있었다. 입을 벌리자 골짜기 하나가 통째로 들어갈 것 같았다.<\/p>\n<p>\"…저건 뭡니까.\" 노르부가 말했다. 그리고 덧붙였다. \"무섭습니다. 아주 많이.\"<\/p>\n<p>대장장이 도제 렉빠가 침을 뱉었다. \"냰첸 탕라. 이 땅 신들의 우두머리지. 저놈이 고개를 숙이면 나머지가 다 숙이고, 저놈이 버티면 다 버틴다.\"<\/p>\n<p>야차가 말했다. 목소리가 천둥 같았다.<\/p>\n<p>\"남쪽에서 온 거지 중아. 내 동생들을 하나씩 꺾고 왔다지. 산 여신, 벼락 여신, 열두 자매, 대장장이, 흰 야크까지. 그래서 이제 내 차례냐?\"<\/p>\n<p>\"그대 차례다.\" 스승이 말했다.<\/p>\n<p>\"좋다. 그럼 나는 너희를 먹겠다. 중은 질기겠지만 저 꼬마는 연하겠군. 무사는 좀 기름지겠고. 노새는 후식이다.\"<\/p>\n<p>뚝심이가 처음으로 뒷걸음질을 쳤다.<\/p>\n<p>거대한 손이 내려왔다. 그 손가락 하나가 집채만 했다. 도제 뒤좀이 칼을 뽑았고, 쌜낭은 경전 보따리를 끌어안았고, 노르부는 주머니 속 벼락 콩을 꽉 쥐었다.<\/p>\n<p>스승은 집게손가락 하나를 들었다. 그리고 그 손가락을 야차의 코앞에서 까딱까딱 흔들었다.<\/p>\n<p>엄마가 말 안 듣는 아이한테 하는 그 손짓이었다.<\/p>\n<p>야차가 멈칫했다. 그리고 쭈그러들기 시작했다. 산만 하던 몸이 집채만 해지고, 집채만 하던 몸이 야크만 해지고, 야크만 하던 몸이 —<\/p>\n<p>일행 앞에, 터키석 상투를 튼 일곱 살쯤 된 남자아이가 서 있었다. 아이는 볼이 빨개져서 발끝으로 흙을 차고 있었다.<\/p>\n<p>\"…씨.\"<\/p>\n<p>스승이 아이를 내려다보며 말했다.<\/p>\n<p>\"이 아이는 용왕 메퇴카르라고도 하고, 건달바왕 '다섯 갈래 머리'라고도 하고, 냰 탕라라고도 한다. 이름이 셋이나 되는 녀석이지.\"<\/p>\n<p>그리고 일행을 돌아보며 덧붙였다.<\/p>\n<p>\"오늘 점심은 이 녀석한테 얻어먹자.\"<\/p>\n<p>아이가 고개를 홱 들었다. \"예?\"<\/p>\n<p>\"우리를 먹으려 했으니, 대신 우리를 먹여야지. 그게 공평하다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그날 오후, 일행은 남싸 골짜기에서 쉬고 있었다. 터키석 상투의 아이가 낑낑대며 쟁반 여러 개를 들고 나타났다. 그 뒤로 시종 귀신들이 줄줄이 음식을 날라 왔다.<\/p>\n<p>\"드… 드십시오. 잔치를 차렸습니다.\"<\/p>\n<p>도제 뒤좀의 눈이 반짝였다. 신들의 우두머리가 차린 잔치였다. 그는 가장 큰 납작빵 하나를 집어 크게 베어 물었다.<\/p>\n<p>씹었다. 또 씹었다. 그의 얼굴이 천천히 이상해졌다.<\/p>\n<p>\"…아무 맛이 없는데?\"<\/p>\n<p>쌜낭도 한 입 먹어 보았다. 정말로 아무 맛이 없었다. 짜지도 달지도 고소하지도 않았다. 물에 적신 흙 맛조차 나지 않았다. 다른 음식들도 마찬가지였다. 고기도, 국도, 떡도, 전부 맛이 없었다.<\/p>\n<p>\"이게 무슨 잔치요!\" 도제 뒤좀이 아이에게 따졌다. \"신들의 우두머리라는 자가!\"<\/p>\n<p>아이가 울상이 되었다.<\/p>\n<p>\"저는… 저는 원래 아무것도 안 먹습니다. 맛이 뭔지 몰라요. 남한테 뭘 대접해 본 적도 없고요. 늘 받기만 했지. 사람들이 바치는 제물은 다 연기로 맡기만 했고요.\"<\/p>\n<p>스승은 맛없는 빵을 천천히, 아주 맛있게 먹고 있었다.<\/p>\n<p>\"스승님은 맛있으십니까?\" 노르부가 물었다.<\/p>\n<p>\"맛있다.\"<\/p>\n<p>\"아무 맛도 안 나는데요?\"<\/p>\n<p>\"그러니까 맛있다.\" 스승이 말했다. \"노르부야, 맛은 빵에 있느냐, 혀에 있느냐?\"<\/p>\n<p>노르부는 생각했다. \"…혀에요?\"<\/p>\n<p>\"혀에도 없다. '내가 좋아하는 맛', '내가 싫어하는 맛'에 있다. 사람은 무엇을 먹든 거기에 '나'라는 양념을 친다. 이건 내 입에 맞다, 이건 내 입에 안 맞다. 그 양념이 세상에서 제일 짜다. 오늘은 그 양념 없이 먹어 보는 날이다.\"<\/p>\n<p>도제 뒤좀은 투덜거리며 빵을 다시 씹었다. 처음에는 여전히 맛이 없었다. 그런데 열 번쯤 씹자 이상한 일이 일어났다. 그냥 빵 맛이 났다. 좋지도 싫지도 않은, 그냥 보리의 맛. 배가 고팠다는 것과, 지금 먹고 있다는 것과, 해가 따뜻하다는 것만 있었다.<\/p>\n<p>\"…나쁘지 않군.\" 그가 중얼거렸다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>밥을 다 먹고, 터키석 상투의 아이가 스승 앞에 무릎을 꿇었다.<\/p>\n<p>\"저는 이 땅 신들과 귀신들의 우두머리입니다. 붉은 언덕 궁전에 벼락을 던진 것도 사실은 저입니다. 제가 비키면 모두가 비킵니다. 그러니 저는 비킬 수 없었습니다. 제가 없어지면 이 땅이 무너질 줄 알았습니다.\"<\/p>\n<p>\"그런데 지금 그대는 야차의 몸을 버리고 내 앞에 앉아 맛없는 빵을 대접했다. 땅이 무너졌는가?\"<\/p>\n<p>아이는 주위를 둘러보았다. 고원은 그대로였다. 바람이 풀을 흔들고 있었다.<\/p>\n<p>\"…그대로네요.\"<\/p>\n<p>\"'내가 붙들고 있어야 한다'는 생각, '나 없으면 안 된다'는 생각. 그것이 다섯 독의 뿌리다. <strong>나<\/strong>라는 생각. 그것은 모든 것을 삼키려 든다. 산도, 사람도, 노새도. 삼켜도 삼켜도 배가 부르지 않으니 그대처럼 몸이 산만 해지는 것이다.\"<\/p>\n<p>\"그럼 그걸 어떻게 없앱니까.\"<\/p>\n<p>\"없애는 게 아니다. 들여다보면 된다. 들여다보면 일곱 살짜리 아이만 하다. 볼이 빨개진.\"<\/p>\n<p>냰첸 탕라는 금강저와 요령 앞에서 맹세했다. 신들의 우두머리가 엎드렸다는 소문이 바람보다 빨리 고원을 건넜다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그 뒤 일행은 북쪽 펜율로 넘어갔다. 그런데 그곳에서 세 여신이 마지막 장난을 쳤다. 폭풍과 구름과 눈보라가 한꺼번에 몰려와, 일행은 걸음을 옮길 때마다 몸이 얼어붙었다. 노르부의 눈썹에 고드름이 맺혔다. 쌜낭의 붓이 얼어서 먹이 나오지 않았다.<\/p>\n<p>그리고 스승이 재채기를 했다.<\/p>\n<p>\"에취!\"<\/p>\n<p>일행이 일제히 스승을 쳐다보았다.<\/p>\n<p>\"…스승님도 추우십니까?\"<\/p>\n<p>\"조금.\" 스승이 코를 훌쩍였다. \"나도 몸이 있는데.\"<\/p>\n<p>노르부는 그 말이 이상하게 좋았다. 불에도 안 타고 벼락도 콩으로 만드는 사람이, 추우면 재채기를 한다.<\/p>\n<p>스승은 자리에 앉아 눈을 감았다. 설산에 깃든 여신들의 처소를 모두 불더미로 관했다. 그러자 눈 덮인 봉우리들이, 달군 쇠를 갖다 댄 버터처럼 녹아내렸다. 검은 바위가 드러나고, 녹은 물이 폭포가 되어 쏟아졌다. 숨을 곳을 잃은 야차녀들이 줄줄이 나와 목숨의 정수를 바쳤다.<\/p>\n<p>도제 뒤좀은 녹아내리는 산을 보며 감탄하다가 문득 물었다.<\/p>\n<p>\"스승님. 아까 그… '나'라는 놈 말입니다. 저한테도 있습니까?\"<\/p>\n<p>\"그대 것은 특히 크다.\"<\/p>\n<p>\"얼마나요?\"<\/p>\n<p>\"아까 그 야차만 하지. 아직 쭈그러들지 않았을 뿐.\"<\/p>\n<p>무사는 자기 손을 한참 들여다보았다. 쌜낭은 그 옆에서, 처음으로 받아 적는 대신 자기도 제 손을 보았다.<\/p>", "chars": 3067}, {"id": "c15", "label": "제15장", "title": "지팡이 끝의 샘", "epigraph": "저주는 보낸 이의 거울이요, 마른 땅의 물은 뚫는 이의 것이네.", "part": null, "html": "<p>라싸가 사흘 길로 다가왔을 때, 왕궁에는 이미 소문이 닿아 있었다.<\/p>\n<p>그 소문을 반기지 않는 사람이 있었다. 대신 딱다 루콩. 당나라의 장안을 함락시킨 장군이었고, 옛 신앙을 받드는 귀족들의 기둥이었다. 붓다의 법이 뿌리를 내리면 그들의 자리는 사라진다.<\/p>\n<p>\"그자가 살아서 왕을 만나게 해서는 안 된다.\"<\/p>\n<p>그는 늙은 주술사를 불렀다. 주술사는 보릿가루로 사람 모양을 빚고, 검은 실로 묶고, 일곱 가지 독을 발라 뙤룽 골짜기 쪽으로 던졌다.<\/p>\n<p>뙤룽 골짜기 어귀에서는 뜻밖의 손님들이 기다리고 있었다. 흰옷을 입은 스물한 명의 신, 게녠(우바새)들이었다. 그들은 다른 신들처럼 길을 막지 않았다. 줄을 맞춰 서서 꽃을 뿌렸다.<\/p>\n<p>\"저분들은 왜 안 싸웁니까?\" 노르부가 물었다.<\/p>\n<p>\"소문을 들었겠지.\" 쌜낭이 말했다. \"산 여신, 벼락 여신, 열두 자매, 대장장이, 흰 야크, 탕라. 다 지고 맹세했다는 소문.\"<\/p>\n<p>\"싸우기 전에 항복하는 것도 지혜입니다요.\" 대장장이가 말했다. \"나는 망치 두 번이나 휘두르고 나서 알았지.\"<\/p>\n<p>그런데 그 골짜기에서 일행은 이상한 갈증에 시달렸다. 가죽 물통이 까닭 없이 터졌다. 개울은 가 보면 말라 있었다. 뚝심이가 혀를 빼물었고, 노르부의 입술이 갈라졌다.<\/p>\n<p>\"이건 신들 짓이 아니야.\" 대장장이가 코를 킁킁거렸다. \"사람 냄새가 나. 사람이 건 저주다.\"<\/p>\n<p>도제 뒤좀이 칼자루를 잡았다. \"누군지 알겠소. 돌아가면 내가—\"<\/p>\n<p>\"그만두어라.\" 스승이 말했다. \"저주는 화살과 같아서, 맞을 과녁이 없으면 쏜 사람에게 돌아간다. 나는 되쏘지 않는다. 다만 받지 않을 뿐이다.\"<\/p>\n<p>\"받지 않는다니요?\"<\/p>\n<p>\"누가 그대에게 선물을 내밀었는데 그대가 받지 않으면, 그 선물은 누구 것인가?\"<\/p>\n<p>\"…내민 사람 것이지요.\"<\/p>\n<p>\"욕도 그렇고 저주도 그렇다.\"<\/p>\n<p>그날 밤, 라싸의 주술사는 자기가 빚은 보리 인형이 제 얼굴을 하고 있는 것을 보았다. 그는 인형을 불에 던지고 다시는 주술을 하지 않았다고 한다.<\/p>\n<p>그러나 갈증은 진짜였다. 스승은 뙤룽 아랫녘 동와라는 메마른 언덕에 올라 삼지창 지팡이를 높이 들었다가 땅에 꽂았다.<\/p>\n<p>바위가 쩍 갈라지며 맑은 물이 솟았다.<\/p>\n<p>노르부가 먼저 엎드려 마셨다. 뚝심이가 아이를 밀치고 주둥이를 박았다. 염소가 뚝심이를 밀쳤다.<\/p>\n<p>\"스승님은 물이 여기 있는 줄 어떻게 아셨습니까?\"<\/p>\n<p>\"물은 어디에나 있다. 깊이가 다를 뿐이지. 사람의 마음도 그렇다. 저 대신의 마음에도 맑은 물은 있다. 아주 깊이 파야겠지만.\"<\/p>\n<p>그 샘은 지금도 마르지 않았고, 사람들은 '숑빠 하추', 신의 물이라 부른다.<\/p>\n<p>그 뒤로 스승은 라싸로 곧장 가지 않았다. 허공에 걸린 바위산마다 하룻밤씩 머물며 바위의 신 짼들을 맹세에 묶었고, 장룽의 굴에서는 마(魔)의 무리를, 야리 꼭대기에서는 왕의 혼령들과 떠도는 귀신들을 묶었다. 노르부는 밤마다 다른 바위 위에서 잤다. 나중에는 바위마다 잠자리가 다르다는 것까지 알게 되었다. \"이 바위는 등이 배기고, 저 바위는 짼이 코를 골아요.\"<\/p>\n<p>언덕 아래로 강이 보였다. 강 건너 붉은 버드나무 숲에 깃발이 나부꼈다. 왕의 행렬이었다.<\/p>\n<p>쌜낭이 옷깃을 여몄다. \"스승님, 드디어 왕을 뵙습니다. 저… 한 가지 말씀드릴 것이. 폐하께서는 젊으시고, 온 고원의 주인이시고, 그래서 조금…\"<\/p>\n<p>\"조금?\"<\/p>\n<p>\"남에게 먼저 절해 보신 적이 없으십니다.\"<\/p>\n<p>스승이 빙긋 웃었다.<\/p>\n<p>\"무짜메가 생각나는군. 산 대신 왕관을 쓴.\"<\/p>", "chars": 1649}, {"id": "c16", "label": "제16장", "title": "절하지 않는 왕", "epigraph": "왕은 스승의 절을 기다리고, 스승은 왕의 절을 기다리네. 그 사이에서 옷만 타네.", "part": {"label": "제3부", "title": "붉은 바위의 왕"}, "html": "<p>닥마르의 붉은 버드나무 숲, 수르카르 강가. 하스뽀리 산이 그 뒤에 낮게 엎드려 있었다.<\/p>\n<p>티쏭 데짼 왕은 비단 차양 아래 서 있었다. 좌우로 대신들과 왕비들과 오백 기병이 늘어섰다. 왕은 속으로 생각하고 있었다.<\/p>\n<p><em>나는 티벳의 모든 검은 머리 백성의 주인이요, 갈기 달린 모든 짐승의 주인이요, 법을 지키는 왕이다. 스승이 내게 절을 하며 다가올 것이다.<\/em><\/p>\n<p>숲 어귀에 선 스승도 생각하고 있었다.<\/p>\n<p><em>나는 성취를 얻은 요기이고, 왕이 스승으로 모셔 온 사람이다. 왕이 내게 절을 하며 다가올 것이다.<\/em><\/p>\n<p>두 사람은 한참을 마주 서 있었다. 아무도 움직이지 않았다.<\/p>\n<p>한 식경이 지났다. 왕비 하나가 하품을 참았다. 기병의 말 한 마리가 오줌을 쌌다. 쌜낭은 붓을 든 채 굳어 있었다. 이 장면을 뭐라고 적어야 할지 몰랐다. <em>왕과 스승이 서로 절하지 않음. 아직도.<\/em><\/p>\n<p>노르부가 도제 뒤좀의 소매를 당겼다.<\/p>\n<p>\"어른, 저 두 분 언제까지 저러고 계실까요?\"<\/p>\n<p>\"글쎄다. 둘 다 고집이 산만 하니.\"<\/p>\n<p>\"…무짜메 여신 같네요.\"<\/p>\n<p>도제 뒤좀은 웃음을 참느라 얼굴이 빨개졌다.<\/p>\n<p>마침내 스승이 입을 열었다. 말이 아니라 노래였다.<\/p>\n<blockquote class=\"verse\"><p>삼계의 중생은 늘 죽음을 향해 가나,<br>나는 죽음 없는 빠드마 중내라.<br>신과 귀신 여덟 무리를 신하로 부리니,<br>나는 왕 빠드마 중내라.<\/p><p>마음이라는 참 종이 위에<br>말을 떠난 글자를 쓰니,<br>나는 글 쓰는 이 빠드마 중내라.<\/p><p>나타나는 것이라는 판 위에<br>둘 아닌 그림을 그리니,<br>나는 그림 그리는 이 빠드마 중내라.<\/p><p>다섯 독의 병으로 앓는 이를<br>번뇌 없는 약으로 고치니,<br>나는 의사 빠드마 중내라.<\/p><p>지혜와 자비의 무기를 들고<br>그릇된 생각의 적을 꺾으니,<br>나는 용사 빠드마 중내라.<\/p><\/blockquote>\n<p>노래가 끝나자 스승은 왕을 똑바로 보았다.<\/p>\n<p>\"그대는 붉은 얼굴 나찰들의 주인, 티벳의 왕이다. 세상의 교만으로 우쭐한 중생이여. 자만은 윤회에 다시 태어나는 씨앗이다. 그대는 번뇌와 다섯 독으로 몸을 꾸몄구나. 그런데 그대는 권세가 크다 하면서, 정작 왕 자신에게는 절을 받지 않고 —\"<\/p>\n<p>스승의 손가락이 왕의 비단 겉옷을 가리켰다.<\/p>\n<p>\"<strong>왕의 옷에<\/strong> 절을 받는구나.\"<\/p>\n<p>스승이 손짓을 하나 했다. 손끝에서 빛이 나갔다.<\/p>\n<p>왕의 비단 겉옷이 그 자리에서 화르르 타올랐다. 살은 털끝도 그슬리지 않았다. 왕관의 술이 타서 떨어졌다. 오백 기병의 말들이 일제히 무릎을 꿇었다. 대신들이 비명을 지르며 엎어졌다.<\/p>\n<p>티쏭 데짼은 속옷 바람으로 서서 재가 된 옷을 내려다보았다. 그리고 웃음을 터뜨렸다. 왕이 된 뒤 처음으로, 아무 눈치도 보지 않는 웃음이었다.<\/p>\n<p>\"제가 절을 받고 있던 것이 이 옷이었군요.\"<\/p>\n<p>\"그렇소. 옷이 절을 받고 있었소. 그대가 아니라.\"<\/p>\n<p>왕은 흙바닥에 온몸을 던져 절했다. 신하들이 따랐다. 대신 딱다 루콩만이 마지막까지 서 있다가, 혼자 남은 것을 알고 무릎을 굽혔다.<\/p>\n<p>쌜낭은 그제야 붓을 놀렸다. <em>왕이 절함. 옷은 탐. 비단 한 필 손실.<\/em> 그리고 잠시 생각하더니 덧붙였다. <em>그러나 남는 장사.<\/em><\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>왕은 스승을 궁으로 모셨다. 황금 자리에 앉히고, 비단 외투를 새로 입혀 드리고, 차와 음식과 세상의 진귀한 것들을 다 올렸다. 그리고 황금과 터키석으로 만든 만다라를 바치며 청했다.<\/p>\n<p>\"나모 구루. 에마호. 저는 붉은 얼굴 나찰들의 주인입니다. 티벳 사람들은 길들이기 어렵고, 거룩한 법의 무리를 두려워합니다. 스승께서 화신의 몸으로 오셨으니, 땅에 가피를 내려 주십시오.\"<\/p>\n<p>\"그러겠소.\" 스승이 말했다. \"오는 길에 야차와 여신들은 맹세에 묶어 두었소. 그런데 대왕, 가장 길들이기 어려운 것이 남았소.\"<\/p>\n<p>\"그것이 무엇입니까. 제 군대를 내어 드리겠습니다.\"<\/p>\n<p>\"군대로는 안 되오. <strong>사람의 마음<\/strong>이니까.\"<\/p>\n<p>왕은 고개를 끄덕였다. 그리고 문득 생각난 듯 물었다.<\/p>\n<p>\"그런데 스승이시여, 아까 그 옷 말입니다. 제가 제일 아끼던 옷이었습니다.\"<\/p>\n<p>\"알고 있소.\"<\/p>\n<p>\"…아셨군요.\"<\/p>\n<p>\"제일 아끼는 것이라야 태울 가치가 있지.\"<\/p>\n<p>왕은 그날 밤 시종에게 일렀다. 앞으로 스승을 뵈러 갈 때는 두 번째로 아끼는 옷을 입겠다고. 그는 아직 몰랐다. 이 일이 한 번으로 끝나지 않으리라는 것을.<\/p>", "chars": 1971}, {"id": "c17", "label": "제17장", "title": "입맛 까다로운 산신", "epigraph": "젖은 공양은 싫다 하고 마른 것을 달라 하니, 귀신에게도 입맛이 있네.", "part": null, "html": "<p>스승이 말했다.<\/p>\n<p>\"티벳은 해로운 구름과 남녀 귀신의 땅입니다. 그런데 이 땅 어딘가에 티벳 전체를 쥐고 있는 용왕이 하나 있소. 그에게 먼저 공양을 올려야 하겠소.\"<\/p>\n<p>일행은 말드로 아래쪽으로 갔다. 스승은 '윤회의 구렁을 뒤흔드는' 의례를 행하고, 나쁜 길을 씻는 만다라를 펼쳤다. 왕과 신하와 백성이 함께 앉아 정화 의례를 했다. 그리고 말드로의 용왕 지짼에게서 용이 쥐고 있던 보물을 거두어 내는 의례를 마쳤다.<\/p>\n<p>용왕은 순순히 응했다. 대신 조건을 하나 걸었다.<\/p>\n<p>\"티벳의 왕과 저는 친구로 지냈으면 합니다. 서로 해치지 않고.\"<\/p>\n<p>\"좋다.\" 스승이 왕을 돌아보았다. \"대왕, 오늘부터 용왕과 친구요.\"<\/p>\n<p>왕은 얼떨결에 호수를 향해 꾸벅 절했다. 호수에서 거품이 보글보글 올라왔다. 용왕도 절을 한 모양이었다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그다음 스승은 하스뽀리 산꼭대기에 올랐다. 그리고 마노 그릇 하나에 물로 빚은 공양물, 또르마를 가득 채웠다. 그는 삼매에 들어 그 한 그릇을 산더미처럼 불어나게 했다. 그러고는 노래를 불렀다.<\/p>\n<blockquote class=\"verse\"><p>마음의 본성은 텅 비어 대상이 없다.<br>신도 없고 귀신도 없다.<br>내게 어떤 둔갑을 보여도<br>나는 티끌만큼도 흔들리지 않는다.<br>이 큰 공양을 받고, 이 땅을 내어 주어라.<br>티쏭 데짼의 뜻을 이루게 하고<br>절을 세우게 하라.<br>신과 귀신들아, 진언 지닌 이의 말을 어기지 마라.<\/p><\/blockquote>\n<p>노래가 끝나자 티벳의 신과 귀신들이 물 또르마 둘레로 모여들었다. 바위의 신, 물의 신, 땅의 신, 하늘의 신. 저마다 제 몫을 받아 갔다.<\/p>\n<p>딱 하나만 오지 않았다.<\/p>\n<p>\"마첸이 안 왔습니다.\" 대장장이가 코를 킁킁거리며 말했다. \"동쪽 끝 큰 설산의 주인이지. 그놈 고집은 내 모루보다 단단하오.\"<\/p>\n<p>스승은 쇠갈고리 모양의 손짓을 했다. 그리고 허공에 대고 무언가를 잡아당겼다.<\/p>\n<p>멀리 동쪽 하늘에서 비명이 들렸다. 다음 순간, 하스뽀리 옆에 거대한 무언가가 떨어졌다. 한쪽 다리는 길가에, 한쪽 다리는 하스뽀리 위에 걸쳐진 채였다. 스승의 갈고리에 가슴께를 꿰여 끌려온 산신 마첸이었다. 그는 모자를 쓴 늙은 대신 같은 모습으로 변하더니, 옷매무새를 가다듬고 헛기침을 했다.<\/p>\n<p>\"에헴. 저는 큰 맹세를 지닌 몸인데…\"<\/p>\n<p>그는 스승을 위아래로 훑어보았다. 그리고 말했다.<\/p>\n<p>\"<strong>꼬마 중<\/strong>이 하도 엄하게 부르니 안 올 수가 없어서 왔습니다. 그래, 무슨 분부신지?\"<\/p>\n<p>노르부가 풉 하고 웃었다. 세상에서 스승을 '꼬마 중'이라 부른 이는 처음이었다. 쌜낭이 급히 노르부의 입을 막았다.<\/p>\n<p>스승은 화내지 않았다.<\/p>\n<p>\"이 공양 구름 또르마를 가져가라. 그리고 왕의 뜻을 이루어 주어라.\"<\/p>\n<p>마첸은 또르마 그릇을 들여다보더니 코를 찡그렸다.<\/p>\n<p>\"분부라면 따르겠습니다만. 저, 제가 좀… 음식을 가리는 편이라서요.\"<\/p>\n<p>\"그래서?\"<\/p>\n<p>\"저는 마른 것을 좋아합니다. 밥 위에 물을 부은 이런 축축한 또르마는 영 입에 안 맞습니다. 마른 걸로 하나 따로 주시면 안 되겠습니까?\"<\/p>\n<p>대장장이가 이마를 짚었다. \"저 봐, 저 봐. 저래서 저놈이 동쪽 끝에 혼자 사는 거요.\"<\/p>\n<p>도제 뒤좀이 칼자루를 잡았다. \"스승님, 저 영감 그냥 —\"<\/p>\n<p>스승은 손을 들어 무사를 막았다. 그리고 하얀 그릇 하나를 꺼내, 그 안에 다섯 가지 보배를 갈아 넣었다. 가루가 된 금과 은과 터키석과 산호와 진주가 반짝였다. 스승은 그것을 가피하여 마첸에게 내밀었다.<\/p>\n<p>\"마른 것이다.\"<\/p>\n<p>마첸은 그릇을 받아 들고 냄새를 맡았다. 손가락으로 한 번 찍어 맛을 보았다. 그리고 얼굴이 활짝 펴졌다.<\/p>\n<p>\"…이거지요.\"<\/p>\n<p>그는 그 자리에서 맹세했다. 명을 따르겠다고, 왕의 뜻을 이루게 돕겠다고.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>마첸이 동쪽으로 돌아간 뒤, 도제 뒤좀이 볼멘소리를 했다.<\/p>\n<p>\"스승님, 왜 저런 영감 비위를 맞춰 주십니까? 그냥 혼내 주시지. 꼬마 중이라니!\"<\/p>\n<p>\"그가 원한 것은 마른 음식이 아니었다.\"<\/p>\n<p>\"그럼요?\"<\/p>\n<p>\"'나는 다른 놈들과 다르다'는 것. 모두가 같은 그릇에서 먹는데, 자기만은 따로 받고 싶었던 거다. 그것을 알아주면 고집이 풀린다. 사람도 그렇다.\"<\/p>\n<p>\"그럼 꼬마 중이라고 한 건 그냥 넘어가십니까?\"<\/p>\n<p>스승이 웃었다.<\/p>\n<p>\"그는 나이가 수만 살이다. 그 앞에서는 나도 꼬마지. 맞는 말에 화낼 일 있나.\"<\/p>\n<p>노르부가 손을 들었다.<\/p>\n<p>\"스승님, 그럼 저도 스승님을 꼬마 중이라고 불러도 됩니까?\"<\/p>\n<p>\"너는 열세 살이다.\"<\/p>\n<p>\"…아.\"<\/p>\n<p>그날 밤 하스뽀리의 땅이 길들여졌다. 쌜낭은 장부에 적었다. <em>티벳의 땅, 스승께 내어짐. 대가: 물 또르마 한 그릇(대부분), 보배 가루 한 그릇(마첸 전용).<\/em><\/p>", "chars": 2160}, {"id": "c18", "label": "제18장", "title": "헤뽀리의 금강무와 마음만 딴 데 있는 용", "epigraph": "몸은 담을 쌓고 입은 따르겠다 하나, 마음은 딴 데 가 있는 일꾼이 있었네.", "part": null, "html": "<p>절터는 얄룽 창뽀 강 북쪽 기슭, 왕이 처음 괭이질을 했던 바로 그 닥마르 벌판이었다. 노스승 샨따락시따가 인도의 오단따뿌리 대승원을 본떠 도면을 그렸다.<\/p>\n<p>가운데 삼층 큰법당은 세계의 중심 수미산. 그 둘레를 일곱 겹 황금 산이 감싸고, 사방에 네 대륙과 여덟 작은 대륙의 전각, 해와 달의 전각, 그 모두를 두르는 둥근 쇠담과 담 위의 백여덟 탑. 네 문 앞에는 돌기둥을 세우고, 그 위에 구리로 만든 개를 한 마리씩 앉히기로 했다.<\/p>\n<p>\"우주를 통째로 짓는 셈이군요.\" 왕이 말했다.<\/p>\n<p>\"그렇습니다. 이 절에 들어서는 이는, 우주가 본래 청정한 만다라임을 몸으로 걷게 될 것입니다.\"<\/p>\n<p>\"그런데 개는 왜 넣었습니까?\"<\/p>\n<p>\"우주에도 집 지키는 개는 있어야지요.\" 노스승이 진지하게 말했다.<\/p>\n<p>큰법당의 세 층은 저마다 다른 나라의 법식으로 올리기로 했다. 맨 위층은 법이 처음 난 곳이라 인도식, 가운데층은 왕의 외가가 있는 나라라 중국식, 아래층은 이 땅 사람들의 믿음을 위해 티벳식이었다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>해 질 녘, 스승은 벌판 곁의 하스뽀리 산에 올랐다.<\/p>\n<p>\"다 모여라.\"<\/p>\n<p>그 한마디가 고원 전체에 울렸다. 왔다. 설산의 신들, 호수의 여신들, 바위의 짼, 땅속의 싸닥, 물속의 루, 허공을 떠도는 것들. 터키석 장식의 유덴마가, 외눈의 쩬찍마가, 열두 땐마 자매가, 흰 머리채의 얄하 샴뽀가, 터키석 상투의 탕라가 맨 앞줄에 섰다. 마첸은 맨 끝에 서서 보배 가루 그릇을 아직도 들고 있었다. 대장장이는 이미 스승 옆에서 팔짱을 끼고 있었다.<\/p>\n<p>스승은 허공으로 걸어 올라갔다. 그리고 춤을 추었다.<\/p>\n<p>우겐의 궁전 지붕에서 추던 그 춤이었다. 이제는 떨어뜨릴 것이 없었다. 금강저를 든 오른손이 허공을 그을 때마다 빛의 금이 그어졌다. 발이 디딜 때마다 땅이 고요해졌다. 지는 해를 등진 그의 그림자가 벌판 위에 길게 떨어졌다. 그림자가 닿은 자리마다 신과 귀신들이 흙과 돌을 날라 쇠담의 기초를 놓았다.<\/p>\n<p>산 아래에서 노르부는 입을 벌리고 올려다보았다.<\/p>\n<p>\"쌜낭 어른. 저게 싸우는 겁니까, 춤추는 겁니까?\"<\/p>\n<p>\"…둘 다 아닌 것 같다.\" 쌜낭이 말했다. \"보여 주시는 거다. 두려움이 없으면 어떤 모습인지.\"<\/p>\n<p>그날부터 삼예의 공사는 낮밤이 없었다. 낮에는 사람이 쌓았고, 밤에는 신과 귀신이 쌓았다. 사천왕이 밤일의 감독을 맡았다. 그리고 이상한 일이 벌어졌다. <strong>밤에 쌓은 것이 낮에 쌓은 것보다 높았다.<\/strong><\/p>\n<p>석공 우두머리는 처음에는 기절했다. 사흘째부터는 자존심이 상했다. 이레째부터는 저녁마다 다음 날 치 돌을 밤일꾼들 몫까지 넉넉히 쌓아 두고 퇴근했다. 열흘째 그는 담벼락에 숯으로 이렇게 써 붙였다. <em>밤반 여러분, 동쪽 모서리 좀 삐뚤어졌습니다. 낮반 드림.<\/em> 이튿날 아침 동쪽 모서리는 반듯해져 있었다.<\/p>\n<p>일꾼은 사람과 귀신만이 아니었다. 돌은 중국에서 온 석공 하샹 마하야나와 북쪽 호르에서 온 석공들이 다듬었고, 나무는 중국의 목수 랑쩨와 네팔의 목수 바수가 맡았다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그런데 어느 날 목수들이 왕 앞에 와서 섰다.<\/p>\n<p>\"대왕이시여, 기둥과 들보는 다 짰는데… 나무가 없습니다.\"<\/p>\n<p>\"나무가 없다니?\"<\/p>\n<p>\"이만한 절에 들어갈 큰 나무가 이 고원에는 없습니다. 기다리고만 있습니다.\"<\/p>\n<p>왕은 낙심했다. 고원에는 나무가 귀했다. 이만한 목재를 어디서 구한단 말인가.<\/p>\n<p>바로 그때 흰 말을 탄 흰옷의 사내가 왕 앞에 나타났다. 얼굴이 희고 웃음이 상냥했다.<\/p>\n<p>\"나리, 삼예에 들 나무는 제가 시주하겠습니다. 숲 하나를 통째로 드리지요.\"<\/p>\n<p>\"정말이오?\"<\/p>\n<p>\"다만 조건이 하나 있습니다. 지금 스승 빠드마께서 선정에 드셨다지요? 그 선정을 풀어 주십시오. 그것만 해 주시면 됩니다.\"<\/p>\n<p>왕은 생각했다. <em>이렇게 큰 시주를 하는 걸 보니 성취자인가 보다.<\/em> 그는 그러겠다고 맹세했다.<\/p>\n<p>왕은 스승이 선정에 든 방으로 갔다. \"스승이시여, 선정을 풀어 주소서.\" 스승은 꿈쩍도 하지 않았다. 다시 말했다. \"스승이시여, 선정을 풀어 주소서. 큰 성취자가 오셨습니다.\" 그제야 스승이 눈을 떴다.<\/p>\n<p>왕이 자초지종을 아뢰자, 스승이 한숨을 쉬었다.<\/p>\n<p>\"대왕. 나무는 저절로 올 것이었소.\"<\/p>\n<p>\"예?\"<\/p>\n<p>\"나는 팔부의 신과 귀신들을 몸과 말과 마음, 세 가지로 다 묶었는지 살피고 있었소. 다른 이들은 다 묶였는데 한 녀석이 이상했소. 몸은 묶여서 삼예 담을 쌓고는 있소. 그런데 건성으로 쌓소. 말도 묶여서 '분부대로 하겠습니다' 하오. 그런데 <strong>마음은 묶이지 않아서<\/strong>, 슬그머니 나쁜 꾀를 품고 있었소. 그래서 그 녀석을 마저 묶으려고 선정에 들었던 것이오.\"<\/p>\n<p>\"그게 누굽니까?\"<\/p>\n<p>\"방금 흰 말 타고 온 그 녀석. 숲의 용이오.\"<\/p>\n<p>왕의 얼굴이 하얘졌다.<\/p>\n<p>스승이 말을 이었다. \"그 녀석이 내 선정을 풀게 한 것은 나무가 아까워서가 아니오. 마음까지 묶이기 싫었던 것이지. 훗날 말세가 오면 땅 위아래가 용의 차지가 될 것이오. 문둥병 같은 고약한 병이 퍼지고, 변방을 누르는 절과 사람의 집들이 용에게 넘어가 무너질 것이오.\"<\/p>\n<p>왕은 털썩 주저앉았다. \"제가 일을 망쳤습니다.\"<\/p>\n<p>\"반쯤만 망쳤소.\" 스승이 말했다. \"약속은 약속이니, 용은 나무를 줄 것이오.\"<\/p>\n<p>정말로 나무가 왔다. 숲의 용이 베어 낸 거대한 통나무들이 햇살에 실려 하늘을 날아와, 삼예 위에 사뿐히 내려앉았다. 목수 랑쩨는 하늘에서 떨어지는 들보를 받다가 넘어졌다. 바수는 허리를 붙잡고 웃었다.<\/p>\n<p>그날 밤 노르부가 스승에게 물었다.<\/p>\n<p>\"몸은 일하는데 마음이 딴 데 가 있는 거, 그게 그렇게 나쁩니까? 그래도 담은 쌓았잖아요.\"<\/p>\n<p>\"너는 경전을 읽을 때 어떠냐.\"<\/p>\n<p>노르부는 생각했다. 입으로는 읽고 있는데 마음은 저녁밥에 가 있을 때가 많았다.<\/p>\n<p>\"…아.\"<\/p>\n<p>\"몸과 입과 마음이 한 방향을 볼 때, 일이 비로소 내 것이 된다. 하나라도 딴 데 가 있으면, 담은 서도 절은 서지 않는다.\"<\/p>", "chars": 2790}, {"id": "c19", "label": "제19장", "title": "다들 안으로 들어가시오, 그리고 벌레였던 스승", "epigraph": "문밖으로 쏟아져 나온 신들을 한숨에 들이마시고, 떠나려던 두 스승은 짐을 푸네.", "part": null, "html": "<p>왕이 스물한 살 되던 호랑이해에 터를 다져, 말해에 절이 완성되었다. 다섯 해였다.<\/p>\n<p>왕은 처음 완성된 모습을 보고 말을 잃었다.<\/p>\n<p>\"이건… 생각조차 할 수 없던 일입니다.\"<\/p>\n<p>그래서 이름이 삼예, '생각을 넘어선 곳'이 되었다고도 한다. 정식 이름은 더 길었다. '영광의 삼예, 저절로 이루어진 곳'. 쌜낭은 정식 이름을 장부에 적다가 붓을 두 번 갈았다.<\/p>\n<p>양해에 낙성식이 열렸다. 스승과 노스승이 꽃을 뿌리자, 세 가지 신기한 일이 일어났다.<\/p>\n<p>첫째, 보리 전각의 비로자나 불상이 허공으로 둥실 떠올랐다. 그리고 한 바퀴 돌아 제자리에 앉았다.<\/p>\n<p>둘째, 큰법당 안의 모든 신들이 한꺼번에 밖으로 나왔다. 그림 속의 신, 조각한 신, 벽에 새긴 신이 전부 문밖으로 쏟아져 나와 마당을 가득 채웠다. 사람들은 신들을 구경하느라 정신이 없었다.<\/p>\n<p>왕만은 얼굴이 하얘졌다.<\/p>\n<p>\"스승이시여… 저분들 저렇게 많이 나오셨는데, 다시 안으로 다 들어가실 수 있겠습니까? 문이 좁은데.\"<\/p>\n<p>스승은 대답 대신 숨을 한 번, 깊게 들이쉬었다.<\/p>\n<p>후읍.<\/p>\n<p>마당의 신들이 회오리처럼 빨려 들어가, 한 분도 빠짐없이 법당 안 제자리로 돌아갔다. 문지방에 걸린 신은 하나도 없었다.<\/p>\n<p>왕은 그제야 숨을 내쉬었다. 노르부는 스승의 배를 쳐다보았다. 저 안에 신들이 잠깐 들어갔다 나온 건가 싶었다.<\/p>\n<p>셋째, 네 문의 돌기둥 위에 앉힌 구리 개 네 마리가 저마다 한 방향을 맡아 <strong>멍, 멍, 멍<\/strong>, 세 번씩 짖었다. 둘레의 쇠담은 하나씩 쌓아 올린 것이 아니라 한꺼번에, 단숨에 동쪽에서부터 솟아올랐다.<\/p>\n<p>노르부는 그 개 짖는 소리를 분명히 들었다고 평생 우겼다. 도제 뒤좀은 그날 보리술을 너무 마셔서 기억이 없다고 했다. 쌜낭은 적었다. <em>구리 개, 짖음. 세 번. 네 마리. 합계 열두 번.<\/em><\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>잔치가 끝나고, 두 스승이 왕 앞에 나란히 앉았다. 짐 보따리가 곁에 놓여 있었다.<\/p>\n<p>스승 빠드마가 말했다.<\/p>\n<p>\"대왕. 절이 섰으니 우리는 인도로 돌아가겠소. 그런데 떠나기 전에 한 가지 말해 주겠소. 그대와 나와 이 노스승, 우리 셋이 어떤 사이인지.\"<\/p>\n<p>왕은 귀를 기울였다.<\/p>\n<p>\"아주 먼 옛날, 마구따라는 땅에 가난한 여인이 하나 있었소. 닭을 치는 여인이었지. 그 여인에게 아들이 셋 있었소. 몬 사람의 세 형제였지. 어머니는 평생 모은 것으로 탑을 하나 세우고 싶어 했소. 세 아들이 어머니를 도와 탑을 쌓았소. 그 탑이 지금 네팔에 있는 자룽 카쇼르 대탑이오. 탑을 다 쌓고 세 형제는 서원을 세웠소. <em>저 먼 변방의 거친 땅에도 부처의 법이 서게 하소서.<\/em>\"<\/p>\n<p>\"그 셋이…\"<\/p>\n<p>\"우리요. 그다음 생에 셋은 따로따로 태어났소. 하나는 선인의 아들, 하나는 바라문의 아들. 그리고 하나는 —\"<\/p>\n<p>스승이 잠깐 멈췄다.<\/p>\n<p>\"— 벌레였소.\"<\/p>\n<p>\"…예?\"<\/p>\n<p>\"작은 벌레. 날개 달린.\"<\/p>\n<p>노르부가 쿡 하고 웃음을 터뜨렸다가 쌜낭에게 꼬집혔다. 왕도 웃음을 참느라 입술을 깨물었다. 노스승 샨따락시따만이 진지한 얼굴로 고개를 끄덕였다.<\/p>\n<p>\"맞습니다. 제가 바라문의 아들이었습니다.\"<\/p>\n<p>스승 빠드마가 말을 이었다.<\/p>\n<p>\"셋이 다시 그 탑 앞에 모여 공양을 올리고 저마다 서원했소. 선인의 아들은 빌었소. <em>다음 생에 변방에서 법을 지키는 왕이 되게 하소서.<\/em> 그래서 그대가 왕이 되었소. 바라문의 아들은 빌었소. <em>다섯 학문에 밝은 학자가 되어 그 왕의 스승이 되게 하소서.<\/em> 그래서 이분이 보디사뜨와가 되었소. 그리고 벌레는 —\"<\/p>\n<p>\"벌레도 빌었습니까?\" 노르부가 참지 못하고 물었다.<\/p>\n<p>\"벌레도 빌었다. <em>진언을 지니고 힘을 갖추어, 그 왕의 법을 지키게 하소서.<\/em> 벌레가 빌 수 있는 가장 큰 소원이었지.\"<\/p>\n<p>방 안이 조용해졌다.<\/p>\n<p>\"그래서 나라는 각기 달리 태어났어도, 셋이 이 티벳 땅에서 스승과 시주로 만났소. 대왕의 서원으로 이 절이 섰으니, 우리 둘은 할 일을 다 했소. 이제 인도로 가겠소.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>왕은 두 스승 앞에 은 그릇 둘을 놓았다. 그릇마다 황금 가루가 가득했다. 그리고 엎드려 울었다. 왕이 사람들 앞에서 우는 것을 처음 본 신하들이 당황해 서로 눈치를 보았다.<\/p>\n<p>\"두 스승께서는 거룩한 법의 땅에 태어나셨고, 저는 업에 끌려 이 붉은 얼굴의 땅에 왕으로 태어났습니다. 열세 살에 아버지를 여의었고, 스무 살에 절을 지을 생각을 했고, 스물한 살에 터를 닦았습니다. 이 땅은 아직 어둡습니다. 법의 소리가 한 마디도 울리지 않는 곳입니다. 절은 그릇일 뿐입니다. 담을 것을 주고 가셔야지요. 이 티쏭 데짼이 죽지 않는 동안만이라도 머물러 주십시오.\"<\/p>\n<p>두 스승은 마주 보았다. 노스승이 작게 말했다.<\/p>\n<p>\"이 땅은 거칠고, 선과 악을 가릴 줄 모르고, 대신들의 시샘이 깊습니다.\"<\/p>\n<p>\"알고 있소.\"<\/p>\n<p>\"그래도 남으실 겁니까?\"<\/p>\n<p>스승 빠드마가 웃었다.<\/p>\n<p>\"벌레 적에 한 약속이오. 우리 셋은 앞생과 뒷생의 서원으로 묶인 사이요. 왕의 체면을 깎을 수야 없지.\"<\/p>\n<p>\"매우 좋소.\" 노스승이 말했다. \"그렇게 합시다.\"<\/p>\n<p>두 스승은 짐을 풀었다.<\/p>\n<p>그날 밤 노르부는 잠이 오지 않았다. 그는 천장을 보며 생각했다. 벌레도 소원을 빈다. 벌레도 소원을 빌어서, 귀신을 맹세시키는 스승이 된다.<\/p>\n<p>그는 주머니에서 벼락 콩 세 알을 꺼냈다. 그리고 처음으로 소원을 빌었다. 뭐라고 빌었는지는 아무에게도 말하지 않았다.<\/p>", "chars": 2522}, {"id": "c20", "label": "제20장", "title": "해를 붙잡은 비구", "epigraph": "해 지기 전에 왕의 머리를 다 감기라 하니, 비구는 해를 붙들어 매네.", "part": {"label": "제4부", "title": "법을 구하는 사람들"}, "html": "<p>삼예가 서자 왕은 새 걱정이 생겼다.<\/p>\n<p>\"인도에 성취자가 많다고 한다. 그런데 이 땅에서 성취자가 한 사람도 나오지 않는다면, 후세 사람들이 법을 믿겠는가?\"<\/p>\n<p>그리하여 노스승 아래에서 다섯 젊은이가 머리를 깎았다. 눕 가문의 남카이 닝뽀, 드루구 에박샤, 랑 뺄기 쎙게, 루쵼 싱가라찌, 데 걜와 로되. 왕은 그들에게 사금 세 되를 들려 인도로 보냈다. \"이번 생에 대수인의 성취를 얻는 법을 구해 오너라.\"<\/p>\n<p>다섯은 인도를 헤매다 마침내 황금 바위산 '대붕'에 산다는 스승 훔까라를 찾아냈다. 그런데 시종이 고개를 저었다.<\/p>\n<p>\"스승께서는 아홉 겹 방 안에서 사유에 드셨소. 못 만나오.\"<\/p>\n<p>\"저희는 티벳에서 왔습니다. 설산을 넘어서…\"<\/p>\n<p>시종은 그들의 갈라진 발바닥을 보았다. 그리고 한숨을 쉬었다.<\/p>\n<p>\"좋소. 문은 내가 열어 주겠소. 그다음부터는 당신들이 알아서 억지로라도 스승 앞에 엎어지시오.\"<\/p>\n<p>시종이 아홉 개의 문을 하나씩 열었다. 다섯 사람은 마지막 방에 굴러 들어가 엎드렸다.<\/p>\n<p>\"큰스승이시여! 저희 왕께서 이번 생에 성불하는 법을 구해 오라 하셨습니다. 법을 못 얻고 돌아가면 왕께서 저희를 벌하실 겁니다!\"<\/p>\n<p>훔까라는 눈을 떴다. 그리고 웃었다.<\/p>\n<p>\"티벳의 왕은 보살의 종성이로구나. 너희가 고생을 감수하고 왔으니 인연이 있다.\"<\/p>\n<p>그는 다섯에게 관정을 주고, 피를 마시는 헤루까 신들의 얼굴을 보여 주고, 감로와 수명을 닦는 법을 가르쳤다. 그리고 말했다.<\/p>\n<p>\"일 년 닦아서 징표가 나오거든 티벳으로 가라.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>다섯이 수군거렸다. 랑 뺄기 쎙게가 먼저 말했다.<\/p>\n<p>\"스승은 티벳에서 법이 번성할까 봐 일부러 우리를 붙잡아 두시는 것 같다. 인도 사람들은 법을 시샘하니 오래 있다가는 목숨이 위태롭다. 지금 가자.\"<\/p>\n<p>남카이 닝뽀가 고개를 저었다.<\/p>\n<p>\"어미가 자식에게 독을 먹이지는 않는다. 스승은 그릇된 것을 가르치지 않으신다. 나는 일 년을 채우겠다. 너희가 가려거든 가라.\"<\/p>\n<p>넷이 떠날 채비를 하자, 훔까라가 쎙덩나무로 깎은
