 금강궐 하나를 랑 뺄기 쎙게에게 주었다.<\/p>\n<p>\"걸을 때는 손에 쥐고, 잘 때는 베개 밑에 꽂아라. 장애가 있을 것이다.\"<\/p>\n<p>네 사람은 네팔의 한 호숫가에서 잠이 들었다. 그 호수에는 검은 용이 살았다. 그날 밤 검은 뱀 한 마리가 기어 나와, 랑 뺄기 쎙게의 새끼손가락 끝을 물었다. 그는 다시 일어나지 못했다. 그는 스승의 말을 반만 믿었다. 금강궐은 받았지만, 일 년을 채우라는 말은 믿지 않았다.<\/p>\n<p>셋은 티벳으로 돌아가 왕에게 법을 바쳤다. 그러자 대신들이 들고일어났다.<\/p>\n<p>\"다섯을 보내 둘을 잃었다! 남은 너희 셋도 나라에 해가 된다!\"<\/p>\n<p>셋은 장의 북쪽 끝과 장중 땅과 도캄 아래쪽으로 각각 쫓겨났다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>일 년 뒤, 남카이 닝뽀가 돌아왔다. 걸어서가 아니었다. 그는 황금 바위 '자룽짼'에서 일 년을 채워 양닥 헤루까의 얼굴을 보았고, 그 길로 신통을 타고 날아와 왕 앞에 내려섰다.<\/p>\n<p>\"왕께서 원하시던 법, 영광의 양닥입니다.\"<\/p>\n<p>대신들이 코웃음을 쳤다. \"증거가 있소?\"<\/p>\n<p>남카이 닝뽀는 은빛 칼을 꺼내 제 가슴을 갈랐다. 가슴속에 고요한 신 마흔두 분이 채색 그림처럼 앉아 있었다. 왕은 그 자리에서 머리를 땅에 찧으며 절했다. 대신들은 슬금슬금 뒤로 물러났다.<\/p>\n<p>왕은 그를 스승으로 모셨다. 그러자 대신들이 또 들고일어났다.<\/p>\n<p>\"왕이 신하를 스승으로 삼는 것은 옳지 않다! 이자는 나라에 해가 되는 자다!\"<\/p>\n<p>남카이 닝뽀는 남쪽 카르추로 또 쫓겨났다. 그는 거기서 닦았다. 등불이 저절로 타올랐고, 바위에 등을 기대자 몸 자국이 남았고, 바위에 금강궐을 꽂자 햇살을 타고 길을 떠나는 모습이 보였다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>얼마 뒤 왕이 병이 들었다. 의원도, 점쟁이도, 무엇도 소용이 없었다. 마지막으로 점괘가 말했다. <em>쫓겨난 비구 남카이 닝뽀를 모셔 와야 낫는다.<\/em><\/p>\n<p>사신 둘이 카르추로 달려갔다. 남카이 닝뽀가 말했다. \"먼저 가거라. 내가 가겠다.\"<\/p>\n<p>사신들이 말을 달려 궁에 도착해 보니, 남카이 닝뽀가 이미 왕의 머리맡에 앉아 있었다. 한낮이었다. 사신들은 서로 마주 보았다.<\/p>\n<p>\"무엇이 필요하십니까?\" 왕이 힘없이 물었다.<\/p>\n<p>\"다른 것은 필요 없습니다. 왕께서 드시고 싶은 만큼의 음식과 마실 것을 가져오십시오. 그리고 드십시오.\"<\/p>\n<p>왕은 상을 받았다. 음식을 삼분의 일쯤 먹었을 때, 왕이 갑자기 볼을 감쌌다.<\/p>\n<p>\"…방금 흰옷 입은 여인이 나타나 내 뺨을 한 대 때린 것 같소.\"<\/p>\n<p>\"그게 바로 그겁니다.\" 남카이 닝뽀가 말했다. \"왕께서 저를 쫓아내 깨진 <strong>몸의 약속<\/strong>이 방금 메워졌습니다.\"<\/p>\n<p>삼분의 이쯤 먹었을 때, 왕이 다른 쪽 볼을 감쌌다.<\/p>\n<p>\"…이번엔 갈색 옷 여인이 때렸소.\"<\/p>\n<p>\"<strong>말의 약속<\/strong>이 메워졌습니다.\"<\/p>\n<p>음식을 다 먹었을 때, 왕이 두 손으로 얼굴을 감쌌다.<\/p>\n<p>\"…검은 옷 여인이오. 제일 아팠소.\"<\/p>\n<p>\"<strong>마음의 약속<\/strong>까지 메워졌습니다. 이제 다 나으셨습니다.\"<\/p>\n<p>왕은 얼얼한 뺨을 문지르며 일어났다. 정말로 병이 나아 있었다. 신하들은 웃음을 참느라 어깨를 떨었다. 노르부는 나중에 이 이야기를 들을 때마다 배를 잡고 굴렀다. \"세 번이나요? 왕을요?\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>대신들은 분했다. 그들은 꾀를 냈다.<\/p>\n<p>해가 서산에 걸린 저녁, 대신들이 남카이 닝뽀를 불러 세웠다.<\/p>\n<p>\"비구여. 그대가 왕의 머리를 감겨 드리시오. <strong>해가 지기 전에<\/strong> 다 끝내지 못하면 죄를 묻겠소.\"<\/p>\n<p>해는 이미 산마루에 반쯤 걸려 있었다. 왕의 머리는 길었다. 티벳 왕들은 머리를 땋아 올렸으니, 푸는 데만도 한참이었다.<\/p>\n<p>남카이 닝뽀는 아무 말 없이 마당으로 나갔다. 햇빛과 그늘이 갈리는 경계선을 찾아, 그 위에 쎙덩 금강궐을 꽂았다. 그리고 해를 향해 짧게 찬탄했다.<\/p>\n<p>해가 멈췄다.<\/p>\n<p>서산마루에 걸린 채, 반쯤 넘어간 그대로, 꼼짝도 하지 않았다.<\/p>\n<p>남카이 닝뽀는 천천히 왕의 머리를 풀었다. 천천히 감기고, 천천히 헹구고, 천천히 빗질하고, 천천히 다시 땋아 올렸다. 그동안 해는 서산마루에 걸려 있었다. 들판의 목동들은 해가 안 져서 어리둥절했다. 소들은 집에 가야 하는데 해가 지지 않으니 어쩔 줄을 몰랐다.<\/p>\n<p>다 끝나자 남카이 닝뽀가 대신들에게 말했다.<\/p>\n<p>\"이제 가축을 거두어들이라 하시오.\"<\/p>\n<p>그리고 금강궐을 뽑았다. 해가 붉은 덩어리가 되어 쑥 넘어갔다. 순식간에 한밤중이 되었다. 목동들이 깜깜한 들판에서 소를 찾느라 소리를 질렀다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>대신들은 이제 두려워졌다. \"저 요술 부리는 비구가 우리한테 주술을 걸지도 모른다. 죽여야 한다.\"<\/p>\n<p>그들은 왕과 남카이 닝뽀가 산책하는 길목에 숨어 기다렸다. 두 사람이 다가오자 칼을 뽑아 들고 뛰어나왔다.<\/p>\n<p>남카이 닝뽀가 번개처럼 몸을 돌렸다.<\/p>\n<p>\"<strong>훔! 훔! 훔!<\/strong>\"<\/p>\n<p>집게손가락 끝을 허공에 한 바퀴 돌렸다. 대신들 가운데 몇은 칼을 든 채 그 자리에 굳어 버렸다. 몇은 그대로 뒤로 넘어갔다.<\/p>\n<p>남카이 닝뽀가 왕을 돌아보았다.<\/p>\n<p>\"왕이시여, 놀라지는 않으셨습니까?\"<\/p>\n<p>왕은 가슴을 쓸어내리며 말했다.<\/p>\n<p>\"무섭고도 무섭구나. 하늘에서 떨어지는 쇠벼락보다, 비구의 '훔' 소리가 더 무섭다.\"<\/p>\n<p>남카이 닝뽀는 허공으로 날아올라 카르추로 돌아갔다. 대신들은 그 뒤로 한동안 '훔' 소리만 들어도 경기를 일으켰다고 한다. 그 바람에 절에서 염불하는 소리가 들리면 대신들이 귀를 막고 지나가는 일이 생겼다.<\/p>\n<p>노르부는 이 이야기를 쌜낭에게 듣고 나서 한동안 혼자 연습했다.<\/p>\n<p>\"훔! …훔!\"<\/p>\n<p>뚝심이가 한 번 쳐다보더니 다시 풀을 뜯었다.<\/p>\n<p>\"안 되네.\" 노르부가 말했다.<\/p>\n<p>\"일 년을 채워야지.\" 쌜낭이 말했다. \"남카이 닝뽀 스승도 일 년 채우셨잖니.\"<\/p>", "chars": 3598}, {"id": "c21", "label": "제21장", "title": "몬빠 하나가 짐을 지고 지나갔소", "epigraph": "인도의 해를 짊어지고 달려온 젊은이는, 기둥 속에 숨어 법을 옮기네.", "part": null, "html": "<p>삼예에 번역원이 열렸다.<\/p>\n<p>인도에서 온 학자와 티벳의 젊은 역경사가 둘씩 짝을 지어 앉았다. 인도 학자가 한 구절을 읊고 뜻을 풀면, 티벳 역경사가 그것을 제 나라 말로 옮겼다. 말이 없으면 만들었다. '공(空)'을 뭐라 할 것인가. '자비'는. '깨달음'은. 한 낱말을 두고 사흘을 다투기도 했다.<\/p>\n<p>그보다 먼저, 노스승 아래에서 일곱 사람이 머리를 깎았다. 티벳 사람도 계를 지킬 수 있는지 시험 삼아 뽑은 일곱이라, 사람들은 그들을 '시험해 본 일곱 사람'이라 불렀다. 그 가운데 하나가 바 쌜낭이었다. 그는 예셰 왕뽀, '지혜의 주인'이라는 이름을 받았다. 받아 적던 사람이 이제 가르치는 사람이 되었다. 그래도 장부는 놓지 않았다.<\/p>\n<p>노르부는 번역원의 먹 가는 일을 맡았다. 그는 열여덟 살이 되었다. 어느 날 그가 스승에게 물었다.<\/p>\n<p>\"스승님은 한마디로 귀신도 꿇리시는데, 어째서 저렇게 한 글자 한 글자 옮기게 하십니까? 그냥 사람들 마음에 법을 넣어 주시면 되지 않습니까.\"<\/p>\n<p>\"내가 떠난 뒤에는?\"<\/p>\n<p>노르부는 말문이 막혔다. 스승이 떠난다는 생각을 해 본 적이 없었다.<\/p>\n<p>\"신통은 본 사람만 믿는다. 본 사람이 죽으면 이야기가 되고, 이야기는 부풀거나 잊힌다. 그러나 <strong>글자는 남는다.<\/strong> 그리고 글자보다 오래 남는 것은 그것을 스스로 닦아 본 사람의 마음이다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>어느 밤 왕의 꿈에 금강살타가 나타났다.<\/p>\n<p>\"원인과 결과를 넘어, 깨달음과 해탈이 한꺼번에 오는 법이 있다. 까 족첸이라 한다. 티벳의 비구 둘을 보내 구해 오게 하라.\"<\/p>\n<p>왕은 두 젊은이를 골랐다. 빠고르 가문의 젊은이와 짱 땅의 렉둡. 둘은 머리를 깎고 번역술을 배운 뒤, 사금 한 되와 금 발우 하나를 들고 인도로 떠났다.<\/p>\n<p>도중에 산적들이 길을 막았다. 금을 내놓으라고 했다. 빠고르의 젊은이가 길가의 모래를 한 움큼 쥐어 금으로 바꾸어 던져 주었다. 산적들은 금모래를 줍느라 정신이 없었고, 두 사람은 그 틈에 빠져나갔다.<\/p>\n<p>\"스승님한테 배운 거야?\" 렉둡이 물었다.<\/p>\n<p>\"아니. 스승님이 하시는 걸 봤어. '보이는 모든 것이 금'이라고 하시던 거.\"<\/p>\n<p>\"그걸 보고 따라 했다고?\"<\/p>\n<p>\"…해 보니까 되더라.\"<\/p>\n<p>인도에서 둘은 쉬리 씽하를 찾아냈다. 빠드마 중내에게 하늘과 구름을 가르쳤던 바로 그 스승이었다. 쉬리 씽하는 금 발우를 받고 말했다.<\/p>\n<p>\"티벳의 왕은 믿음이 있고, 너희는 정진이 있구나. 이 법은 티벳에 퍼질 것이다.\"<\/p>\n<p>그는 족첸의 탄뜨라 스물다섯 편과 큰 경전 열여덟 편을 다 설했다. 그리고 빠고르의 젊은이에게 이름을 지어 주었다. 바이로짜나, '두루 비추는 이'.<\/p>\n<p>\"그런데 인도 사람들은 법을 시샘한다. 돌아가는 길에 목숨이 위태로울 것이다. <strong>빨리 걷는 법<\/strong>을 배워 가라.\"<\/p>\n<p>바이로짜나는 일 년 동안 빨리 걷는 법을 닦았다. 렉둡은 닦지 않았다.<\/p>\n<p>\"일 년이나? 나는 먼저 가서 왕께 소식을 전하겠다. 공도 세우고.\"<\/p>\n<p>렉둡은 먼저 떠났다. 그리고 길에서 산적을 만났다. 이번에는 모래를 금으로 바꾸어 줄 사람이 없었다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>일 년 뒤 바이로짜나는 모든 법을 인도식 야자잎에 베껴 짊어지고 달렸다. 하루에 한 달 길을 갔다.<\/p>\n<p>그날 밤 인도의 학자들이 한꺼번에 같은 꿈을 꾸었다. 한 비구가 인도의 해를 짊어지고 티벳 쪽으로 달려가더니, 해가 졌다. 학자들은 벌떡 일어나 걸음 빠른 추격꾼들을 풀었다.<\/p>\n<p>추격꾼들이 국경의 관문에 이르러 문지기 우두머리에게 물었다.<\/p>\n<p>\"티벳 비구 하나가 이리로 지나가지 않았소?\"<\/p>\n<p>문지기 우두머리는 바이로짜나와 벗을 맺고 금도 받은 사이였다. 그는 하품을 하며 말했다.<\/p>\n<p>\"티벳 비구 같은 건 못 봤소. <strong>변방 몬빠 하나가 짐을 지고 지나가긴 했소.<\/strong>\"<\/p>\n<p>\"그게 언제요?\"<\/p>\n<p>\"한 식경 전쯤?\"<\/p>\n<p>추격꾼들이 서로 쳐다보았다. 빨리 걷는 법을 닦은 이에게 한 식경이면, 이미 설산 너머였다.<\/p>\n<p>\"그럼 벌써 티벳이겠군.\" 추격꾼들은 돌아갔다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>바이로짜나는 왕 앞에 엎드려 말했다.<\/p>\n<p>\"원하시던 법을 얻어 왔습니다. 그런데 인도 사람은 법을 시샘하고, 티벳 대신들은 법을 미워합니다. 드러내지 마시기를 청합니다.\"<\/p>\n<p>그 말대로였다. 이레 뒤 인도에서 사람 둘이 와서 소문을 퍼뜨렸다.<\/p>\n<p>\"티벳 비구가 법은 못 얻고 외도의 사악한 주문을 가지고 갔다. 저자는 티벳을 망칠 자다!\"<\/p>\n<p>대신들이 들고일어났다. 왕은 대신들의 눈을 속이려고, 바이로짜나의 옷을 입힌 사람을 구리 통에 넣어 봉하고 강에 던졌다. 전기는 그 통 속에 변방 사람 하나를 대신 넣었다고 적는다. 노르부는 훗날 이 대목을 읽을 때마다 책을 덮었다. \"그 사람은 이름도 안 남았잖아요.\" 그 말에 대답할 수 있는 사람은 아무도 없었다.<\/p>\n<p>바이로짜나는 왕궁 꼭대기 성채의 속이 빈 기둥 안에 숨었다. 왕은 밤마다 몰래 기둥 앞에 앉아 법을 들었다. 기둥 속에서 목소리가 울려 나왔다.<\/p>\n<p>\"…다섯 번째 마음부 경전을 옮기겠습니다.\"<\/p>\n<p>\"좋소. 오늘은 거기까지 하고, 저 다리 좀 펴시오.\"<\/p>\n<p>\"기둥 안이라 다리를 못 폅니다.\"<\/p>\n<p>다섯 편째 번역을 마쳤을 때, 왕비 체뽕싸가 낌새를 챘다. 그녀는 기둥을 두드려 보더니 소리를 질렀다. \"속이 빈 기둥에서 사람 소리가 난다!\"<\/p>\n<p>대신들이 몰려와 바이로짜나를 끌어냈다.<\/p>\n<p>\"폐하께서 크게 미혹되셨습니다! 선왕들이 모은 금과 은을 진흙에 부어 절을 지으시더니, 이제는 인도의 사악한 주술사를 기둥 속에 숨겨 두고 그 말을 들으십니다! 벌을 내리지 않으면 나라의 법도가 무너집니다!\"<\/p>\n<p>왕은 어찌할 바를 몰랐다. 바이로짜나가 조용히 말했다.<\/p>\n<p>\"폐하, 저를 짜와롱으로 보내십시오. 저는 전생에 그곳 왕후의 아들로 태어난 적이 있습니다. 아직 남은 인연과 교화할 일이 있습니다. 그리고 훗날 인도에서 비말라미뜨라라는 학자를 모셔 오십시오. 그때 저를 시험하게 하소서. 그러면 티벳이 믿을 것이고, 폐하와 저는 다시 만날 것입니다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>바이로짜나는 동쪽 끝 짜와롱으로 유배되었다. 그곳 사람들은 \"티벳에서 이상한 사람이 왔다\"며 그를 이가 득실거리는 구덩이에 던져 넣었다.<\/p>\n<p>이들은 그를 물지 않았다. 아니, 물었는데 그가 가려워하지 않았다. 구덩이 위에서 내려다보던 사람들이 어리둥절했다.<\/p>\n<p>\"안 가렵소?\"<\/p>\n<p>\"가렵소.\"<\/p>\n<p>\"그런데 왜 안 긁소?\"<\/p>\n<p>\"가려운 것도 마음이 아는 것이고, 긁고 싶은 것도 마음이 아는 것이오. 아는 것은 그냥 알 뿐이오.\"<\/p>\n<p>그는 구덩이 속에서 말했다.<\/p>\n<p>\"나는 전생에 이 나라 왕후 렉셰 뺄모의 아들, 비구 뿌라르나였소. 서원이 있어 다시 왔소.\"<\/p>\n<p>그 말을 듣자 왕후가 잊었던 전생을 떠올리고 울며 달려왔다. 그리고 구덩이에서 그를 꺼내 발을 머리에 받들었다. 바이로짜나는 그 땅의 왕 유드라 닝뽀에게 족첸을 가르쳤다. 유드라 닝뽀는 훗날 그의 가장 뛰어난 제자가 되었다.<\/p>\n<p>노르부가 이 이야기를 듣고 쌜낭에게 물었다.<\/p>\n<p>\"어른, 바이로짜나 스승은 귀신도 안 만났는데 왜 그렇게 고생을 하셨습니까?\"<\/p>\n<p>예셰 왕뽀가 된 쌜낭은 장부를 덮고 말했다.<\/p>\n<p>\"스승께서 말씀하셨잖니. 귀신보다 사람이 어렵다고.\"<\/p>", "chars": 3345}, {"id": "c22", "label": "제22장", "title": "임금님의 옷은 또 탄다", "epigraph": "절하지 않는 스승이 하나 더 오니, 왕의 옷장이 또 비네.", "part": null, "html": "<p>바이로짜나가 떠난 뒤, 왕은 그의 말을 잊지 않았다.<\/p>\n<p>\"인도에서 가장 지혜로운 학자, 비말라미뜨라를 모셔 오너라.\"<\/p>\n<p>까와 뺄쩩, 마 린첸촉, 쪽로 루이 걜챈. 세 역경사가 인도로 떠났다. 비말라미뜨라는 그들의 청을 듣고 짧게 무언가를 말했다. 그런데 세 사람이 그 말을 저마다 다르게 알아들었다.<\/p>\n<p>까와 뺄쩩은 이렇게 들었다. <em>화살은 활에 기대지만, 손가락 솜씨가 좋으면 과녁에 닿는다.<\/em><\/p>\n<p>마 린첸촉은 이렇게 들었다. <em>배는 나무 한 토막에 기대지만, 솜씨가 좋으면 강을 건넌다.<\/em><\/p>\n<p>쪽로 루이 걜챈은 이렇게 들었다. <em>덕 있는 사람은 제 나라 없는 땅에서도 마음의 강물을 옮겨 간다.<\/em><\/p>\n<p>세 사람은 길을 가며 다투었다.<\/p>\n<p>\"화살이라고 하셨소.\"<\/p>\n<p>\"아니오, 배라고 하셨소.\"<\/p>\n<p>\"둘 다 아니오. 강물이라고 하셨소.\"<\/p>\n<p>\"아무튼 오신다는 거 아니오?\"<\/p>\n<p>\"…그건 셋 다 같소.\"<\/p>\n<p>세 사람은 거기서 다툼을 멈추었다. 뜻이 같으면 비유는 달라도 되었다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>비말라미뜨라가 삼예에 도착했다. 왕과 신하들이 마중 나와 그를 법당으로 모셨다.<\/p>\n<p>비말라미뜨라는 왕에게 절하지 않았다. 법당의 불상에도 절하지 않았다.<\/p>\n<p>대신들이 웅성거렸다. \"이 절에 학자를 여럿 모셨지만, 왕께도 절 안 하고 부처님께도 절 안 하는 이는 처음이다.\"<\/p>\n<p>노르부가 도제 뒤좀에게 속삭였다.<\/p>\n<p>\"…어디서 많이 본 장면인데요.\"<\/p>\n<p>\"쉿. 나도 지금 그 생각 하고 있다.\"<\/p>\n<p>비말라미뜨라가 대신들에게 물었다.<\/p>\n<p>\"그대들은 절의 뜻을 아시오?\"<\/p>\n<p>\"모릅니다.\"<\/p>\n<p>\"나는 신과 내 마음이 하나로 이어진 자리에서 이미 절을 올렸소. 겉모양의 절은 저 신이 감당하지 못하오. 그래서 신께도 왕께도 절하지 않는 것이오.\"<\/p>\n<p>왕은 속으로 생각했다. <em>그렇다면 이 사람은 불자가 아니라 외도인가?<\/em> 비말라미뜨라가 그 생각을 읽었다.<\/p>\n<p>\"왕께서는 믿지 못하시는구려.\"<\/p>\n<p>그는 법의를 벗고 비로자나 불상 앞에 섰다.<\/p>\n<p>\"비로자나여, 모습의 신이여. 비말라미뜨라가 지혜의 신께 세상의 방식으로 절하오.\"<\/p>\n<p>그가 절하는 순간, 불상의 정수리가 쩍 갈라졌다.<\/p>\n<p>법당이 얼어붙었다. 왕의 얼굴이 하얘졌다. <em>역시 외도다!<\/em><\/p>\n<p>\"기쁘지 않으시오?\" 비말라미뜨라가 물었다.<\/p>\n<p>\"…기쁘지 않습니다.\" 왕이 솔직하게 말했다.<\/p>\n<p>비말라미뜨라는 다시 절했다. 이번에는 불상의 정수리에 손을 얹었다.<\/p>\n<p>\"비로자나여, 지혜의 신들의 신이여. 다섯 지혜의 관정을 내리소서.\"<\/p>\n<p>갈라진 정수리에서 빛이 쏟아져 나왔다. 처음보다 훨씬 밝았다. 빛이 법당을 채우고, 삼예를 채우고, 모든 전각을 채웠다. 그대로 두 번째 낙성식이 되었다.<\/p>\n<p>그다음 비말라미뜨라가 왕을 향해 돌아섰다.<\/p>\n<p>\"이제 왕께 절하겠소.\"<\/p>\n<p>\"아, 아닙니다!\" 왕이 손을 내저었다. \"스승께서는 비밀 진언의 성취를 얻으신 분이니 절하지 마십시오!\"<\/p>\n<p>\"그대가 티벳의 법왕이라 불리니, 어떻게든 절하겠소.\"<\/p>\n<p>비말라미뜨라가 절했다. 그의 몸에서 나온 빛이 왕에게 닿았다. 그러자 —<\/p>\n<p>왕의 옷이 지글지글 그을리기 시작했다.<\/p>\n<p>\"아, 안 돼…\"<\/p>\n<p>왕은 그을리는 소매를 내려다보며 체념한 얼굴이 되었다. 오늘은 두 번째로 아끼는 옷이었다. 왕은 그을린 옷을 입은 채 비말라미뜨라에게 위아래로 엎드려 절했다.<\/p>\n<p>노르부는 끝내 참지 못하고 웃음을 터뜨렸다. 쌜낭이 붓을 떨어뜨렸다. 도제 뒤좀은 기둥 뒤로 숨어서 어깨를 들썩였다. 그날 밤 쌜낭은 장부에 적었다. <em>왕의 옷: 두 번째 손실. 이번엔 그을림. 수선 가능.<\/em><\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>비말라미뜨라는 허공에 뜬 사자좌에 앉았다. 왕은 갖가지 음식을 올리고, 보배 병에 금 세 되를 담아 바쳤다. 비말라미뜨라는 입을 다문 채 아무 말도 하지 않았다.<\/p>\n<p>왕은 속으로 생각했다. <em>남쪽 사람들은 욕심이 많다더니, 아직 성에 안 차는 모양이다.<\/em><\/p>\n<p>비말라미뜨라가 그 생각을 읽었다. 그는 바닥의 모래를 세 되쯤 퍼서 왕의 옷섶에 쏟아부었다.<\/p>\n<p>\"잠시 들고 계시오.\"<\/p>\n<p>왕은 옷섶을 받쳐 들었다. 무거웠다. 점점 더 무거워졌다. 견디다 못해 놓쳤다. 옷섶에서 쏟아진 것은 모래가 아니라 금이었다.<\/p>\n<p>비말라미뜨라가 말했다.<\/p>\n<p>\"대왕. 나에게는 <strong>보이는 모든 것이 금이오.<\/strong> 왕의 뜻을 이루어 드리려고 잠시 받아 둔 것뿐이오.\"<\/p>\n<p>노르부가 쌜낭의 소매를 잡아당겼다.<\/p>\n<p>\"어른, 저 말 어디서 들어 본 것 같은데요.\"<\/p>\n<p>\"궁탕 고개에서.\" 쌜낭이 장부를 넘기며 말했다. \"여기 적어 놨다. 그때가 처음이고, 이번이 두 번째다.\"<\/p>\n<p>\"그럼 세 번째도 있을까요?\"<\/p>\n<p>\"우리 왕께서 아직 깨닫지 못하셨으니, 있겠지.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>얼마 뒤 비말라미뜨라 앞에서 시험이 열렸다. 짜와롱에서 바이로짜나가 불려 왔다. 그가 옮긴 족첸의 법이 진짜인지 가리는 자리였다.<\/p>\n<p>비말라미뜨라는 바이로짜나의 번역을 한참 듣고 나서 말했다.<\/p>\n<p>\"이것은 내가 아는 법과 같소. 틀린 데가 하나도 없소.\"<\/p>\n<p>대신들은 할 말을 잃었다. 왕은 바이로짜나를 끌어안았다. 기둥 속에서 법을 듣던 밤들이 생각났다.<\/p>\n<p>\"이제 다리 펴고 앉으시오.\"<\/p>\n<p>\"감사합니다, 폐하. 짜와롱에서는 다리 펴고 지냈습니다. 이 구덩이에 있던 며칠만 빼고요.\"<\/p>", "chars": 2395}, {"id": "c23", "label": "제23장", "title": "예셰 초걜과 침푸의 꽃", "epigraph": "눈을 가리고 던진 꽃이 제 길을 찾아가니, 무사는 바위를 지나고 역경사는 말처럼 우네.", "part": null, "html": "<p>카르첸 땅에 한 공주가 있었다. 태어나던 날 마을 옆 호수가 갑절로 불어났다 하여 '호수의 여왕', 초걜이라 불렸다.<\/p>\n<p>열여섯이 되자 이웃 영주 둘이 그녀를 차지하겠다고 군사를 일으켰다. 그녀는 달아났고, 붙잡혔고, 채찍을 맞았고, 다시 달아났다. 마침내 왕이 싸움을 막으려 그녀를 왕비로 데려왔다. 초걜은 궁에서 아무것도 원하지 않았다. 원한 것은 하나, 법을 배우는 것이었다.<\/p>\n<p>왕은 그 마음을 알아보았다. 그는 관정의 자리에서 스승에게 만다라 공양을 올리며, 자신이 가진 가장 귀한 것과 함께 초걜이 스승의 제자로 떠날 수 있게 했다.<\/p>\n<p>삼예 위쪽 침푸의 바위굴. 초걜은 스승 앞에 앉았다.<\/p>\n<p>\"저는 여자의 몸으로 태어났습니다. 사람들은 여자의 몸으로는 깨닫기 어렵다고 합니다.\"<\/p>\n<p>스승이 말했다.<\/p>\n<p>\"깨달음의 바탕에는 남자도 여자도 없다. 다만 깨닫겠다는 마음이 굳다면 여자의 몸이 오히려 낫다. 그대는 남들이 평생 겪을 괴로움을 열여섯에 다 겪었다. 그것이 그대의 밑천이다.\"<\/p>\n<p>초걜에게는 드문 재주가 있었다. 한 번 들은 것을 잊지 않는 것. 스승이 설한 모든 것을 그녀는 한 마디도 흘리지 않고 마음에 담았다. 그리고 그것을 다끼니의 비밀 글자로 누런 두루마리에 적었다.<\/p>\n<p>예셰 왕뽀가 된 쌜낭은 처음에 그녀를 경쟁자로 여겼다. 어느 날 그는 장부를 들고 초걜을 찾아갔다.<\/p>\n<p>\"스승께서 사흘 전 아침에 하신 말씀, 기억하시오? 나는 여기 적어 두었는데.\"<\/p>\n<p>\"사흘 전 아침이면, 해 뜨기 전에 하신 말씀이요, 해 뜬 뒤에 하신 말씀이요?\"<\/p>\n<p>\"…해 뜬 뒤.\"<\/p>\n<p>초걜은 스승의 말을 한 글자도 틀리지 않고 읊었다. 쌜낭은 장부와 대조해 보았다. 장부에 두 글자가 빠져 있었다.<\/p>\n<p>그날 저녁 쌜낭은 장부 첫 장에 이렇게 적었다. <em>이 장부보다 나은 장부가 있음. 이름: 초걜.<\/em><\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>어느 날 왕이 스승 앞에 엎드렸다.<\/p>\n<p>\"스승이시여, 이 땅에서도 이번 생에 성취를 얻는 사람이 나오게 해 주십시오. 비밀 진언의 성취법을 내려 주십시오.\"<\/p>\n<p>침푸의 바위굴 앞에 고요한 신과 사나운 신들의 만다라가 펼쳐졌다. 왕과 바이로짜나, 남카이 닝뽀, 눕첸 쌍계 예셰, 응앤람 걜촉 양, 독미 뺄기 예셰, 예셰 초걜, 낙남 도제 뒤좀. 왕과 신하 스물다섯이 한 줄로 앉았다.<\/p>\n<p>스승이 말했다.<\/p>\n<p>\"눈을 가리고 이 황금 꽃을 만다라에 던져라. 꽃이 떨어진 자리의 신이 너희의 신이다.\"<\/p>\n<p>첫 번째로 왕이 던졌다. 꽃이 만다라 한가운데에 떨어졌다. 사람들이 와 하고 소리를 질렀다.<\/p>\n<p>응앤람 걜촉 양이 던졌다. 꽃이 말머리를 한 신, 하야그리와 위에 떨어졌다.<\/p>\n<p>\"말머리라…\" 그는 꽃을 내려다보며 중얼거렸다. 그는 원래 조용한 역경사였다.<\/p>\n<p>초걜의 꽃은 금강궐에 떨어졌다. 스승이 양레쇠에서 가뭄을 끊었던 바로 그 법이었다.<\/p>\n<p>마지막으로 늙어 가는 무사, 도제 뒤좀이 던졌다. 그의 꽃도 금강궐에 떨어졌다.<\/p>\n<p>\"제가요?\" 그가 꽃을 들고 어리둥절했다. \"저는 글도 모르는데요.\"<\/p>\n<p>\"그대는 평생 칼을 들었다. 이제 <strong>제대로 된 칼<\/strong>을 들어라. 이 칼은 남을 베지 않고, 그대 안의 그 야차만 한 '나'를 벤다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>세월이 흘러 제자들에게 성취의 징표가 나타났다.<\/p>\n<p>왕은 원래 수명이 쉰여섯 해에 그칠 운명이었으나, 열세 해를 더 얻었다. 왕은 그 소식을 듣고 말했다. \"열세 해라. 옷을 열세 벌은 더 태울 수 있겠군.\" 그 농담에 웃은 사람은 스승 하나뿐이었다. 신하들은 웃어도 되는지 몰라서 서로 눈치만 보았다.<\/p>\n<p>남카이 닝뽀는 정오의 햇살을 타고 다녔다.<\/p>\n<p>눕첸 쌍계 예셰는 금강궐을 바위에 찔러 넣었다. 버터에 꽂듯 쑥 들어갔다. 그는 백오십 년을 살았다.<\/p>\n<p>독미 뺄기 예셰는 지혜의 다끼니를 보았다. 그 뒤로 업의 다끼니들이 그의 집에서 하녀처럼 시중을 들었다. 그의 집은 티벳에서 가장 깨끗했다. 이웃들은 \"저 집은 대체 누가 청소를 하는지 모르겠다\"며 수군거렸다.<\/p>\n<p>초걜은 죽은 이를 살려 냈다.<\/p>\n<p>응앤람 걜촉 양은 말머리 신을 닦다가 어느 날 갑자기 정수리에서 <strong>말 울음소리<\/strong>를 냈다.<\/p>\n<p>\"히이이잉—\"<\/p>\n<p>침푸 골짜기가 쩌렁쩌렁 울렸다. 근처에서 풀을 뜯던 말들이 일제히 고개를 들었다. 뚝심이가 귀를 쫑긋 세우더니 대답이라도 하듯 울었다.<\/p>\n<p>\"히힝.\"<\/p>\n<p>노르부는 바닥을 데굴데굴 굴렀다. 걜촉 양은 얼굴이 빨개졌다가, 이윽고 같이 웃었다. 스승이 말했다.<\/p>\n<p>\"웃어도 된다. 말머리 신은 원래 그 울음으로 마를 쫓는다. 웃음도 마를 쫓는다.\"<\/p>\n<p>그리고 도제 뒤좀은 — 한때 산을 벨 수 없어 칼을 도로 집어넣었던 그 사람은 — 바람처럼 빨리 걸었고, 바위벽을 <strong>통과해<\/strong> 지나갔다고 한다.<\/p>\n<p>처음 그 일이 일어났을 때 그는 침푸의 바위벽 앞에서 길이 막혀 투덜거리고 있었다. 돌아가기 귀찮아서 그냥 걸었다. 그리고 반대편으로 나왔다. 그는 뒤를 돌아보고, 바위를 만져 보고, 다시 한 번 지나가 보았다. 또 지나가졌다.<\/p>\n<p>그는 스승에게 달려갔다.<\/p>\n<p>\"스승님! 바위가… 바위가 저를 막지 않습니다!\"<\/p>\n<p>\"바위가 그대를 막은 적은 없다.\" 스승이 말했다. \"그대가 바위를 '막는 것'이라고 믿었을 뿐이다. 무짜메의 산을 기억하느냐? 그대가 오를수록 커지던 산.\"<\/p>\n<p>\"기억합니다.\"<\/p>\n<p>\"그 산이나 이 바위나 같다. 그대가 이기려 들면 커지고, 그대가 '나'를 내려놓으면 길이 된다.\"<\/p>\n<p>삼예 사람들은 그 이야기를 할 때마다 한마디씩 덧붙였다. \"그 양반이 그 덩치로.\"<\/p>\n<p>스승은 이 스물다섯 사람을 '왕과 신하 스물다섯'이라 불렀다.<\/p>", "chars": 2598}, {"id": "c24", "label": "제24장", "title": "삼예의 창고지기와 세 번째 황금", "epigraph": "나무 새를 탄 왕이 원숭이와 쥐를 거느리고 오니, 절의 창고에 문지기가 생기네. 그리고 왕은 또 의심하네.", "part": null, "html": "<p>어느 날 왕이 큰 잔치를 차리고 스승 앞에 엎드렸다.<\/p>\n<p>\"스승이시여, 오백 년 뒤 말세가 오면 저 같은 왕들에게는 복이 없을 것이고, 대신들은 다투고, 백성은 흩어질 것입니다. 그때 이 절을 지킬 수호신이 필요합니다. 누구를 삼아야 하겠습니까.\"<\/p>\n<p>스승이 말했다.<\/p>\n<p>\"재물을 지키는 왕, 뻬하르가 필요하오.\"<\/p>\n<p>\"뻬하르가 누굽니까?\"<\/p>\n<p>\"북쪽 바따 호르 땅의 명상원을 지키는 왕이오. '나무 새를 탄 이'라고도 하고, 검은 마왕 '쉐르'라고도 하지. 그 명상원이 무너지면, 그 절의 보물을 따라 이리로 올 것이오.\"<\/p>\n<p>왕은 고개를 갸웃했다. 북쪽 호르 땅의 명상원이 왜 무너진단 말인가.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>몇 해 뒤, 왕의 아들 무룹 짼뽀가 군사를 이끌고 북쪽 호르의 명상원을 쳤다. 그는 그곳의 보물을 싹 쓸어 담아 수레에 싣고 돌아왔다. 의기양양했다.<\/p>\n<p>그런데 그 수레를 무언가가 따라왔다.<\/p>\n<p>처음에는 아무도 몰랐다. 밤마다 군영의 말들이 이유 없이 울었다. 보초가 잠깐 졸고 나면 짐 꾸러미의 매듭이 바뀌어 있었다. 그러다 어느 날 밤, 왕자는 수레 위에 앉아 있는 것을 보았다.<\/p>\n<p>나무로 깎은 새를 탄 검은 왕이었다. 그 오른쪽에는 호랑이 가죽 갑옷을 입은 용사 백이 섰고, 왼쪽에는 머리를 깎은 아라한 백이 섰으며, 뒤에는 검은 옷의 떠돌이 승려 백이 따랐고, 그 둘레에서 춤꾼 사자 백이 춤을 추었다. 그리고 그 모든 행렬의 발치에서 원숭이와 쥐 오백 마리가 와글와글 짐을 나르고 있었다.<\/p>\n<p>왕자는 비명을 지르며 삼예로 말을 달렸다. 행렬도 따라왔다. 원숭이들은 왕자의 말 꼬리를 잡고 매달려 왔다.<\/p>\n<p>스승은 삼예 문 앞에서 그들을 기다리고 있었다.<\/p>\n<p>\"왔구나, 뻬하르.\"<\/p>\n<p>나무 새를 탄 왕이 스승 앞에 내려섰다. 그는 거칠었고, 화가 나 있었다.<\/p>\n<p>\"내 절을 털어 간 놈이 여기 있다. 나는 내 보물을 따라왔다.\"<\/p>\n<p>\"그 보물은 이제 이 절에 바쳐졌다. 보물이 여기 있으니 그대도 여기 있으면 된다. 그대가 지키던 것을, 이제 여기서 지켜라.\"<\/p>\n<p>뻬하르는 삼예를 둘러보았다. 수미산을 본뜬 큰법당, 네 대륙의 전각, 해와 달, 백여덟 탑, 짖는 구리 개 네 마리.<\/p>\n<p>\"…이 절이 내 옛 절보다 크군.\"<\/p>\n<p>\"창고도 더 크다.\"<\/p>\n<p>뻬하르는 오래 생각하더니 맹세했다. 스승은 그를 위해 '뻬까르 링'이라는 전각을 따로 세우고, 삼예와 모든 절의 창고지기로 삼았다. 원숭이와 쥐 오백 마리도 함께 눌러앉았다. 그 뒤로 삼예 창고에서는 곡식 한 톨 없어지는 일이 없었다. 쥐들이 지키니 다른 쥐가 얼씬도 못 했다.<\/p>\n<p>\"쥐가 쥐를 지킨다니.\" 노르부가 말했다.<\/p>\n<p>\"도둑을 막는 데는 도둑 출신이 제일이다.\" 대장장이가 말했다. \"나도 원래 길 막던 놈이었잖소.\"<\/p>\n<p>스승은 그날 그 자리에서 여덟 무리의 신과 귀신 모두에게 서약을 다시 묶었다. 영광의 검은 마하깔라, 영광의 검은 여신, 진언의 수호신 마가, 그리고 대장장이 도제 렉빠에게도 각자의 법을 정해 주었다. 대장장이는 자기 이름이 불리자 망치로 모루를 한 번 쳤다. 땅.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>스승은 그 법들을 왕에게 맡기며 일렀다.<\/p>\n<p>\"이 법은 보배처럼, 목숨처럼 지키시오. 이로움을 위해 전하면 으뜸이요, 자비로 전하면 중간이요, 재물을 받고 전하면 하급이오. 아무에게나 퍼뜨리면, 이 법의 주인들이 왕의 수명을 줄일 것이오.\"<\/p>\n<p>왕은 크게 기뻐했다. 그는 감사의 표시로 자신이 타던 말 여섯 필과 금 재갈, 터키석 굴레, 비단, 금가루, 터키석 한 되, 그리고 목에 걸고 다니던 가장 아끼는 터키석 목걸이 '빛 타오름'까지 풀어서 스승께 바쳤다.<\/p>\n<p>스승이 말했다.<\/p>\n<p>\"왕께서는 허깨비 같은 재물에 집착 없이 바치시니 놀랍소. 마음이 참 좋으시오.\"<\/p>\n<p>그 순간 왕의 마음에 생각 하나가 스쳤다.<\/p>\n<p><em>스승께서는 남쪽 네팔에서 오셨으니, 재물을 바치니 기뻐하시는구나. 성취를 얻으셨다면서 재물을 꽤 좋아하시네.<\/em><\/p>\n<p>노르부는 왕의 얼굴을 보았다. 그리고 쌜낭의 소매를 잡았다.<\/p>\n<p>\"어른, 지금 폐하 얼굴이…\"<\/p>\n<p>\"알아. 나도 봤다.\" 쌜낭이 장부를 펼쳤다. 이미 붓을 들고 있었다.<\/p>\n<p>스승이 왕을 보며 말했다.<\/p>\n<p>\"왕이여, 옷자락을 벌리시오.\"<\/p>\n<p>왕은 영문도 모르고 옷자락을 벌렸다. 스승이 모래와 자갈을 한 줌씩 쏟아부었다.<\/p>\n<p>\"하나 받으면 하나 쥐시오.\"<\/p>\n<p>왕은 받고 쥐고, 받고 쥐다가, 다 쥐지 못해 흘렸다. 바닥에 떨어진 모래는 금이 되어 있었다. 자갈은 터키석이 되어 있었다.<\/p>\n<p>스승이 말했다.<\/p>\n<p>\"그대의 장애를 씻고 복을 늘리려고 잠시 받았던 것이오. <strong>나에게는 나타나고 있는 모든 것이 본래 금이오.<\/strong> 나는 이제 금도 재물도 필요 없소. 왕께서 쓰시오.\"<\/p>\n<p>그리고 말과 목걸이를 모두 왕에게 돌려주었다.<\/p>\n<p>쌜낭이 장부에 적었다. <em>세 번째.<\/em> 그리고 그 아래 밑줄을 그었다.<\/p>\n<p>노르부가 속삭였다. \"어른, 폐하는 왜 매번 그러실까요? 궁탕 고개에서도, 비말라미뜨라 스승 때도, 이번에도.\"<\/p>\n<p>\"우리 폐하만 그러시겠니.\" 쌜낭이 장부를 덮었다. \"사람은 자기 마음에 있는 것을 남에게서 본단다. 재물을 아끼는 사람은 남도 재물을 아끼는 줄 알지. 폐하는 좋은 분이시다. 다만 왕이시라, 평생 재물로 사람을 움직여 오셨을 뿐이다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>왕은 그 자리에 몸을 던지고 울었다.<\/p>\n<p>\"큰스승이시여, 저는 변방의 야만 왕입니다. 장애가 커서 의심을 먹었습니다. 잘못했습니다. 저를 붙들어 주십시오. 깨진 약속을 메우는 법을 가르쳐 주십시오.\"<\/p>\n<p>스승이 왕을 일으켜 세웠다.<\/p>\n<p>\"왕은 몸을 가진 중생이니 마음에 분별이 일어나는 것이 당연하오. 그것으로 약속이 깨지지는 않소. 나는 요기이니 그 일로 불쾌하지도 않소.\"<\/p>\n<p>\"그래도…\"<\/p>\n<p>\"법의 원수는 의심이오. 의심은 생기오. 생기면 알아차리시오. 그리고 무엇을 하든 법에 따라 하시고, 죄짓는 대신들의 말에 휘둘리지 마시오. 그거면 되오.\"<\/p>\n<p>스승은 왕에게 금강살타의 백 글자 진언과 날마다 하는 참회법을 내려 주었다.<\/p>\n<p>그날 밤 왕은 시종에게 일렀다.<\/p>\n<p>\"앞으로 스승을 뵐 때는 세 번째로 아끼는 옷을 입겠다. 그리고 의심이 들면, 먼저 내 옷자락부터 벌려 보겠다.\"<\/p>", "chars": 2882}, {"id": "c25", "label": "제25장", "title": "호랑이 굴", "epigraph": "고요한 이가 사납게 나툴 때, 그 사나움은 자비의 다른 얼굴이네.", "part": null, "html": "<p>어느 겨울 스승은 초걜에게 말했다.<\/p>\n<p>\"먼 훗날을 보았다. 법이 쇠하는 때가 온다. 절은 무너지고 경전은 불타고, 사람들은 가르침의 이름만 알고 뜻은 잊을 것이다.\"<\/p>\n<p>\"막을 수 없습니까.\"<\/p>\n<p>\"세운 것은 무너진다. 그것은 막는 것이 아니다. 대신 씨앗을 묻는다. 겨울에 묻어 두면 봄에 싹이 튼다.\"<\/p>\n<p>두 사람은 길을 떠났다. 설산의 동굴에, 호수 바닥에, 바위 속에, 절의 기둥 속에, 초걜이 적은 누런 두루마리와 불상과 법구를 감추었다. 때로는 물건이 아니라 <strong>제자의 마음 깊은 곳<\/strong>에 가르침을 묻었다. 그 제자가 수백 년 뒤 다시 태어나 때가 되면 스스로 떠올리도록. 이것을 '뗄마', 감추어진 보배라 한다. 곳곳의 숨은 골짜기는 난리가 났을 때 사람들이 숨어 수행할 피난처로 봉해 두었다.<\/p>\n<p>감춘 것을 지킬 이가 필요했다. 그리고 남쪽 변방, 묀의 깊은 골짜기에는 아직 맹세하지 않은 사나운 것들이 남아 있었다.<\/p>\n<p>빠로 골짜기의 깎아지른 벼랑. 그곳의 귀신들은 고요한 말을 알아듣지 못했다. 스승은 그들이 알아듣는 모습으로 나투었다.<\/p>\n<p>검붉은 몸, 세 개의 부릅뜬 눈, 불꽃처럼 곤두선 머리칼. 오른손에 금강저, 왼손에 금강궐. 타고 있는 것은 새끼를 밴 암호랑이였다. 미친 듯 사나운 금강, <strong>도제 될뢰.<\/strong><\/p>\n<p>삼예에서 따라온 노르부 — 이제 서른이 된 — 는 벼랑 아래에서 그 모습을 보고 다리가 풀렸다.<\/p>\n<p>\"스승님이… 화가 나셨습니다.\"<\/p>\n<p>초걜이 고개를 저었다. \"잘 보세요. 저 눈을.\"<\/p>\n<p>노르부는 보았다. 불꽃 속의 세 눈은 타오르고 있었으나, 그 안에 미움은 한 점도 없었다. 그것은 불 속으로 달려드는 아이를 향해 <strong>고함치는 어머니<\/strong>의 눈이었다.<\/p>\n<p>\"화와 사나움은 다릅니다.\" 초걜이 말했다. \"화는 나를 지키려고 내는 것이고, 사나움은 남을 지키려고 내는 것입니다. 강까르 샤메의 벼락은 화였지요. 저것은 자비가 급할 때의 얼굴입니다.\"<\/p>\n<p>호랑이가 벼랑을 날아올랐다. 골짜기가 포효로 가득 찼다. 그날로 남쪽의 모든 사나운 것들이 맹세했다. 스승은 그 벼랑의 굴에서 오래 머물며 수행했다. 사람들은 그곳을 '딱창', 호랑이 굴이라 부른다. 스승이 이렇게 사나운 모습으로 나툰 벼랑이 열세 곳이었고, 그 열세 곳이 모두 딱창이라 불렸다고 한다. 지금 가장 이름난 곳은 부탄 빠로 골짜기의 벼랑으로, 거기에는 절 한 채가 제비집처럼 붙어 있다. 돌아오는 길에 노르부가 말했다.<\/p>\n<p>\"스승님. 열세 살 때 저는 귀신이 무서웠습니다. 이제는 다른 것이 무섭습니다.\"<\/p>\n<p>\"말해 보아라. 조건이었으니.\"<\/p>\n<p>\"스승님이 떠나실까 봐요. 뗄마를 묻으시는 걸 보니… 준비하시는 것 같아서.\"<\/p>\n<p>스승은 대답하지 않고 걸었다. 한참 뒤에 말했다.<\/p>\n<p>\"노르부. 카라 고개의 마을을 기억하느냐. 네가 수제비 그릇을 받지 않았던.\"<\/p>\n<p>\"예.\"<\/p>\n<p>\"그때 너는 알고 있었다. 그것을 잊지 마라.\"<\/p>", "chars": 1365}, {"id": "c26", "label": "제26장", "title": "마지막 귀신", "epigraph": "온 나라의 귀신을 꿇린 왕에게도, 꿇지 않는 것이 하나 남았네.", "part": {"label": "제5부", "title": "구리빛 산으로"}, "html": "<p>세월이 흘렀다. 침푸에서 얻은 열세 해도 거의 다 흘렀다. 삼예의 황금 지붕은 날마다 햇빛에 타올랐고, 번역원의 시렁에는 티벳 말로 옮긴 경전이 천장까지 쌓였다. 샨따락시따 노스승은 말의 발길질에 다쳐 세상을 떠났다. 떠나기 전 그는 훗날 법을 두고 다툼이 일어나거든 자기 제자 까말라실라를 인도에서 부르라고 일러두었고, 그 말은 그대로 이루어졌다.<\/p>\n<p>티쏭 데짼 왕도 늙었다.<\/p>\n<p>어느 밤 왕은 침푸의 굴로 스승을 찾아왔다. 시종도 없이 혼자였다.<\/p>\n<p>\"스승이시여. 저는 절을 세웠고, 경을 옮겼고, 승가를 일으켰습니다. 스승께서 길들이신 신들은 지금도 맹세를 지킵니다. 그런데 요즘 잠이 오지 않습니다.\"<\/p>\n<p>\"무엇이 그대를 깨우는가.\"<\/p>\n<p>\"죽는 것이 두렵습니다.\" 왕은 부끄러운 듯 웃었다. \"평생 법을 듣고도요. 제가 죽으면 이 모든 것이 어찌 될지. 아들들은 서로를 믿지 않고, 대신들은 제 눈이 감기기만 기다립니다. 제가 한 일이 다 흩어질 것 같습니다.\"<\/p>\n<p>\"흩어질 것이오.\"<\/p>\n<p>왕이 고개를 들었다.<\/p>\n<p>\"삼예도 언젠가 무너지오. 그대의 왕조도 끝나오. 내가 그대에게 거짓 위로를 하길 바라오?\"<\/p>\n<p>\"…아닙니다.\"<\/p>\n<p>\"대왕. 수르카르 숲에서 내가 그대의 옷을 태웠소. 기억하시오?\"<\/p>\n<p>\"잊을 수 있겠습니까. 비말라미뜨라 스승께 그을린 것까지 치면 한 벌 반입니다.\"<\/p>\n<p>스승이 소리 내어 웃었다. 그러고는 다시 진지해졌다.<\/p>\n<p>\"그때 탄 것은 겉옷 한 벌이었소. 그대는 그 뒤로 훌륭한 왕이 되었소. 그런데 이번에는 '법을 세운 훌륭한 왕'이라는 옷을 입었구려. 이 옷은 비단보다 벗기 어렵소. 좋은 옷이니까.\"<\/p>\n<p>왕은 오래 말이 없었다. 굴 밖에서 바람이 불었다.<\/p>\n<p>\"길에서 만난 것들을 그대도 들었을 것이오. 길을 막던 산 여신, 벼락을 던지던 여신, 모든 것을 삼키려던 야차. 그것들은 모두 밖에 있었소. 그러나 대왕, 내가 고개마다 한 일은 사실 하나요. 그들이 움켜쥔 '나'를 한 번 놓아 보게 한 것. 그 귀신은 티벳의 어느 설산보다 크고, 맹세시킬 수도 없소. <strong>그것은 꿇릴 것이 아니라 들여다볼 것이오.<\/strong> 들여다보면 없소.\"<\/p>\n<p>\"없다니요.\"<\/p>\n<p>\"지금 두려워하는 그 마음을 찾아보시오. 어디에 있소? 빛깔이 있소? 모양이 있소?\"<\/p>\n<p>왕은 눈을 감았다. 한참 뒤에 말했다.<\/p>\n<p>\"…찾을 수 없습니다. 그런데 찾을 수 없다는 것을 아는 무엇이, 환히 깨어 있습니다.\"<\/p>\n<p>\"그것이오.\" 스승의 목소리가 낮아졌다. \"그것은 태어난 적이 없으니 죽지도 않소. 그대가 왕이 되기 전에도 그것이었고, 왕관을 벗은 뒤에도 그것이오. 삼예는 무너져도 그것은 무너지지 않소. 그대가 세운 것 가운데 남는 것은, 사람들이 그것을 알아보도록 도운 일뿐이오. 그러니 편히 주무시오.\"<\/p>\n<p>왕은 그날 밤 굴에서 잤다. 여러 해 만에 깊은 잠이었다.<\/p>\n<p>얼마 뒤 왕은 세상을 떠났다. 그의 걱정대로였다. 큰아들은 왕위에 오른 지 얼마 못 가 독살되었고, 조정은 흔들렸다. 그러나 법은 이미 왕의 것이 아니었다. 고원의 천막마다, 골짜기의 동굴마다, 그것은 사람들의 것이 되어 있었다.<\/p>", "chars": 1467}, {"id": "c27", "label": "제27장", "title": "나는 인도로 간다", "epigraph": "티벳과 나는 맞지 않는다 노래하며, 쉰다섯 해 동안 못다 한 잔소리를 다 하고 가네.", "part": null, "html": "<p>왕이 세상을 떠나고 아들 무티 짼뽀가 뒤를 이었다. 그리고 얼마 뒤, 스승이 짐을 꾸린다는 소문이 돌았다.<\/p>\n<p>\"서남쪽 바다 건너 나찰들의 땅이 있다. 그들이 사람 사는 땅으로 넘어오려 한다. 내가 가서 길들이고 그 앞을 지켜야 한다.\"<\/p>\n<p>삼예에 사람들이 몰려들었다. 젊은 왕, 출가한 스님들, 진언사들, 대신들, 마을의 우두머리들, 여인들. 다들 엎드려 머물러 달라고 청했다.<\/p>\n<p>스승은 머물 뜻이 없어 보였다. 대신 노래를 불렀다. 그것은 이상한 노래였다.<\/p>\n<blockquote class=\"verse\"><p>나 빠드마 중내는<br>전생의 업이 이어져 티벳에 왔다.<br>티쏭 데짼은 세상을 떠났다.<br>나는 티벳에 머물지 않는다.<\/p><p>나라를 법으로 다스리지 않고<br>법 없는 대신들이 키를 잡으니<br>티벳의 왕들과 나는 맞지 않는다.<br>나는 인도로 간다.<\/p><p>계율을 깨끗이 지키지 않는<br>티벳의 스님들과 나는 맞지 않는다.<br>겉모양만 법인 이들에게 낙담한다.<br>나는 인도로 간다.<\/p><p>고요히 앉는 것만 닦고 일어나서는 잊는<br>티벳의 큰 명상가들과 나는 맞지 않는다.<br>나는 인도로 간다.<\/p><p>치우침 없이 베풀지 않는<br>시주들과 나는 맞지 않는다.<br>인색한 이들에게 낙담한다.<br>나는 인도로 간다.<\/p><p>믿음과 자비를 섞지 않고<br>입만 가볍게 놀리는 제자들과 나는 맞지 않는다.<br>나는 인도로 간다.<\/p><\/blockquote>\n<p>노래가 끝났다. 삼예 마당이 쥐 죽은 듯 조용했다. 대신들은 얼굴이 빨개졌고, 스님들은 고개를 숙였고, 시주들은 괜히 소매를 여몄다.<\/p>\n<p>노르부가 도제 뒤좀에게 속삭였다.<\/p>\n<p>\"…스승님 삐지셨나 봐요.\"<\/p>\n<p>\"쉰다섯 해 참으셨으면 삐질 만도 하지.\"<\/p>\n<p>그런데 스승의 노래에는 한 연이 더 있었다.<\/p>\n<blockquote class=\"verse\"><p>제 마음이 부처임을 깨달았으니,<br>누구와 맞든 맞지 않든<br>나는 인도로 간다.<\/p><\/blockquote>\n<p>노르부는 그 마지막 연을 듣고서야 알았다. 스승은 삐진 것이 아니었다. 맞지 않는다는 것을 다 말하고 나서, 맞든 맞지 않든 상관없다고 말한 것이었다. 그것은 화를 내는 노래가 아니라, 화를 내려놓는 노래였다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그러나 스승은 바로 떠나지 않았다. 그는 사람들을 무리별로 불러 앉혔다. 그리고 쉰다섯 해 동안 못다 한 말을 차례로 남겼다. 노르부는 나중에 그것을 '스승님의 마지막 잔소리'라고 불렀다. 물론 스승이 듣지 않는 데서만.<\/p>\n<p><strong>왕들에게<\/strong>는 이렇게 말했다.<\/p>\n<p>\"욕심 많고 아는 것 없는 대신은 나라의 성채에 가장 큰 위험이다. 믿을 수 없는 이에게 마음을 맡기지 마라. 나라에 해로운 의논은 들어주지 마라. 성내지 말고 사납게 굴지 말고, 고요히 길들여라. 나라가 쇠하면 왕도 쇠한다. 그리고 궁전이니 절이니 탑이니 하는 것도, 백성을 쥐어짜서 지으면 공덕이 아니라 죄가 된다.\"<\/p>\n<p>젊은 왕 무티 짼뽀가 진지하게 받아 적었다.<\/p>\n<p><strong>대신들에게<\/strong>는 대신을 네 종류로 나누어 말했다.<\/p>\n<p>\"법에 기대고 믿음이 크면 '법의 대신'이다. 의논에 밝고 지혜가 크면 '지혜의 대신'이다. 용맹하고 적을 방편으로 길들이면 '용맹의 대신'이다. 속은 엄하고 깊으되 말은 부드럽게 사람을 이끌면 '두려운 대신'이다. 너희는 어느 쪽이냐?\"<\/p>\n<p>대신들은 저마다 자기가 '지혜의 대신'이라고 생각했다. 스승은 그 얼굴들을 보고 웃었다.<\/p>\n<p>\"그리고 무엇이든, <strong>생각한 뒤에 해라.<\/strong>\"<\/p>\n<p><strong>스님들에게<\/strong>는 이렇게 말했다.<\/p>\n<p>\"출가는 윤회를 버리는 일이다. 버렸으면 다시 줍지 마라. 겉모양만 법인 비구는 내생에 지옥에 간다. 가사가 사람을 지옥에서 꺼내 주지 않는다.\"<\/p>\n<p><strong>가르치는 이들에게<\/strong>는 이렇게 말했다.<\/p>\n<p>\"남을 길들이기 전에 제 마음부터 길들여라. 이름이 나도 아만과 질투는 버려라. 제자가 많아지는 것보다 제 허물이 줄어드는 것이 먼저다.\"<\/p>\n<p><strong>요기들에게<\/strong>는 '빠지지 말라'를 열두 번 되풀이했다.<\/p>\n<p>\"견해에는 치우침이 없으니 편견에 빠지지 말라. 수행에는 정해진 모양이 없으니 모양에 빠지지 말라. 옷에는 정해진 것이 없으니 옷에 빠지지 말라. 고향에는 정해진 곳이 없으니 고향에 빠지지 말라…\"<\/p>\n<p>노르부는 손가락을 꼽으며 세다가 아홉에서 놓쳤다.<\/p>\n<p><strong>일반 사람들에게<\/strong> 한 말은 노르부가 가장 오래 기억했다.<\/p>\n<p>\"무슨 일이든 생각하며 행하라. 생각 없이 하면 허물이 생긴다. 고칠 수 있는 일이라면, 그것 때문에 속상해할 필요가 없다. 고칠 수 없는 일이라면, 속상해한들 무슨 이로움이 있겠느냐.\"<\/p>\n<p>마당 여기저기서 사람들이 고개를 끄덕였다. 스승이 덧붙였다.<\/p>\n<p>\"천천히 가도 어디든 닿는다. 부드럽게 말하면 모두가 알아듣는다. 오래 끈기 있게 하면 무엇이든 이루어진다.\"<\/p>\n<p><strong>여인들에게<\/strong>는 이렇게 말했다.<\/p>\n<p>\"집안의 안주인이니 집안을 일으켜라. 시부모를 친부모처럼 모시고, 자식을 법에 들여라. 수다는 줄여라. 저녁에는 늦게 눕고 아침에는 일찍 일어나라. 농사철을 놓치지 마라. 그리고 가축과 집 지키는 개와 눈먼 이에게 자비를 베풀어라.\"<\/p>\n<p>앞줄에 앉은 할머니 하나가 손을 들었다.<\/p>\n<p>\"스승님, 늦게 자고 일찍 일어나라는 건 남자들한테도 해 주십시오.\"<\/p>\n<p>마당에 웃음이 터졌다. 스승도 웃었다.<\/p>\n<p>\"옳다. 남자들도 들었느냐.\"<\/p>\n<p>남자들은 못 들은 척했다.<\/p>\n<p><strong>의사와 환자들에게<\/strong>는 이렇게 말했다.<\/p>\n<p>\"의사는 처음과 중간과 끝을 다 배우고, 자비와 욕심 없음으로 고쳐라. 환자는 목숨을 구해 준 의사에게 보답하라. 낫고 나서 모른 척하지 마라.\"<\/p>\n<p><strong>스승과 제자들에게<\/strong>는 이렇게 말했다.<\/p>\n<p>\"스승은 배움과 닦음과 약속과 전승을 갖추어야 한다. 제자는 스승을 구할 때 먼저 그 표징을 살펴라. 아무나 따라가지 마라. 어느 한쪽이라도 살피지 않으면, 법에 가피가 없다.\"<\/p>\n<p>도제 뒤좀이 손을 들었다.<\/p>\n<p>\"스승님, 저는 스승님을 살피지 않고 따라왔는데요. 궁탕 고개에서 옷 벗은 거 말고는.\"<\/p>\n<p>\"그대는 운이 좋았다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>마지막으로 스승은 <strong>티벳 백성 전체<\/strong>를 향해 섰다.<\/p>\n<p>\"너희가 어디서 왔는지 아느냐.\"<\/p>\n<p>사람들이 서로 쳐다보았다.<\/p>\n<p>\"옛적 이 땅은 짐승의 나라였다. 관세음보살이 원숭이 한 마리를 보내 이 땅에서 수행하게 했다. 그런데 바위산의 나찰녀가 그 원숭이를 사모해서 같이 살자고 졸랐다. 원숭이는 계를 지키려 했으나, 나찰녀가 울며 말했다. '당신이 나와 살지 않으면 나는 나찰과 짝을 지어 수많은 나찰을 낳을 것이고, 그들이 온 땅의 생명을 잡아먹을 것이다.' 원숭이는 자비로 그녀와 짝을 지었다. 그 자식들이 불어나 너희가 되었다.\"<\/p>\n<p>사람들이 웅성거렸다.<\/p>\n<p>\"그래서 너희는 아버지를 닮아 자비롭고 참을성이 있고, 어머니를 닮아 고집이 세고 성미가 급하고 고기를 좋아한다.\"<\/p>\n<p>마당에서 큰 웃음이 터졌다. 도제 뒤좀이 자기 배를 내려다보았다. 스승이 왕을 처음 만났을 때 '붉은 얼굴의 나찰들의 주인'이라 부른 까닭을, 사람들은 그제야 알았다.<\/p>\n<p>\"그 원숭이가 관세음의 화신이었다. 그러니 이 땅은 처음부터 관세음의 몫이다. 내가 떠나도 너희에게는 관세음이 있다. '옴 마니 반메 훔'. 이 여섯 글자를 외워라. 하루 백여덟 번 외우면 나쁜 길에 떨어지지 않는다. 믿음으로 부르면 가피는 곧바로 온다.\"<\/p>\n<p>젊은 왕이 물었다. \"스승이시여, 어두운 시대가 온다 하셨습니다. 그때 저희는 어찌합니까.\"<\/p>\n<p>\"사람들은 제 손으로 나쁜 짓을 해 놓고 시대가 나쁘다고 말한다.\" 스승이 대답했다. \"시대는 변하지 않는다. <strong>변하는 것은 사람이다.<\/strong>\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>그날 밤 노르부는 마당에 홀로 앉아 있었다. 스승이 다가와 옆에 앉았다.<\/p>\n<p>\"오늘 잔소리 많이 하셨습니다.\"<\/p>\n<p>\"들었느냐.\"<\/p>\n<p>\"다 들었습니다. 그런데 스승님, 저한테는 아무 말씀 안 하셨잖아요.\"<\/p>\n<p>스승이 노르부를 보았다.<\/p>\n<p>\"너한테 할 말은 쉰 해 전에 이미 했다.\"<\/p>\n<p>\"…무서울 때마다 말하라는 거요?\"<\/p>\n<p>\"그래.\"<\/p>\n<p>노르부는 주머니 속 벼락 콩 세 알을 만지작거렸다.<\/p>\n<p>\"스승님. 지금 무섭습니다. 스승님이 가실까 봐요.\"<\/p>\n<p>\"잘 말했다.\" 스승이 말했다. \"그것이 쉰 해 동안 네가 지킨 약속이다. 저 무사 양반은 결국 못 지켰지만.\"<\/p>\n<p>멀리서 도제 뒤좀이 코를 고는 소리가 들렸다.<\/p>", "chars": 3701}, {"id": "c28", "label": "제28장", "title": "나를 따르라 — 궁탕 고개의 작별", "epigraph": "떠나는 이는 햇살을 타고, 남는 이는 약속을 품네.", "part": null, "html": "<p>행렬은 망율의 궁탕 고개까지 따라갔다. 오래전 다섯 사신이 금가루를 들고 스승을 처음 만난 바로 그 고개였다. 속옷 바람으로 덜덜 떨며 몸과 말과 마음을 바치겠다던 바로 그 자리.<\/p>\n<p>예셰 왕뽀가 된 쌜낭은 이미 세상에 없었다. 그가 남긴 장부는 삼예 번역원의 시렁에 꽂혀 있었다. 마지막 장에는 이렇게 적혀 있었다. <em>결산: 잃은 것 많음. 얻은 것 셀 수 없음. 남는 장사.<\/em><\/p>\n<p>도제 뒤좀은 백발이 되어 지팡이를 짚고 있었다. 바위를 지나다니는 사람치고는 걸음이 느렸다. \"바위는 지나가는데 계단은 숨차.\" 그가 말했다.<\/p>\n<p>그리고 한때 열세 살이었던 야크 목동은, 주름진 얼굴의 늙은 승려가 되어 맨 앞줄에 서 있었다. 뚝심이는 오래전에 죽었지만, 노르부는 지금도 고집 센 노새만 보면 그 이름으로 불렀다.<\/p>\n<p>제자들이 스승께 엎드렸다. 울음이 그치지 않았다. 스승은 그들을 내려다보다 노래로 말했다.<\/p>\n<blockquote class=\"verse\"><p>들으라, 티벳의 왕과 신하들이여.<br>하늘 높이 나는 독수리도<br>먹이를 탐내 내려앉다가<br>덫에 걸리는 줄을 모른다.<br>물에서 노니는 물고기도<br>먹이를 탐내 머물다가<br>그물에 걸리는 줄을 모른다.<br>제 마음이 본래 부처인데<br>탐하는 힘으로 밖에서 구하니<br>윤회를 떠도는 줄을 모른다.<\/p><\/blockquote>\n<p>그리고 스승은 한 연씩, 손가락을 하나씩 접으며 노래했다.<\/p>\n<blockquote class=\"verse\"><p>사람 많은 소란에 휩쓸릴 때,<br>나에게는 한적한 곳의 가르침이 있다.<br>벗과 자식과 친척에 매이지 않으려거든 <strong>나를 따르라.<\/strong><\/p><p>미운 원수를 만날 때,<br>나에게는 묵은 빚을 갚는다 여기고 참는 가르침이 있다.<br>성냄에 매이지 않으려거든 <strong>나를 따르라.<\/strong><\/p><p>남들의 뒷말이 들릴 때,<br>나에게는 메아리의 가르침이 있다.<br>사람들의 말에 매이지 않으려거든 <strong>나를 따르라.<\/strong><\/p><p>명상이 가라앉고 들뜰 때,<br>나에게는 가라앉음도 어둠도 그대로 법신이라는 가르침이 있다.<br>명상하려거든 <strong>나를 따르라.<\/strong><\/p><p>몸에 병이 들 때, 죽음이 닥칠 때,<br>몸과 앎이 갈라서는 그 길목에서,<br>나에게는 앎은 기댈 데가 없다는 가르침이 있다.<br>죽음이 두렵거든 <strong>나를 따르라.<\/strong><\/p><\/blockquote>\n<p>노래가 끝나자 젊은 왕이 울며 말했다.<\/p>\n<p>\"스승이시여, 따르라 하시면서 떠나십니다. 어떻게 따릅니까.\"<\/p>\n<p>스승이 말했다.<\/p>\n<p>\"믿음이 가슴에서 일어나지 않으면 확신이 생기지 않는다. 확신이 없으면 가르침을 만나도 만난 것이 아니다. 가르침을 만나지 못하면 제 마음이 부처인 줄 모른다. 그러니 믿음과 공경으로, 가르침을 몸소 겪어 익혀라. <strong>그것이 나를 따르는 것이다.<\/strong> 나는 나고 죽음 두 끝에서 풀려났으니, 가고 오는 것이 내게는 없다.\"<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>마지막 날 새벽, 초걜이 스승 앞에 엎드렸다. 평생 울지 않던 사람이 울고 있었다.<\/p>\n<p>\"스승이시여. 스승이 계실 때 티벳은 낮이었습니다. 가시면 밤입니다. 저는 누구에게 묻고 누구에게 기댑니까.\"<\/p>\n<p>스승은 초걜의 머리에 손을 얹었다.<\/p>\n<p>\"초걜. 나는 아침마다 저녁마다 티벳을 위해 온다. 믿음 있는 이의 문간에 빼마 중내가 누워 있다. 내 몸에는 죽음도 태어남도 없다. 달이 돌아올 때마다, 그 가운데서도 원숭이달 초열흘에, 나는 이 땅 사람들의 괴로움을 걷으러 온다. 잊지 말고 불러라. 이것은 맹세다.\"<\/p>\n<p>\"귀신들에게 받으시던 그 맹세 말입니까.\" 노르부가 울면서 웃었다.<\/p>\n<p>\"그렇다. 나도 맹세에 묶인 이다. 대장장이에게 물어보아라. 맹세는 쇠보다 단단하다고 하지 않더냐.\"<\/p>\n<p>고갯마루 어딘가에서 땅, 하고 망치 소리가 한 번 울렸다.<\/p>\n<p>도제 뒤좀이 지팡이를 짚고 앞으로 나왔다.<\/p>\n<p>\"스승님. 마지막으로 하나만 여쭙겠습니다. 제 안의 그 야차, 이제 좀 쭈그러들었습니까?\"<\/p>\n<p>스승이 무사를 위아래로 훑어보았다.<\/p>\n<p>\"일곱 살짜리만 하다.\"<\/p>\n<p>\"…볼은 빨갛습니까?\"<\/p>\n<p>\"아주 빨갛다.\"<\/p>\n<p>늙은 무사가 껄껄 웃었다. 그는 웃다가 울었다.<\/p>\n<div class=\"ornament\" aria-hidden=\"true\">❋<\/div>\n<p>해가 떠올랐다. 첫 햇살이 고개를 넘어 스승의 발치에 닿았다. 허공에서 오색 구름과 함께 다끼니들이 내려왔다. 그들이 이끄는 것은 빼어난 말 한 필이었다.<\/p>\n<p>스승은 말에 올랐다. 그리고 마지막으로 돌아보았다.<\/p>\n<p>고개 아래로 눈의 나라가 펼쳐져 있었다. 길을 막던 무짜메의 봉우리, 끓었던 뺄모 호수, 열두 자매의 설산, 흰 야크의 고개, 맛없는 빵을 대접받은 남싸 골짜기. 고갯마루마다 돌무더기가 쌓여 있었고, 오색 깃발이 바람에 경을 읽고 있었다.<\/p>\n<p>\"노르부.\"<\/p>\n<p>\"예, 스승님.\"<\/p>\n<p>\"지금도 무서우냐?\"<\/p>\n<p>늙은 승려는 눈물을 닦았다. 그리고 한참 제 마음을 들여다보았다. 쉰 해 전 스승이 가르쳐 준 대로.<\/p>\n<p>\"…찾아보니 없습니다.\"<\/p>\n<p>스승이 환하게 웃었다. 그 웃음은 다나꼬샤 호수의 연꽃 위에서 여덟 살 아이가 처음 낯선 배를 보고 지었던 것과 같았다.<\/p>\n<p>다끼니들이 네 발굽을 받쳐 들자 말이 햇살을 밟고 떠올랐다. 스승은 남서쪽 하늘 끝에서 한 번 뒤를 돌아보았다. 사람들은 그 모습이 까마귀만 해지고, 파리만 해지고, 겨자씨만 해져서 서남쪽 하늘로 사라질 때까지 서 있었다.<\/p>\n<p>노르부는 주머니에서 벼락 콩 세 알을 꺼냈다. 쉰 해 동안 한 번도 꺼내 본 적이 없었다. 무서운 일은 많았지만, 그때마다 말로 했으니까.<\/p>\n<p>그는 고갯마루의 어린 사미 하나를 불러, 콩 세 알을 손에 쥐여 주었다.<\/p>\n<p>\"간직해라. 무서운 일이 생기면 꺼내 보아라.\"<\/p>\n<p>\"이게 뭔데요?\"<\/p>\n<p>\"벼락이다.\"<\/p>\n<p>아이는 콩을 내려다보고, 노르부를 올려다보고, 다시 콩을 내려다보았다.<\/p>\n<p>\"…마른 콩인데요.\"<\/p>\n<p>\"그래. 겁을 빼고 보면 그 정도다.\"<\/p>", "chars": 2534}, {"id": "c29", "label": "종장", "title": "달마다 초열흘", "epigraph": null, "part": null, "html": "<p>스승은 나찰의 섬에 내려 나찰왕을 길들이고, 구리빛 상서로운 산 — 상독 뺄리 — 꼭대기의 연꽃빛 궁전에 지금도 머문다고 한다.<\/p>\n<p>초걜은 그 뒤로도 오래 티벳에 남아 스승의 가르침을 마저 감추고 제자를 길렀다.<\/p>\n<p>스승의 예언대로 겨울이 왔다. 몇 대 뒤의 왕은 법을 미워하여 절의 문을 걸어 잠갔고, 제국은 조각났다. 삼예의 번역원에는 먼지가 쌓였다.<\/p>\n<p>그러나 씨앗은 묻혀 있었다.<\/p>\n<p>백 년이 지나고, 이백 년이 지났다. 어느 목동이 꿈을 꾸고 바위틈에서 누런 두루마리를 꺼냈다. 어느 수행자가 호수 바닥에서 등불이 꺼지지 않은 채로 궤짝을 건져 올렸다. 어느 아이가 배운 적 없는 가르침을 줄줄 읊었다. 감추어진 보배가 때를 맞추어 돌아오고 있었다. 그것을 찾아낸 이들을 '뗄뙨'이라 부른다.<\/p>\n<p>그리고 지금도 —<\/p>\n<p>달이 차오르는 초열흘 저녁이면, 히말라야의 골짜기마다 버터 등불이 켜진다. 부탄의 벼랑 절에서, 네팔의 바위굴에서, 인도의 연꽃 호숫가에서, 그리고 고원을 떠나 세계 곳곳에 흩어진 이들의 작은 방에서. 사람들은 보릿가루와 버터를 태우고, 일곱 줄의 기도를 올린다.<\/p>\n<blockquote class=\"verse\"><p>훔!<br>우디야나 땅의 서북쪽 끝<br>연꽃의 꽃술 줄기 위에서<br>놀랍고 으뜸가는 성취를 얻으신 분<br>연꽃에서 나신 이로 이름 높으시고<br>수많은 다끼니에 둘러싸이신 분<br>저희도 당신을 따라 닦겠사오니<br>가피를 내리시러 부디 오소서.<br>구루 빼마 싯디 훔.<\/p><\/blockquote>\n<p>오는지 안 오는지는 눈으로 볼 수 없다.<\/p>\n<p>다만 그 기도를 올리는 사람은, 그 순간만큼은 제 안의 다섯 독을 내려놓고, 움켜쥔 손을 편다. 무서운 것을 똑바로 보고, 배고픈 이에게 제 것을 내어 주고, 제 마음을 들여다본다.<\/p>\n<p>스승이 고개마다 귀신들에게 시켰던 바로 그 일을.<\/p>\n<p>그렇다면 그는 온 것이다.<\/p>\n<p><strong>— 끝 —<\/strong><\/p>", "chars": 840}, {"id": "a1", "label": "부록", "title": "장별 출처와 각색", "epigraph": null, "part": {"label": "부록", "title": "책 뒤에"}, "html": "<p>이 소설의 \"사실\"은 두 층위입니다.<\/p>\n<ul><li><strong>역사<\/strong>: 사료로 확인되는 것 (티쏭 데짼 왕, 샨따락시따, 삼예 사원 건립, 번역 사업, 반불교파 대신들)<\/li><li><strong>전승<\/strong>: 티벳 전기 문헌이 전하는 내용. 이번 개정에서는 다음 문헌과 대조했습니다.<\/li><li><strong>상링마<\/strong>: 냥랠 니마 외셀 발굴, 41장. 2026-11-18자 한국어 번역본(BDRC W4CZ20868 필사본, W1KG13828 스피티본 대조)을 기준으로 삼았습니다. 아래 표의 \"상링마 N장\"은 이 번역본의 장 번호입니다.<\/li><li><strong>빼마 까탕<\/strong>: 오걘 링빠 발굴. 본문은 열람하지 못했고, 잠양 켄쩨 왕뽀의 장별 요약 게송(《우담바라 꽃타래》)과 오걘 링빠 본인의 축약본으로 대조했습니다.<\/li><li><strong>여의수<\/strong>: 촉규르 링빠 발굴, 열 장.<\/li><li><strong>꽁뚤 전기<\/strong>: 잠괸 꽁뚤, 《빠드마까라의 생애와 해탈》.<\/li><\/ul>\n<p>상링마 번역본에서 <strong>[불확실]·[판독불가]로 표시된 대목<\/strong>을 소설에 쓴 경우는 아래 표에 따로 적었습니다.<\/p>\n<h3>장별 대조표<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>장<\/th><th>전승을 따른 부분<\/th><th>출처<\/th><th>각색·창작<\/th><\/tr><\/thead><tbody><tr><td>서장<\/td><td>왕이 스물한 살 호랑이해에 터를 다짐, 흙에서 흰 쌀과 단것이 솟음, 낮에 쌓으면 밤에 허묾, 보디사뜨와의 \"길들여질지 모르겠다\", 왕의 사흘 밤 꿈, 사신 바 쌜낭·쎙고 랄룽<\/td><td>상링마 7~8장<\/td><td>마르뽀리 벼락·팡탕 홍수는 《바세》 계통. 사신에 낙남 도제 뒤좀을 넣은 것은 꽁뚤·여의수(사신단 대표). 신하들이 서로 안 가려는 장면, 쌜낭의 장부는 창작<\/td><\/tr><tr><td>1<\/td><td>108 왕비, 창고 고갈, 거지들의 \"주지 않으면 전에 준 것도 헛것\", 선장과 닻돌, 은·유리·금의 산, \"여덟 천녀에게 말 걸지 말라\", 옷자락에 싸기, \"많이 가지면 배가 가라앉으니 족함을 알라\", 연꽃 위 소년의 문답, 칠보 보좌, 음식·옷·재물의 비<\/td><td>상링마 1장<\/td><td>\"칠 년째 이야기 중인 선원\", 쥐 이야기는 창작<\/td><\/tr><tr><td>2<\/td><td>알몸에 뼈 장신구, 카땀가 춤, 대신 아들의 죽음, 말뚝형 청원, 왕의 \"비인의 아들인지 화신인지 모른다\", 왕과 왕자의 시, 첫 숟가락을 아버지께<\/td><td>상링마 2장(스피티본 포함)<\/td><td>엿장수는 창작. 대신 이름 '까마다'는 원문이 불확실함<\/td><\/tr><tr><td>3<\/td><td>시신마다 천 한 필과 쌀 한 짐, 그것으로 풍족히 지냄, 기근 뒤 시신을 먹음, '나찰' 이름, 다끼니들의 관정, 비밀 이름 도르제 닥뽀 쩰<\/td><td>상링마 2장<\/td><td>귀신과의 대화는 창작<\/td><\/tr><tr><td>4<\/td><td>스승 없는 신통이라 마라로 의심받음, 쁘라바하스띠에게 출가(샤꺄 쎙게), 한 번 듣고 알았으나 열여덟 번 들음, 하녀 꾸꾸마의 물동이와 수정 칼, 평화존 42·분노존 58, 훔 글자로 삼킴, 여러 스승, 로댄 촉쎄<\/td><td>상링마 3장(스피티본)<\/td><td>하녀·스승과의 대사는 창작. 쉬리 씽하의 하늘·구름 문답은 창작(족첸 가르침을 풀어 씀)<\/td><\/tr><tr><td>5<\/td><td>만다라와(열여섯), 마라띠까 석 달, 무량광불과 감로 병, 자호르 화형(장작 한 짐·참기름 한 되씩, 아흐레, 불이 왕궁으로 번짐), 이름 빠드마 중내·빠드마 삼바와, 우겐에서 두 번째 화형(스무하루), 부왕의 깨달음, 빠드마 퇴텡·빠드마 갤뽀, 13년, 외도 오백과 벼락, 쎙게 다독<\/td><td>상링마 4장<\/td><td>대신 까마다의 화해는 창작. 화형 순서(마라띠까가 먼저)는 상링마·꽁뚤과 일치하도록 초고에서 고침<\/td><\/tr><tr><td>6<\/td><td>샤꺄데비, 세 장애(용·야차·허공의 나찰), 3년 가뭄, 네팔 사람 둘이 금가루를 들고 감, 쁘라바하스띠의 금강궐 경전 두 짐, 닿자마자 비, \"양닥은 상인, 금강궐은 호위\", 저녁·한밤·새벽에 맹세한 수호신들, 호법신들의 재촉과 석 달 대기<\/td><td>상링마 5·8장, 꽁뚤<\/td><td>짐꾼 대사는 창작<\/td><\/tr><tr><td>7<\/td><td>석 달 기다림, \"더 바칠 것이 있느냐\", 사신들이 옷까지 벗어 바침, 몸·말·마음을 종으로 바침, 산이 좌우로 바뀌고 땅이 황금·터키석으로, \"보이는 모든 것이 황금\", \"티벳의 금은 망율과 네팔로 간다\", 황금이 진짜인지 살핌<\/td><td>상링마 8장(옷은 스피티본)<\/td><td>노르부·뚝심이는 창작 인물. 쎙고 랄룽이 먼저 돌아가는 것은 창작<\/td><\/tr><tr><td>8<\/td><td>망율 퇴카르, 장중의 전쟁 여신 무짜메가 두 산으로 둔갑해 스승과 일행을 갈라놓음, 지팡이를 바위에 던지고 바위를 찬탄하며 올라섬, 목숨의 정수, 이름 '…유덴마'<\/td><td>상링마 9장<\/td><td>도제 뒤좀이 오를수록 커지는 산은 창작. 바위를 찬탄하는 대목은 원문이 [불확실]<\/td><\/tr><tr><td>9<\/td><td>남탕 네마르, 하늘 약녀 카르모의 벼락, 왼손바닥의 호수, 벼락이 <strong>마른 콩알<\/strong>이 됨, 뺄모 뺄초 호수로 도망, 호수를 불더미로 관해 끓임, 살과 뼈가 떨어짐, 금강저로 오른눈, 이름 강까르 샤메 도르제 쩬찍마<\/td><td>상링마 9장<\/td><td>\"손바닥의 호수\"는 원문이 [불확실]. 벼락 콩을 노르부가 평생 간직하는 것, 열두 살 소녀 이야기는 창작<\/td><\/tr><tr><td>10<\/td><td>땐마들이 수미산까지 산으로 길을 막음, 주먹으로 산을 던져 치움, 처소를 허묾, 열두 땐마의 맹세와 비밀 이름<\/td><td>상링마 9장(스피티본), 여의수(카라 고개), 꽁뚤<\/td><td>환영의 마을 전체는 창작(서유기 23회 오마주)<\/td><\/tr><tr><td>11<\/td><td>오육에서 도제 렉빠를 묶음<\/td><td>여의수 4장<\/td><td>망치 내기, 삼백예순 형제, 대장장이의 합류는 창작<\/td><\/tr><tr><td>12<\/td><td>—<\/td><td>—<\/td><td>장 전체 창작. 쑤르 공양·회향·보리심을 담기 위한 에피소드<\/td><\/tr><tr><td>13<\/td><td>샹부룽, 산을 거꾸로 세운 만 한 흰 야크, 안개·구름·눈·우박, 갈고리·올가미·사슬·요령의 수인, 흰 비단 머리채의 소년<\/td><td>상링마 9장<\/td><td>제자리를 도는 눈보라와 호흡 관찰은 창작<\/td><\/tr><tr><td>14<\/td><td>탕라가 큰 야차로 변해 일행을 잡아먹으려 함, 위협하는 손가락, 터키석 상투의 아이, \"이 자에게서 한 끼 얻어먹자\", 남싸 골짜기에서 <strong>아무 맛 없는 납작빵<\/strong>과 음식을 차려 옴, 메퇴카르·건달바왕 등 이름, 펜율의 세 여신과 폭풍, <strong>스승도 추위를 느낌<\/strong>, 설산을 불더미로 관해 버터처럼 녹임<\/td><td>상링마 9장<\/td><td>맛에 관한 문답, 재채기, \"일곱 살짜리 '나'\"는 창작. 탕라가 마르뽀리에 벼락을 던졌다는 것은 다른 전승에 기댐<\/td><\/tr><tr><td>15<\/td><td>퇴룽의 게녠 스물한 신, 바위를 쳐서 '신의 물'을 냄, 바위산마다 하룻밤씩 머물며 짼·마·왕신을 묶음<\/td><td>상링마 9장(스피티본), 여의수 4장<\/td><td>딱다 루콩의 저주는 창작. 딱다 루콩은 실존 대신<\/td><\/tr><tr><td>16<\/td><td>왕과 스승이 서로 상대가 절하기를 기다림, 왕의 \"검은 머리와 갈기 짐승의 주인\", 스승의 노래(죽음 없는·왕·글 쓰는 이·그림 그리는 이·의사·용사 빠드마 중내), \"왕 자신이 아니라 왕의 옷에 절한다\", 손짓의 빛에 옷이 탐, 황금 자리·비단 외투, 왕의 청<\/td><td>상링마 10장, 꽁뚤, 우담바라 꽃타래 61장<\/td><td>만남 장소는 빼마 까탕(수르카르)과 상링마(하스뽀리)를 합침. 쌜낭의 장부, \"두 번째로 아끼는 옷\"은 창작<\/td><\/tr><tr><td>17<\/td><td>말드로 용왕 의례, 하스뽀리의 물 또르마와 노래, 마첸이 오지 않아 쇠갈고리 수인으로 끌어옴, 한 발은 길가·한 발은 하스뽀리, 모자 쓴 대신 모습, \"<strong>꼬마 중(밴충)<\/strong>\", \"입맛을 가려 마른 것을 좋아한다\", 다섯 보배 가루<\/td><td>상링마 10장(스피티본 포함)<\/td><td>노르부와 도제 뒤좀의 대사는 창작. 마첸의 자기소개 일부는 원문이 [불확실]<\/td><\/tr><tr><td>18<\/td><td>수미산 구조, 구리 개, 삼층의 세 나라 법식, 허공의 금강무와 그림자, 낮에는 사람·밤에는 신, 사천왕 감독, 밤에 쌓은 것이 더 높음, 석공 하샹 마하야나·호르, 목수 랑쩨·바수, 나무가 없음, 흰 말 탄 흰 사람(용)의 시주 조건, 왕의 맹세, 선정을 풂, 몸·말은 묶였으나 마음은 안 묶인 용, 말세의 용 예언, 목재가 햇살을 타고 날아옴<\/td><td>상링마 11장(스피티본), 우담바라 꽃타래 62장, 여의수 5장<\/td><td>석공의 숯 메모는 창작<\/td><\/tr><tr><td>19<\/td><td>호랑이해 착공·말해 완공·양해 낙성, 비로자나상이 떠오름, 신들이 밖으로 나옴, 왕의 걱정, <strong>스승이 숨을 들이쉬어 다 빨아들임<\/strong>, 구리 개가 세 번씩 짖음, 담이 단숨에 솟음, 두 스승의 귀국 의사, 마구따의 세 형제와 닭 치는 어머니, 자룽 카쇼르 탑, 전생에 스승이 <strong>벌레<\/strong>였음, 세 서원, 왕의 눈물과 금가루, \"왕의 체면을 깎지 않겠다\"<\/td><td>상링마 11·12·15장<\/td><td>\"벌레\"(원문 'pra ma srin bu')는 번역본이 [불확실]로 표시. 노르부의 소원은 창작<\/td><\/tr><tr><td>20<\/td><td>다섯 비구, 훔까라와 아홉 겹 방, 랑 뺄기 쎙게의 의심과 죽음(검은 뱀이 새끼손가락을), 대신들의 추방, 남카이 닝뽀의 귀환과 가슴의 42존, 다시 추방, 카르추의 징표, 왕의 병, <strong>흰·갈색·검은 여인의 따귀<\/strong>로 세 약속을 메움, 해 지기 전에 왕의 머리를 감기라는 명령, <strong>금강궐로 해를 멈춤<\/strong>, \"가축을 거두어라\", 대신들의 습격과 \"훔 훔 훔\", \"쇠벼락보다 비구의 훔이 더 무섭다\"<\/td><td>상링마 13장<\/td><td>목동과 소, 대신들이 염불 소리에 귀를 막는 것, 노르부의 훔 연습은 창작<\/td><\/tr><tr><td>21<\/td><td>일곱 사람의 출가, 금강살타의 꿈, 바이로짜나와 렉둡, 산적에게 모래를 금으로, 쉬리 씽하, 빨리 걷는 법, 렉둡의 죽음, 인도 학자들의 꿈, \"<strong>몬빠 하나가 짐을 지고 지나갔다<\/strong>\", 인도 사람의 모함, 대신 넣은 구리 통, 속 빈 기둥, 다섯 편 번역, 왕비 체뽕싸, 짜와롱 유배, 이 구덩이, 왕후 렉셰 뺄모의 아들 뿌라르나, 유드라 닝뽀<\/td><td>상링마 14장<\/td><td>기둥 속 대화, 이 구덩이 문답, 노르부의 반응은 창작. 바이로짜나의 나이는 근거가 없어 쓰지 않음<\/td><\/tr><tr><td>22<\/td><td>세 역경사가 비말라미뜨라의 말을 활·배·강물로 다르게 알아들음, 왕과 절에 절하지 않음, 절의 뜻 문답, 첫 절에 비로자나상이 갈라짐, 두 번째 절의 빛과 낙성, 왕에게 절하자 <strong>왕의 옷이 그을림<\/strong>, 사자좌, \"남쪽 사람은 욕심이 많다\"는 왕의 생각, 모래 세 되가 금으로<\/td><td>상링마 16장<\/td><td>바이로짜나의 시험은 상링마 17장과 빼마 까탕을 합친 것. \"세 번째 황금\" 연결은 창작<\/td><\/tr><tr><td>23<\/td><td>초걜의 탄생과 이름, 구혼자들, 만다라 공양, 침푸의 고요·분노 만다라, 군신 스물다섯, 꽃 던지기, <strong>왕의 수명 56세에 13년 더함<\/strong>, 남카이 닝뽀가 햇살을 탐, 쌍계 예셰가 금강궐을 바위에 박고 150년을 삶, 독미 뺄기 예셰에게 업의 다끼니가 하녀처럼 시중, 응앤람 걜촉 양이 <strong>말 울음소리<\/strong>를 냄, 도제 뒤좀이 바위를 통과<\/td><td>상링마 19장, 꽁뚤, 위키 계열 자료<\/td><td>쌜낭과 초걜의 기억력 대결, 왕의 \"옷 열세 벌\" 농담은 창작. 상링마 19장은 랑 뺄기 쎙게도 침푸 명단에 넣으나 13장에서 이미 죽어 소설에서는 뺌<\/td><\/tr><tr><td>24<\/td><td>수호신을 청함, 뻬하르 예언(바따 호르의 명상원, 나무 새, 마왕 쉐르), 호랑이 갑옷 용사 백·아라한 백·검은 승려 백·춤꾼 사자 백, <strong>원숭이와 쥐 오백<\/strong>, 뻬까르 링, 팔부 신중의 서약, 법을 전하는 세 등급의 경계, 왕의 말 여섯·목걸이 '빛 타오름' 공양, <strong>\"남쪽 사람이라 재물을 좋아하신다\"는 왕의 의심<\/strong>, 옷자락에 모래와 자갈, 금과 터키석, 왕의 참회, 백자진언<\/td><td>상링마 20장, 꽁뚤(무룹 짼뽀의 호르 원정)<\/td><td>쥐가 창고를 지킨다는 것, \"도둑 출신이 제일\" 대사는 창작<\/td><\/tr><tr><td>25<\/td><td>뗄마 은닉, 사나운 모습의 도제 될뢰, 딱창이라 불리는 열세 곳<\/td><td>꽁뚤, 오걘 링빠 축약본<\/td><td>노르부와 초걜의 대화는 창작. 암호랑이가 초걜이라는 전승과 다르게 그림<\/td><\/tr><tr><td>26<\/td><td>샨따락시따가 말에 차여 입적, 까말라실라 예언, 왕의 죽음, 무네 짼뽀 독살 전승<\/td><td>꽁뚤, 위키 계열 자료<\/td><td>왕과의 마지막 대화는 창작(족첸의 마음 찾기를 풀어 씀)<\/td><\/tr><tr><td>27<\/td><td>나찰의 땅으로 갈 뜻, 백성의 만류, \"<strong>티벳 ○○들과 나는 맞지 않는다, 나는 인도로 간다<\/strong>\" 노래와 마지막 연, 왕·대신·승려·선지식·요기·백성·여인·의사·스승과 제자에게 남긴 유언, 대신의 네 종류, \"고칠 수 있으면 속상할 것 없고…\", \"늦게 눕고 일찍 일어나라\", 원숭이와 나찰녀의 티벳인 기원, 육자진언 108번, \"시대는 변하지 않는다\"<\/td><td>상링마 23~39장, 오걘 링빠 축약본<\/td><td>할머니의 \"남자들한테도\", 도제 뒤좀의 질문은 창작. 기원 설화의 세부(나찰녀의 협박)는 널리 알려진 판본을 따름<\/td><\/tr><tr><td>28<\/td><td>작별의 노래(독수리·물고기 비유, \"나를 따르라\" 후렴), 믿음이 가슴에서 일어나지 않으면, 나고 죽음에서 풀려나 가고 옴이 없음, 망율 고개, 다끼니가 받친 말, 원숭이달 초열흘의 약속, 남서쪽에서 돌아봄<\/td><td>상링마 41장(스피티본), 여의수 10장, 오걘 링빠 축약본<\/td><td>노래는 일부 연만 골라 옮김. 벼락 콩 장면은 창작<\/td><\/tr><tr><td>종장<\/td><td>상독 뺄리, 뗄뙨, 칠구기도문<\/td><td>꽁뚤, 전승 일반<\/td><td>기도문은 뜻풀이<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>이번 개정에서 초고와 달라진 주요 사실<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>초고<\/th><th>개정<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>상슝 여신 \"자뮌\"이 두 산을 닫아 일행을 짓누름, 스승이 일행을 데리고 허공으로 떠오름<\/td><td>장중의 전쟁 여신 <strong>무짜메<\/strong>가 두 산으로 둔갑해 스승과 일행 사이를 <strong>갈라놓음<\/strong>, 스승은 지팡이를 던져 바위에 올라섬<\/td><td>상링마 9장<\/td><\/tr><tr><td>벼락을 손가락에 감아 발우에 넣고 차를 끓임<\/td><td>손바닥 위의 호수에 떨어진 벼락이 <strong>마른 콩알<\/strong>이 됨<\/td><td>상링마 9장<\/td><\/tr><tr><td>냰첸 탕라가 머리는 돌궐, 꼬리는 캄에 닿는 흰 뱀<\/td><td>일행을 잡아먹으려는 <strong>큰 야차<\/strong>, 위협하는 손가락에 터키석 상투의 아이가 되어 <strong>맛없는 빵<\/strong>을 대접<\/td><td>상링마 9장<\/td><\/tr><tr><td>사호르 화형 뒤 마라띠까<\/td><td>마라띠까 뒤 자호르 화형, 그리고 우겐에서 <strong>두 번째<\/strong> 화형<\/td><td>상링마 4장, 꽁뚤<\/td><\/tr><tr><td>출가 스승 아난다 법맥<\/td><td>쁘라바하스띠<\/td><td>상링마 3장, 꽁뚤 (1차 개정에서 이미 고침)<\/td><\/tr><tr><td>낙성식에 불상이 걸어 나와 탑을 돎<\/td><td>비로자나상이 떠오름, 신들이 쏟아져 나왔다가 스승의 들숨에 빨려 들어감, 구리 개가 짖음<\/td><td>상링마 11장<\/td><\/tr><tr><td>왕과의 첫 만남 노래는 창작<\/td><td>상링마의 실제 노래로 교체<\/td><td>상링마 10장<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>고증상 유의점<\/h3>\n<p>1. <strong>체류 기간<\/strong>: 닝마 전승은 55년 6개월, 《바세》 계통은 훨씬 짧게 전합니다. 소설은 닝마 전승을 따랐습니다. 2. <strong>연대<\/strong>: 상링마는 호랑이해 착공·말해 완공·양해 낙성이라 하고, 사학계는 낙성을 779년 전후로 봅니다. 소설은 간지만 쓰고 서기 연도는 쓰지 않았습니다. 3. <strong>하샹 마하야나<\/strong>: 상링마 11장은 삼예의 석공 가운데 '비하샹 마하야나'를 듭니다. 흔히 알려진 삼예 논쟁의 중국 선사와 이름이 같지만, 소설에서는 원문대로 석공으로만 두었습니다. 4. <strong>뵌(Bön)<\/strong>: 소설의 대립 구도는 종교 간 선악이 아니라 궁정 정치의 갈등으로 그렸습니다. 5. <strong>어두운 장면<\/strong>: 2장의 아이의 죽음, 3장의 시신을 먹는 수행, 20장의 랑 뺄기 쎙게의 죽음, 21장의 구리 통에 대신 넣은 사람은 모두 원전에 있는 내용입니다. 소설은 미화하지 않고, 인물(노르부)의 반응으로 무게를 남겼습니다. 6. <strong>밀교 수행의 세부<\/strong>: 관정·수행 차제의 구체 내용은 의도적으로 담지 않았습니다. 4장의 꾼가모 관정도 원전의 표현을 완곡하게 옮겼습니다. 7. <strong>표기<\/strong>: 티벳어 한글 표기는 통일된 규범이 없어 발음에 가깝게 적었습니다. 상링마 번역본과 표기가 다른 곳이 있습니다(예: 소설 '쎙게 다독' / 번역본 '사자후').<\/p>", "chars": 6762, "appendix": true}, {"id": "a2", "label": "부록", "title": "영상화 노트", "epigraph": null, "part": null, "html": "<h3>구성 제안: 시즌 1 (16화) + 시즌 2 (8화)<\/h3>\n<p>시즌 1은 여정과 삼예까지, 시즌 2는 삼예 이후의 제자들과 작별입니다. 1부(인도 시절)는 회상으로 나누어 넣습니다.<\/p>\n<h3>시즌 1 — 설산을 넘는 길<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>화<\/th><th>제목<\/th><th>원작 장<\/th><th>핵심 장면<\/th><th>가르침<\/th><th>웃음 포인트<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>밤마다 무너지는 절<\/td><td>서장, 6<\/td><td>흙에서 쌀이 솟음, 밤마다 무너지는 담, 노스승의 \"솔직히 모르겠습니다\"<\/td><td>모르는 것을 모른다고 하기<\/td><td>아무도 사신으로 안 가려는 대전<\/td><\/tr><tr><td>2<\/td><td>옷까지 벗어 바친 사신들<\/td><td>7 (+1장 회상)<\/td><td>석 달 기다린 스승, 속옷 바람의 사신들, 산이 좌우로 바뀜<\/td><td>욕심으로 쥐면 흙<\/td><td>금을 깨물어 보는 무사, \"무역 적자?\"<\/td><\/tr><tr><td>3<\/td><td>두 산이 갈라놓은 길<\/td><td>8 (+2장 회상)<\/td><td>갈라진 일행, 오를수록 커지는 산, 바위를 칭찬하며 오르는 스승<\/td><td>교만<\/td><td>\"이 산, 내가 올라갈수록 커지는데?\"<\/td><\/tr><tr><td>4<\/td><td>벼락이 콩이 되던 날<\/td><td>9 (+5장 회상: 두 번의 화형)<\/td><td>벼락 → 마른 콩, 끓는 호수, 외눈의 여신<\/td><td>분노<\/td><td>벼락 콩을 먹어 보려는 무사<\/td><\/tr><tr><td>5<\/td><td>열두 자매의 마을<\/td><td>10<\/td><td>주먹으로 산 던지기, 세 개의 환영, 문턱의 노르부<\/td><td>탐욕, 무상<\/td><td>산을 공깃돌처럼, 풀 뜯는 노새<\/td><\/tr><tr><td>6<\/td><td>염소를 탄 대장장이<\/td><td>11<\/td><td>몸을 통과하는 망치<\/td><td>질투, 수희<\/td><td>\"배가 아프다\"<\/td><\/tr><tr><td>7<\/td><td>배고픈 귀신들<\/td><td>12 (+3장 회상: 시체숲의 부자)<\/td><td>보릿가루 연기<\/td><td>보시, 회향, 보리심<\/td><td>(이 화는 웃음보다 울림)<\/td><\/tr><tr><td>8<\/td><td>흰 야크<\/td><td>13<\/td><td>화이트아웃, 숨소리의 박자, 네 수인<\/td><td>어리석음, 알아차림<\/td><td>\"야크 쪽이 더 멋있었습니까?\"<\/td><\/tr><tr><td>9<\/td><td>맛없는 잔치<\/td><td>14<\/td><td>산만 한 야차와 까딱이는 손가락, 맛없는 빵, 스승의 재채기<\/td><td>아집, '나'라는 양념<\/td><td>\"…씨.\" / 맛없는 빵 / \"나도 몸이 있는데\"<\/td><\/tr><tr><td>10<\/td><td>지팡이 끝의 샘<\/td><td>15<\/td><td>꽃 뿌리는 게녠들, 되돌아간 저주, 바위의 샘<\/td><td>받지 않은 선물<\/td><td>\"이 바위는 짼이 코를 골아요\"<\/td><\/tr><tr><td>11<\/td><td>절하지 않는 왕<\/td><td>16<\/td><td>서로 절을 기다리는 두 사람, 노래, 타는 옷<\/td><td>옷에 절하는 사람들<\/td><td>한 식경 동안의 대치, 오줌 싸는 말<\/td><\/tr><tr><td>12<\/td><td>입맛 까다로운 산신<\/td><td>17<\/td><td>갈고리로 끌려온 마첸<\/td><td>남과 다르고 싶은 마음<\/td><td>\"꼬마 중\", \"마른 걸로 주세요\"<\/td><\/tr><tr><td>13<\/td><td>헤뽀리의 금강무<\/td><td>18<\/td><td>노을 속 허공의 춤, 밤반·낮반, 흰 말 탄 용<\/td><td>몸·말·마음이 한 방향<\/td><td>석공의 숯 메모<\/td><\/tr><tr><td>14<\/td><td>다들 안으로 들어가시오<\/td><td>19 (+4장 회상: 물동이)<\/td><td>쏟아져 나온 신들과 스승의 들숨, 짖는 구리 개<\/td><td>서원의 힘<\/td><td>\"전생에 벌레였소\"<\/td><\/tr><tr><td>15<\/td><td>해를 붙잡은 비구<\/td><td>20<\/td><td>세 번의 따귀, 멈춘 해, \"훔 훔 훔\"<\/td><td>스승의 말을 반만 믿으면<\/td><td>따귀 세 번, 해 안 져서 당황한 소들<\/td><\/tr><tr><td>16<\/td><td>몬빠 하나가 지나갔소<\/td><td>21<\/td><td>인도의 해를 짊어진 젊은이, 속 빈 기둥, 이 구덩이<\/td><td>귀신보다 사람이 어렵다<\/td><td>기둥 속 대화, 이 구덩이 문답<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>시즌 2 — 구리빛 산으로<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>화<\/th><th>제목<\/th><th>원작 장<\/th><th>핵심 장면<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>임금님의 옷은 또 탄다<\/td><td>22<\/td><td>비말라미뜨라의 절, 갈라지는 불상, 또 그을리는 왕의 옷, 두 번째 황금<\/td><\/tr><tr><td>2<\/td><td>침푸의 꽃<\/td><td>23<\/td><td>눈을 가리고 던지는 꽃, 말 울음소리, 바위를 지나는 무사<\/td><\/tr><tr><td>3<\/td><td>삼예의 창고지기<\/td><td>24<\/td><td>나무 새의 왕과 원숭이·쥐 오백, 세 번째 황금<\/td><\/tr><tr><td>4<\/td><td>호랑이 굴<\/td><td>25<\/td><td>도제 될뢰, 뗄마<\/td><\/tr><tr><td>5<\/td><td>마지막 귀신<\/td><td>26<\/td><td>왕과의 마지막 밤<\/td><\/tr><tr><td>6<\/td><td>나는 인도로 간다<\/td><td>27<\/td><td>투덜이 노래, 유언들, 티벳인의 기원<\/td><\/tr><tr><td>7<\/td><td>나를 따르라<\/td><td>28<\/td><td>궁탕 고개, 벼락 콩<\/td><\/tr><tr><td>8<\/td><td>달마다 초열흘<\/td><td>종장<\/td><td>현대의 초열흘 저녁<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>반복 장치 (시리즈의 문법)<\/h3>\n<ul><li><strong>\"무섭습니다\"<\/strong>: 노르부가 매 화 두려움을 말로 꺼냅니다. 마지막 화의 \"찾아보니 없습니다\"가 회수 지점입니다.<\/li><li><strong>벼락 콩 세 알<\/strong>: 4화에서 받고, 시즌 내내 주머니를 만지작거리고, 마지막 화에서 어린 사미에게 넘깁니다.<\/li><li><strong>\"보이는 모든 것이 황금이다\"<\/strong>: 사신들(2화) → 비말라미뜨라(시즌2 1화) → 의심하는 왕(시즌2 3화). 쌜낭이 장부에 \"첫 번째, 두 번째, 세 번째\"를 적는 컷으로 묶습니다.<\/li><li><strong>타는 왕의 옷<\/strong>: 11화(통째로 탐) → 시즌2 1화(그을림). \"두 번째로 아끼는 옷\", \"세 번째로 아끼는 옷\" 대사로 이어집니다.<\/li><li><strong>쌜낭의 장부<\/strong>: 모든 화의 끝 컷을 장부 한 줄로 맺습니다. 마지막 장부는 \"결산: 남는 장사\".<\/li><li><strong>맹세 장면<\/strong>: 매 화 절정은 처치가 아니라 '심장의 정수를 손에 올려놓는' 동작입니다. 같은 구도, 같은 음악 동기를 씁니다.<\/li><li><strong>뚝심이<\/strong>: 위험 앞에서 먼저 멈추는 노새. 탕라 앞에서 처음으로 뒷걸음질 칩니다.<\/li><li><strong>대장장이의 망치 소리 \"땅\"<\/strong>: 맹세가 맺어질 때마다 한 번. 마지막 화의 고갯마루에서도 한 번.<\/li><\/ul>\n<h3>인물 비주얼 메모<\/h3>\n<ul><li><strong>구루 린뽀체<\/strong>: 연꽃 모자, 카땀가, 금강저. 나이를 알 수 없는 얼굴. 싸울 때보다 앉아 있을 때가 더 무서워 보이도록. 보릿가루를 먹고, 재채기를 하는, 유머가 있는 인물.<\/li><li><strong>조복 대상<\/strong>: 무짜메(터키석 장식의 거인 여인 → 두 산), 남맨 카르모/샤메(얼음 몸 → 뼈 → 외눈), 열두 땐마(평범한 여인들 → 각기 다른 탈것의 여신), 도제 렉빠(검은 얼굴, 넓은 모자, 염소), 얄하 샴뽀(산을 거꾸로 세운 만 한 흰 야크 → 흰 머리채 소년), 탕라(산맥 위의 야차 → 볼 빨간 터키석 상투 아이), 마첸(모자 쓴 늙은 대신, 보배 가루 그릇), 뻬하르(나무 새를 탄 검은 왕과 원숭이·쥐 행렬), 도제 될뢰(검붉은 분노존, 암호랑이).<\/li><li>탕카의 도상을 따르되, 조복 대상의 디자인은 '혐오'보다 '위엄과 상처'가 보이게.<\/li><\/ul>\n<h3>제작 시 권고<\/h3>\n<ul><li>진언·기도문·수인은 실제 종교 의례 요소이므로 닝마 전통의 자문을 받아 정확히 쓰시기를 권합니다.<\/li><li>분노존과 수행 반려(만다라와, 샤꺄데비, 예셰 초걜), 4장의 관정 장면은 선정적·오락적 소비가 되지 않도록 주의가 필요합니다.<\/li><li>원전의 어두운 장면(아이의 죽음, 시신을 먹는 수행, 구리 통)은 웃음 장면과 같은 화에 넣지 않는 편이 좋습니다.<\/li><\/ul>", "chars": 2622, "appendix": true}]};
(function(){
"use strict";
const $ = id => document.getElementById(id);
const KEY = "yeonhwa-reader-v1";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const saved = store.get();
const HOST_THEME = document.documentElement.getAttribute("data-theme");
const state = {
  ch: 0, page: 0, pages: 1, perView: 1, step: 0, colW: 0, gap: 0,
  settings: Object.assign({theme:"auto", font:"serif", fs:18, lh:1.9, layout:"auto"}, saved.settings || {}),
  marks: Array.isArray(saved.marks) ? saved.marks : [],
  read: saved.read || {},
  pos: saved.pos || null
};
const CH = BOOK.chapters;
const story = CH.filter(c => !c.appendix);
const totalChars = story.reduce((a,c)=>a+c.chars,0);
const FONTS = {
  serif: '"Noto Serif KR","Gowun Batang","Nanum Myeongjo",serif',
  batang: '"Gowun Batang","Noto Serif KR",serif',
  sans: '"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif'
};

function persist(){
  store.set({settings: state.settings, marks: state.marks, read: state.read,
    pos: {ch: CH[state.ch].id, frac: frac()}});
}
function frac(){ return state.pages > 1 ? state.page / (state.pages - 1) : 0; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1600); }

/* ── 표지 ── */
$("coverBlurb").textContent = BOOK.blurb;
if (state.pos && CH.some(c=>c.id===state.pos.ch)) {
  const c = CH.find(c=>c.id===state.pos.ch);
  $("btnResume").hidden = false;
  $("btnResume").textContent = "이어 읽기 · " + (c.label ? c.label + " " : "") + c.title;
}
function showCover(on){
  $("cover").hidden = !on;
  document.body.classList.toggle("on-cover", on);
}

/* ── 설정 적용 ── */
function applySettings(){
  const s = state.settings, root = document.documentElement;
  if (s.theme === "auto") { if (HOST_THEME) root.setAttribute("data-theme", HOST_THEME); else root.removeAttribute("data-theme"); } else root.setAttribute("data-theme", s.theme);
  root.style.setProperty("--fs", s.fs + "px");
  root.style.setProperty("--lh", s.lh);
  root.style.setProperty("--font-body", FONTS[s.font] || FONTS.serif);
  document.body.classList.toggle("scroll-mode", s.layout === "scroll");
  for (const [id,key] of [["segTheme","theme"],["segFont","font"],["segLayout","layout"]])
    for (const b of $(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === String(s[key])));
  $("rngFs").value = s.fs; $("valFs").textContent = s.fs + "px";
  $("rngLh").value = s.lh; $("valLh").textContent = Number(s.lh).toFixed(1);
}

/* ── 장 렌더링 ── */
function chapterHTML(i){
  const c = CH[i]; let h = "";
  if (c.part) h += `<section class="part-page"><div class="lbl">${c.part.label}</div><div class="ttl">${c.part.title}</div><div class="rule"></div></section>`;
  h += `<header class="ch-head"><div class="lbl">${c.label || ""}</div><h2 class="ttl">${c.title}</h2>${c.epigraph ? `<p class="epi">${c.epigraph}</p>` : ""}</header>`;
  h += c.html;
  const nx = CH[i+1];
  h += `<footer class="ch-end"><div class="fin">${c.appendix ? "" : "· · ·"}</div>` +
       (nx ? `<button class="next" data-go="${i+1}"><small>다음</small>${nx.label ? nx.label + " · " : ""}${nx.title}</button>`
           : `<button class="next" data-go="cover"><small>끝</small>표지로 돌아가기</button>`) + `</footer>`;
  return h;
}

function layout(keepFrac){
  const f = keepFrac == null ? frac() : keepFrac;
  const flow = $("flow"), vp = $("viewport"), book = $("book");
  if (state.settings.layout === "scroll") {
    flow.style.columnWidth = ""; flow.style.columnGap = "";
    book.classList.remove("spread"); book.style.padding = "";
    state.pages = 101; state.page = 0;
    updateChrome(); return;
  }
  const stage = $("stage");
  const cs = getComputedStyle(stage);
  const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let mode = state.settings.layout;
  if (mode === "auto") mode = (W >= 900 && W / H > 1.15) ? "spread" : "single";
  if (mode === "spread" && W < 640) mode = "single";
  const per = mode === "spread" ? 2 : 1;
  const fs = state.settings.fs;
  const padX = Math.round(Math.max(20, Math.min(64, (per===2 ? W/2 : W) * 0.075)));
  const padTop = Math.round(Math.max(28, Math.min(56, H * 0.07)));
  const padBot = padTop + 18;
  const maxPageW = Math.round(fs * 34);
  let pageW = Math.min(per === 2 ? W/2 : W, maxPageW + padX*2);
  const bookW = Math.floor(pageW * per);
  const bookH = Math.floor(Math.min(H, pageW * (per===2 ? 1.42 : 1.6)));
  const colW = Math.floor(pageW - padX*2);
  const gap = padX*2;
  book.style.width = bookW + "px"; book.style.height = bookH + "px";
  book.style.padding = `${padTop}px ${padX}px ${padBot}px`;
  book.classList.toggle("spread", per === 2);
  vp.style.width = (colW*per + gap*(per-1)) + "px";
  vp.style.height = (bookH - padTop - padBot) + "px";
  flow.style.columnWidth = colW + "px";
  flow.style.columnGap = gap + "px";
  flow.style.columnCount = "auto";
  state.perView = per; state.colW = colW; state.gap = gap; state.step = (colW + gap) * per;
  const cols = Math.max(1, Math.round((flow.scrollWidth + gap) / (colW + gap)));
  state.pages = Math.max(1, Math.ceil(cols / per));
  state.page = Math.min(state.pages - 1, Math.round(f * (state.pages - 1)));
  $("folioL").style.left = padX + "px";
  $("folioR").style.right = padX + "px";
  move(false);
}

function move(anim){
  const flow = $("flow");
  if (!anim) flow.classList.add("no-anim");
  flow.style.transform = `translateX(${-state.page * state.step}px)`;
  if (!anim) { void flow.offsetWidth; flow.classList.remove("no-anim"); }
  updateChrome();
}

function updateChrome(){
  const c = CH[state.ch];
  $("running").innerHTML = (c.label ? `${c.label} · ` : "") + `<b>${c.title}</b>`;
  const scroll = state.settings.layout === "scroll";
  const base = state.page * state.perView + 1;
  const totalCols = state.pages * state.perView;
  if (scroll) { $("pageno").textContent = ""; $("folioL").textContent = $("folioR").textContent = ""; }
  else if (state.perView === 2) {
    $("folioL").textContent = base; $("folioR").textContent = base + 1 <= totalCols ? base + 1 : "";
    $("pageno").textContent = `${base}–${Math.min(base+1,totalCols)} / ${totalCols}쪽`;
  } else {
    $("folioL").textContent = ""; $("folioR").textContent = base;
    $("pageno").textContent = `${base} / ${totalCols}쪽`;
  }
  const idx = story.indexOf(c);
  let pct = 100;
  if (idx >= 0) {
    const before = story.slice(0, idx).reduce((a,x)=>a+x.chars,0);
    pct = Math.min(100, (before + frac() * c.chars) / totalChars * 100);
  }
  $("progress").style.width = pct.toFixed(2) + "%";
  document.querySelector(".progress").setAttribute("aria-valuenow", Math.round(pct));
  $("btnPrev").disabled = state.ch === 0 && state.page === 0;
  const marked = state.marks.some(m => m.ch === c.id && Math.abs(m.frac - frac()) < 0.5 / Math.max(1, state.pages));
  $("btnMark").setAttribute("aria-pressed", String(marked));
  if (state.pages > 1 ? state.page === state.pages - 1 : true) { state.read[c.id] = true; }
  document.querySelectorAll(".toc a").forEach(a => {
    a.classList.toggle("cur", a.dataset.id === c.id);
    a.classList.toggle("read", !!state.read[a.dataset.id]);
  });
  try { history.replaceState(null, "", "#" + c.id); } catch(e) {}
  persist();
}

function openChapter(i, where){
  state.ch = Math.max(0, Math.min(CH.length - 1, i));
  const flow = $("flow");
  flow.innerHTML = chapterHTML(state.ch);
  flow.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    if (b.dataset.go === "cover") { showCover(true); return; }
    openChapter(+b.dataset.go, 0);
  }));
  showCover(false);
  const f = where === "end" ? 1 : (typeof where === "number" ? where : 0);
  if (state.settings.layout === "scroll") {
    layout(0);
    requestAnimationFrame(() => {
      const max = document.documentElement.scrollHeight - innerHeight;
      window.scrollTo(0, Math.max(0, max * f));
    });
  } else {
    state.page = 0; layout(f);
  }
}

function next(){
  if (state.settings.layout === "scroll") { window.scrollBy({top: innerHeight * .85, behavior: "smooth"}); return; }
  if (state.page < state.pages - 1) { state.page++; move(true); }
  else if (state.ch < CH.length - 1) openChapter(state.ch + 1, 0);
}
function prev(){
  if (state.settings.layout === "scroll") { window.scrollBy({top: -innerHeight * .85, behavior: "smooth"}); return; }
  if (state.page > 0) { state.page--; move(true); }
  else if (state.ch > 0) openChapter(state.ch - 1, "end");
}

/* ── 목차·책갈피 ── */
function buildToc(){
  const toc = $("toc"); let h = "";
  CH.forEach((c,i) => {
    if (c.part) h += `<div class="part">${c.part.label}<span>${c.part.title}</span></div>`;
    h += `<a href="#${c.id}" data-i="${i}" data-id="${c.id}"><span class="n">${c.label||""}</span><span class="t">${c.title}</span><span class="dot" aria-hidden="true"></span></a>`;
  });
  toc.innerHTML = h;
  toc.querySelectorAll("a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); closeAll(); openChapter(+a.dataset.i, 0); }));
}
function buildMarks(){
  const box = $("marks");
  if (!state.marks.length) { box.innerHTML = `<p class="empty">아직 책갈피가 없습니다.<br>읽다가 위쪽의 책갈피 단추를 누르면 여기에 남습니다.</p>`; return; }
  box.innerHTML = state.marks.map((m,k) => {
    const c = CH.find(x => x.id === m.ch); if (!c) return "";
    return `<div class="mark" data-k="${k}"><div class="t">${c.label ? c.label + " · " : ""}${c.title}<small>${Math.round(m.frac*100)}% 지점 · ${new Date(m.t).toLocaleDateString("ko-KR")}</small></div><button aria-label="책갈피 지우기" data-del="${k}">✕</button></div>`;
  }).join("");
  box.querySelectorAll(".mark").forEach(el => el.addEventListener("click", e => {
    if (e.target.dataset.del != null) { state.marks.splice(+e.target.dataset.del, 1); persist(); buildMarks(); updateChrome(); return; }
    const m = state.marks[+el.dataset.k]; closeAll(); openChapter(CH.findIndex(c => c.id === m.ch), m.frac);
  }));
}
function toggleMark(){
  const c = CH[state.ch], f = frac();
  const tol = 0.5 / Math.max(1, state.pages);
  const k = state.marks.findIndex(m => m.ch === c.id && Math.abs(m.frac - f) < tol);
  if (k >= 0) { state.marks.splice(k, 1); toast("책갈피를 지웠습니다"); }
  else { state.marks.unshift({ch: c.id, frac: f, t: Date.now()}); toast("책갈피를 끼웠습니다"); }
  persist(); updateChrome();
}
function setTab(which){
  $("tabToc").setAttribute("aria-selected", String(which === "toc"));
  $("tabMarks").setAttribute("aria-selected", String(which === "marks"));
  $("toc").hidden = which !== "toc"; $("marks").hidden = which !== "marks";
  if (which === "marks") buildMarks();
}
function openToc(){
  $("drawer").classList.add("show"); $("scrim").classList.add("show");
  setTab("toc");
  const cur = $("toc").querySelector("a.cur"); if (cur) cur.scrollIntoView({block: "center"});
}
function closeAll(){
  $("drawer").classList.remove("show"); $("scrim").classList.remove("show");
  $("panel").classList.remove("show"); $("btnSettings").setAttribute("aria-expanded","false");
}

/* ── 이벤트 ── */
$("btnStart").onclick = () => openChapter(0, 0);
$("btnResume").onclick = () => openChapter(CH.findIndex(c => c.id === state.pos.ch), state.pos.frac || 0);
$("btnCoverToc").onclick = () => { showCover(false); if (!$("flow").innerHTML) openChapter(0,0); openToc(); };
$("btnToc").onclick = openToc;
$("btnCloseToc").onclick = closeAll;
$("scrim").onclick = closeAll;
$("btnHome").onclick = () => { closeAll(); showCover(true); };
$("btnGoCover").onclick = () => { closeAll(); showCover(true); };
$("btnGoStart").onclick = () => { closeAll(); openChapter(0, 0); };
$("tabToc").onclick = () => setTab("toc");
$("tabMarks").onclick = () => setTab("marks");
$("btnMark").onclick = toggleMark;
$("btnSettings").onclick = e => {
  e.stopPropagation();
  const on = !$("panel").classList.contains("show");
  $("panel").classList.toggle("show", on); $("btnSettings").setAttribute("aria-expanded", String(on));
};
document.addEventListener("click", e => {
  if ($("panel").classList.contains("show") && !$("panel").contains(e.target) && e.target !== $("btnSettings")) {
    $("panel").classList.remove("show"); $("btnSettings").setAttribute("aria-expanded","false");
  }
});
$("btnPrev").onclick = prev; $("btnNext").onclick = next;
$("tapPrev").onclick = prev; $("tapNext").onclick = next;
$("tapMid").onclick = () => document.body.classList.toggle("ui-hidden");

function seg(id, key, conv){
  $(id).querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const f = frac(); state.settings[key] = conv ? conv(b.dataset.v) : b.dataset.v;
    applySettings(); relayout(f);
  }));
}
seg("segTheme","theme"); seg("segFont","font"); seg("segLayout","layout");
$("rngFs").addEventListener("input", e => { const f=frac(); state.settings.fs = +e.target.value; applySettings(); relayout(f); });
$("rngLh").addEventListener("input", e => { const f=frac(); state.settings.lh = +(+e.target.value).toFixed(1); applySettings(); relayout(f); });
function relayout(f){
  if (!$("flow").innerHTML) { persist(); return; }
  if (state.settings.layout === "scroll") openChapter(state.ch, f); else layout(f);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (!$("cover").hidden) { if (e.key === "Enter") ($("btnResume").hidden ? $("btnStart") : $("btnResume")).click(); return; }
  if (e.key === "Escape") { closeAll(); return; }
  if ($("drawer").classList.contains("show")) return;
  if (["ArrowRight","PageDown"].includes(e.key) || (e.key === " " && !e.shiftKey && state.settings.layout !== "scroll")) { e.preventDefault(); next(); }
  else if (["ArrowLeft","PageUp"].includes(e.key) || (e.key === " " && e.shiftKey && state.settings.layout !== "scroll")) { e.preventDefault(); prev(); }
  else if (e.key === "t" || e.key === "T") openToc();
  else if (e.key === "b" || e.key === "B") toggleMark();
});

let sx = null, sy = null;
$("book").addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") { sx = e.clientX; sy = e.clientY; } });
$("book").addEventListener("pointerup", e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = sy = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3 && state.settings.layout !== "scroll") { dx < 0 ? next() : prev(); }
});
window.addEventListener("scroll", () => {
  if (state.settings.layout !== "scroll" || !$("cover").hidden) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  const f = max > 0 ? scrollY / max : 0;
  state.pages = 101; state.page = Math.round(f * 100);
  clearTimeout(window._st); window._st = setTimeout(() => { updateChrome(); }, 120);
}, {passive: true});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); const f = frac(); rt = setTimeout(() => { if ($("flow").innerHTML && state.settings.layout !== "scroll") layout(f); }, 120); });

/* ── 시작 ── */
applySettings();
buildToc();
const hash = location.hash.slice(1);
const hi = CH.findIndex(c => c.id === hash);
if (hi >= 0) {
  const f = state.pos && state.pos.ch === hash ? state.pos.frac : 0;
  openChapter(hi, f);
} else {
  showCover(true);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if ($("flow").innerHTML && state.settings.layout !== "scroll") layout(frac()); });
})();
</script>
</body>
